name: corpus checks

# The gates live in the repo that holds the data they check.
#
# Each knowledge/operator/<operator>/corpus/ contains source observations, curated
# cards and generated reading pages. Validate their schemas, ownership, references and
# generated artifacts without a consumer checkout.
#
# Source extraction and citation audits read AITER git objects pinned by corpus/catalog.yaml.
# Run tools/corpus/extract.py --check and validate.py --verify-source when refreshing sources;
# this offline job does not fetch the upstream repository or execute GPU tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pyyaml

      # The rendered pages are generated artifacts. A hand-edit to one of them, or an edit to
      # the evidence without a re-render, makes the page a claim nothing backs.
      - name: rendered pages match their inputs
        run: |
          set -e
          python3 tools/corpus/build.py --check

      # Schema, provenance, citation grounding, and the no-performance-number rule on source
      # evidence. Tests also check shared links and reproducible extraction from pinned git objects.
      - name: repo tests
        run: python3 -m pytest -q
