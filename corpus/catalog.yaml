schema_version: 1

# The authoring languages a corpus record may be keyed on.  This list lives HERE, with the
# data, and not in the consumer's card tooling, because it is the join key between a corpus
# record and a learned card: a corpus keyed on its own private language names cannot be
# joined to a card, which is the entire point of putting `language:` on a card.
#
# Direction of the contract: this file DECLARES, a consumer CONFORMS.  GEAK's
# `kernel_workflow/scripts/kb.py` holds `AUTHORING_LANGUAGES`, and its own test asserts that
# constant equals this list for whatever knowledge dir it is pointed at.  So the vocabulary
# has one home and two enforced readers, instead of two copies that drift.
#
# Library/auto backends (`aiter`, `hipblaslt`, ...) are NOT languages: a record whose finding
# is "call this library" is not a record about how a kernel was written.
authoring_languages:
  - triton
  - flydsl
  - hip
  - ck
  - asm
  - tilelang
  - gluon
  - rocwmma
  - hipkittens
  - mojo
  - cutlass_port

# One discovery surface for every operator/pattern corpus.  Source evidence,
# curated decisions, generated human pages and optional benchmark adapters stay
# separate artifacts; the catalog only says which files belong to one family.
#
# `patterns` lists every taxonomy operator id (index/taxonomy.md) this family's
# cards speak to, so a TechLead that resolved `kk_operator` from the taxonomy
# reaches the decision page instead of an unknown-family error. `grouped_gemm_moe`
# is the taxonomy's grouped GEMM (one GEMM per expert over a sorted token layout)
# and sits in its GEMM family.
#
# The MoE operators -- `fused_moe_grouped_gemm`, `moe_routing_topk`,
# `moe_dispatch_combine` -- have NO family here yet, so resolving one raises
# `no corpus family publishes operator/pattern ...`. That is the intended answer
# rather than a gap to paper over: the fused MoE kernel is a routing-and-layout
# problem whose decisions are not the dense GEMM's, and listing it under `gemm`
# to avoid the error would hand a TechLead tiling advice for a kernel whose cost
# is in the sort. A MoE family belongs in a later corpus with its own evidence.
families:
  - id: gemm
    patterns:
      - gemm
      - dense_gemm
      - scaled_quant_gemm
      - grouped_gemm_moe
      - batched_gemm
      - splitk_streamk_gemm
      - skinny_gemv_decode
      - gemm_epilogue_fused
    source_evidence: evidence/gemm_source.yaml
    tuned_evidence: evidence/gemm_tuned_configs.yaml
    tuned_db_evidence: evidence/gemm_csv_tuned_configs.yaml
    performance_axes: performance_axes/gemm.yaml
    # The two modules a consumer is allowed to load out of this repo, named here so it
    # resolves them through the catalog rather than importing them as siblings. Both are
    # pure functions over text -- `source_extractor.scan_file` turns a source file into
    # records, `performance_normalizer.model_summary`/`.normalize_implementation` put
    # performance claims in comparable units. A consumer that reached past the catalog for
    # them would be depending on this repo's directory layout instead of its interface.
    performance_normalizer: _normalize_performance_decisions.py
    source_extractor: _extract_impl_facts.py
    # WHICH aiter files this family's evidence is read from. Data, not code: `_extract_impl_facts.py`
    # holds the rules (what a tiling or an arch gate looks like) and is shared by every family, so
    # adding an operator is adding a scope file and this line -- never an edit to the extractor.
    source_scope: scopes/gemm.yaml
    decisions: decisions/gemm.yaml
    source_document: gemm_source_evidence.md
    decision_document: gemm_decisions.md
    seed_documents:
      - gemm_triton_seeds.md
    # No `benchmark_manifest`: how to RUN a benchmark is the consumer's business and its
    # manifest lives with the consumer. Declaring it here would make this catalog name a path
    # that does not exist in this repo, which is exactly the kind of claim the gates exist to
    # refuse.
