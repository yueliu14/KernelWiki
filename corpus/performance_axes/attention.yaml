schema_version: 1
family: attention
contract:
  source_observation: A source observation is implementation evidence, not measured preference.
  attribution: Whole-implementation performance must not be assigned to an isolated axis.
comparison_context:
  required:
  - operator_family
  - math_contract
  - dtype
  - gfx
  - shape
  - layout
  - baseline
  - accounting
  - aiter_commit
  - toolchain
  contract: Different masks, scale formats, index conventions, routing or state semantics define different
    workloads.
development_order:
- step: 1
  title: Workload semantics and layout
  axes:
  - attention_semantics
  - cache_layout
  - sparse_selection
  - recurrent_state
- step: 2
  title: Legal implementation and numerical contracts
  axes:
  - implementation_contract
  - numerical_contract
- step: 3
  title: Partition and structural candidates
  axes:
  - kv_partition
  - compression
  - execution_geometry
- step: 4
  title: Data movement and compute scheduling
  axes:
  - data_movement
  - compute_schedule
axes:
- id: implementation_contract
  kind: integration_contract
  question: What declarations, dispatch gates, shape checks and host state define a legal implementation?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - symbol_declaration
    - arch_gate
    - config_limit
    - config_space
    - config_validity
    - kernel_family
    - jit_cache
    - asm_object
    - asm_argblock
    - config_lookup
    - dispatch_padding
    - tunable_param
    - instance_name
  knob_aliases: {}
- id: execution_geometry
  kind: performance_choice
  question: How much work does each program own and how is the grid mapped?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - tile_shape
    - waves
    - split_k
    - persistent
    - grid_mapping
    - grid_fill
    - asm_tile
    - asm_launch
  knob_aliases:
    query_tile:
    - BLOCK_M
    - TILE_Q
    - block_q
    kv_tile:
    - BLOCK_N
    - BLOCK_KV
    - TILE_SIZE
    waves:
    - num_warps
    - NUM_WARPS
    - waves_per_eu
- id: compute_schedule
  kind: performance_choice
  question: Which compute, reduction and scheduling structures are written explicitly?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - mfma_intrinsic
    - mfma_shape
    - scheduling
    - ck_instance
    - ck_pipeline
    - pipeline_variant
    - lane_reduction
    - atomic_combine
  knob_aliases: {}
- id: data_movement
  kind: performance_choice
  question: How do data move between global memory, LDS and registers?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - lds_stage
    - lds_swizzle
    - lds_pad
    - lds_alloc
    - async_copy
    - access_width
    - cache_policy
    - layout_preshuffle
    - layout_transpose
    - layout_epilogue
    - fragment_layout
  knob_aliases:
    stages:
    - num_stages
    - lds_stage
    - STAGES
    async_copy:
    - use_async_copy
    - async_copy
- id: numerical_contract
  kind: hard_constraint
  question: Which scale, precision and parity conventions must remain unchanged?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - scale_operand
    - scale_in_k_loop
    - scale_after_k_loop
    - parity_tolerance
  knob_aliases: {}
- id: attention_semantics
  kind: hard_constraint
  question: What are the score, mask, head-mapping and normalization semantics?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: cache_layout
  kind: integration_contract
  question: How are logical KV positions, physical pages and cache formats related?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: kv_partition
  kind: performance_choice
  question: How are query and KV work partitioned, and how are partials merged?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: sparse_selection
  kind: hard_constraint
  question: What do selected slots, valid counts and sentinels mean?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: compression
  kind: structural_choice
  question: What compression window and output-cache contract is implemented?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: recurrent_state
  kind: hard_constraint
  question: Which recurrent state is read, updated and written for the next token?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
dependencies:
- id: partition-merge
  axes:
  - kv_partition
  - attention_semantics
  - numerical_contract
  relation: coupled_contract
  rule: A KV split must preserve and merge the normalization statistics.
  decision_refs:
  - attention-split-kv-merge
- id: page-mask
  axes:
  - cache_layout
  - attention_semantics
  - sparse_selection
  relation: coupled_contract
  rule: Physical addressing does not replace logical validity masks.
  decision_refs:
  - attention-paged-kv-addressing
  - attention-sparse-selected-slots
- id: compression-format
  axes:
  - compression
  - cache_layout
  - numerical_contract
  relation: coupled_contract
  rule: Compression output packing and scales must match the next cache consumer.
  decision_refs:
  - attention-compression-cache-contract
- id: state-lifetime
  axes:
  - recurrent_state
  - implementation_contract
  relation: coupled_contract
  rule: State read/write indices and storage layout define the next token input.
  decision_refs:
  - attention-gated-delta-state-contract
