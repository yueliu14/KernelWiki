schema_version: 1
family: moe
contract:
  source_observation: A source observation is implementation evidence, not measured preference.
  attribution: Whole-implementation performance must not be assigned to an isolated axis.
comparison_context:
  required:
  - operator_family
  - math_contract
  - dtype
  - gfx
  - shape
  - layout
  - baseline
  - accounting
  - aiter_commit
  - toolchain
  contract: Different masks, scale formats, index conventions, routing or state semantics define different
    workloads.
development_order:
- step: 1
  title: Workload semantics and layout
  axes:
  - routing_semantics
  - expert_layout
  - combine
  - shared_expert
  - communication
- step: 2
  title: Legal implementation and numerical contracts
  axes:
  - implementation_contract
  - numerical_contract
- step: 3
  title: Partition and structural candidates
  axes:
  - expert_compute
  - execution_geometry
- step: 4
  title: Data movement and compute scheduling
  axes:
  - data_movement
  - compute_schedule
axes:
- id: implementation_contract
  kind: integration_contract
  question: What declarations, dispatch gates, shape checks and host state define a legal implementation?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - symbol_declaration
    - arch_gate
    - config_limit
    - config_space
    - config_validity
    - kernel_family
    - jit_cache
    - asm_object
    - asm_argblock
    - config_lookup
    - dispatch_padding
    - tunable_param
    - instance_name
  knob_aliases: {}
- id: execution_geometry
  kind: performance_choice
  question: How much work does each program own and how is the grid mapped?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - tile_shape
    - waves
    - split_k
    - persistent
    - grid_mapping
    - grid_fill
    - asm_tile
    - asm_launch
  knob_aliases:
    token_tile:
    - BLOCK_SIZE_M
    - BLOCK_M
    - tile_m
    output_channel_tile:
    - BLOCK_SIZE_N
    - BLOCK_N
    - tile_n
    reduction_tile:
    - BLOCK_SIZE_K
    - BLOCK_K
    - tile_k
    waves:
    - num_warps
    - NUM_WARPS
    - waves_per_eu
- id: compute_schedule
  kind: performance_choice
  question: Which compute, reduction and scheduling structures are written explicitly?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - mfma_intrinsic
    - mfma_shape
    - scheduling
    - ck_instance
    - ck_pipeline
    - pipeline_variant
    - lane_reduction
    - atomic_combine
  knob_aliases: {}
- id: data_movement
  kind: performance_choice
  question: How do data move between global memory, LDS and registers?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - lds_stage
    - lds_swizzle
    - lds_pad
    - lds_alloc
    - async_copy
    - access_width
    - cache_policy
    - layout_preshuffle
    - layout_transpose
    - layout_epilogue
    - fragment_layout
  knob_aliases:
    stages:
    - num_stages
    - lds_stage
    - STAGES
    async_copy:
    - use_async_copy
    - async_copy
- id: numerical_contract
  kind: hard_constraint
  question: Which scale, precision and parity conventions must remain unchanged?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - scale_operand
    - scale_in_k_loop
    - scale_after_k_loop
    - parity_tolerance
  knob_aliases: {}
- id: routing_semantics
  kind: hard_constraint
  question: How are experts selected and route weights computed?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: expert_layout
  kind: integration_contract
  question: How do route IDs, sorted/padded expert rows and inverse maps relate?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: expert_compute
  kind: structural_choice
  question: How do the gate/up, activation and down stages exchange intermediates?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: combine
  kind: hard_constraint
  question: How are route weights, partials and dropped routes combined?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: shared_expert
  kind: integration_contract
  question: When and where is the shared-expert contribution consumed?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: communication
  kind: integration_contract
  question: What ownership, readiness and buffer lifetimes accompany peer communication?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
dependencies:
- id: route-combine
  axes:
  - expert_layout
  - combine
  - numerical_contract
  relation: coupled_contract
  rule: Forward/inverse maps and weight placement must agree through combine.
  decision_refs:
  - moe-route-map-capacity
  - moe-weighted-gather-dropped-routes
- id: stage-format
  axes:
  - expert_compute
  - expert_layout
  - numerical_contract
  relation: coupled_contract
  rule: Both expert stages must agree on activation, intermediate layout and scales.
  decision_refs:
  - moe-two-stage-intermediate
- id: shared-ready
  axes:
  - shared_expert
  - communication
  - combine
  relation: coupled_contract
  rule: Wait for shared partials before the collective that consumes them.
  decision_refs:
  - moe-shared-expert-readiness
- id: fused-scales
  axes:
  - expert_layout
  - data_movement
  - numerical_contract
  relation: coupled_contract
  rule: Fusing quant/scatter also fixes the consumer scale layout.
  decision_refs:
  - moe-route-quant-scatter-fusion
