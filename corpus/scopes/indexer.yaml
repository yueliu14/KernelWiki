family: indexer
include_symbols: true
exclude:
- '*bwd*'
- '*backward*'
- '*wgrad*'
- '*train*'
impls:
- language: flydsl
  subtree: aiter/ops/flydsl
  globs:
  - fp8_mqa_logits_kernels.py
  - dcp_topk_merge.py
  - kernels/mqa_logits/fp8_mqa_logits.py
  - kernels/mqa_logits/fp8_paged_mqa_logits.py
  - kernels/mqa_logits/pa_mqa_logits_fp4.py
  - kernels/mqa_logits/pa_mqa_logits_fp4_prefill.py
  - kernels/minimax_m3_index_score.py
  - kernels/minimax_m3_index_score_prefill.py
  - kernels/dcp_topk_merge.py
  - topk/topk_per_row.py
- language: triton
  subtree: aiter/ops/triton/_triton_kernels
  globs:
  - attention/fp8_mqa_logits.py
- language: gluon
  subtree: aiter/ops/triton/_gluon_kernels
  globs:
  - gfx950/attention/fp8_mqa_logits.py
  - gfx950/attention/pa_mqa_logits_mxfp4.py
- language: hip
  subtree: csrc
  globs:
  - kernels/opus_mqa_logits/pa_mqa_logits_mxfp4/pa_mqa_logits_mxfp4_kernels.cu
  - kernels/opus_mqa_logits/pa_mqa_logits_mxfp4/pa_mqa_logits_mxfp4_opus.h
  - kernels/topk_per_row_kernels.cu
- language: asm
  subtree: csrc/py_itfs_cu
  globs:
  - asm_topk_per_row_prefill.cu
  - asm_topk_per_row_decode.cu
