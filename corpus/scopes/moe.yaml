family: moe
include_symbols: true
exclude:
- '*bwd*'
- '*backward*'
- '*wgrad*'
- '*train*'
impls:
- language: flydsl
  subtree: aiter/ops/flydsl
  globs:
  - moe_sorting.py
  - moe_common.py
  - moe_kernels.py
  - comm_fused_moe_host.py
  - mega_moe_tp.py
  - kernels/moe_sorting_kernel.py
  - kernels/moe_route_maps.py
  - kernels/moe_gather_reduce.py
  - kernels/moe_fused_route_quant_scatter.py
  - kernels/moe_gemm_2stage/gfx9_fp8/gemm1.py
  - kernels/moe_gemm_2stage/gfx9_fp8/gemm2.py
  - kernels/mega_moe_tp/mega_moe_tp.py
  - kernels/mega_moe_tp/schedule.py
  - kernels/mega_moe_tp/communication.py
  - herd_topk.py
  - kernels/herd_topk.py
- language: triton
  subtree: aiter/ops/triton/_triton_kernels
  globs:
  - moe/moe_op_gemm_a8w8.py
  - moe/moe_op_gemm_a8w8_blockscale.py
  - moe/moe_op_gemm_a4w4.py
  - moe/reduce.py
  - moe/activations.py
- language: gluon
  subtree: aiter/ops/triton/_gluon_kernels
  globs:
  - gfx950/moe/moe_op_gemm_a16w4.py
- language: hip
  subtree: csrc
  globs:
  - kernels/moe_align_block_size_kernels.cu
  - kernels/topk_softmax_kernels.cu
  - kernels/topk_gating_kernels.cu
  - py_itfs_cu/moe_sorting_opus_kernels.cu
- language: asm
  subtree: csrc/py_itfs_cu
  globs:
  - asm_moe_2stage.cu
  - asm_fmoe.cu
