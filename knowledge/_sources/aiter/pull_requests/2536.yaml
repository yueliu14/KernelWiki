                    def hot_loop_scheduler():
                        def _build_scheduler(numer: int, denom: int):
                            if denom <= 0:
                                return []
                            if numer <= 0:
                                return [0] * denom
                            out = []
                            prev = 0
                            for i in range_constexpr(denom):
                                cur = ((i + 1) * numer + (denom - 1)) // denom
                                out.append(cur - prev)
                                prev = cur
                            return out

                        if (gpu_arch == "gfx942") or (not ASYNC_COPY):
                            mfma_group = WARP_N_STEPS
                            mfma_total = (WARP_K_STEPS * 2) * WARP_M_STEPS * mfma_group
                            mfma_per_iter = 2 * mfma_group
                            sche_iters = (
                                0 if mfma_per_iter == 0 else (mfma_total // mfma_per_iter)
                            )
                            rocdl.sched_dsrd(2)
                            rocdl.sched_mfma(1)
                            if TILE_M == 16:
                                rocdl.sched_vmem(1)
                            rocdl.sched_mfma(1)
                            if TILE_M == 16:
                                rocdl.sched_vmem(1)
                            if mfma_group < 4:
                                rocdl.sched_dsrd(1)
                                rocdl.sched_mfma(1)
                                if TILE_M == 16:
                                    rocdl.sched_vmem(1)
                                rocdl.sched_dsrd(1)
                                rocdl.sched_mfma(1)
                                if TILE_M == 16:
                                    rocdl.sched_vmem(1)
                                rocdl.sched_mfma(1)
                            dswr_tail = LDG_REG_A_COUNT
                            dstr_advance = 2
                            if dswr_tail > sche_iters:
                                dswr_tail = sche_iters
                            dswr_start = max(sche_iters - dswr_tail - dstr_advance, 0)
                            for sche_i in range_constexpr(sche_iters):
                                rocdl.sched_vmem(1)
                                rocdl.sched_mfma(mfma_group)
                                rocdl.sched_dsrd(1)
                                rocdl.sched_mfma(mfma_group)
                                if sche_i >= dswr_start - 1:
                                    rocdl.sched_dswr(1)
                        rocdl.sched_barrier(0)
  summary: Introduce a tile-derived DS-read, VMEM, MFMA and DS-write scheduling bundle.
