- id: canonicalization
  url: https://github.com/ROCm/aiter/pull/2775#discussion_r3109293365
  excerpt: |-
    Updated. The compiler only normalizes waves_per_eu=0 to 2 for the wide-N B_TO_LDS subset. For non-wide-N B_TO_LDS configs, 0 is still a real tuning candidate. We already have tuned entries that rely on this. For example, in gptoss_bf16_tuned_gemm.csv, the M=8, N=2880, K=4096 small-M kernel has no _WPE suffix in the kernel name, which corresponds to waves_per_eu=0, and this path also passes runtime validation.

    So the safer fix is not to remove 0 globally, but to:

    keep SMALL_M_B_TO_LDS_WAVES_PER_EU_OPTIONS = (0, 2, 4)
    canonicalize / deduplicate only the wide-N B_TO_LDS cases that collapse to the same effective compiled kernel
    I updated it that way, and also verified both the registry dedup behavior and a runtime smoke case.
  sha256: 9e40274e7f5d42f9cc4cfc840d4bae8a78d330aae5f4a5c7bc7079d59d3f03a9
  captured_at: '2026-11-04T16:48:59.470298+00:00'
