  file: aiter/ops/triton/_triton_kernels/gemm/basic/gemm_a16w16.py
  before: '            accumulator += tl.dot(a, b)'
  after: '            accumulator = tl.dot(a, b, acc=accumulator)'
  summary: Pass the accumulator directly to tl.dot in the Triton GEMM loop.
- id: attention_acc
  commit: 7f613da837208886c1d9a958550f1ad50bd0ef7e
