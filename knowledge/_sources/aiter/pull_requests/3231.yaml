- id: body
  url: https://github.com/ROCm/aiter/pull/3231
  excerpt: Convert `acc += tl.dot(...)` and `acc += tl.dot_scaled(...)` to `acc = tl.dot(..., acc=acc)` / `acc
    = tl.dot_scaled(..., acc=acc)` so the matrix multiply accumulates directly into acc without a separate
    add.
  sha256: bbcd8f5526f1e36d4be3b2acdbbda6dee0bcaa5c43d1ebb9f7f9afb645be7428
