- id: report
  url: https://github.com/ROCm/aiter/pull/3357
  excerpt: |-
    ## Summary

    Adds two flydsl GPU kernels for the V4 attention compressor boundary (online-softmax pool → RMSNorm → GPT-J RoPE → optional FP8 + MFMA 16×16 preshuffle → paged kv_cache scatter), plus a pure-PyTorch reference and a unit test.

    - **`flydsl_fused_compress_attn`** — single-kernel dispatch covering all three shape configs:
      - CSA Main: `D=512, RD=64, ratio=4, overlap=True`, BF16
      - CSA Indexer: `D=128, RD=64, ratio=4, overlap=True`, FP8 + ue8m0 + MFMA 16×16 preshuffle
      - HCA Main: `D=512, RD=64, ratio=128, overlap=False`, BF16
    - **`flydsl_hca_compress_attn`** — HCA-only 2-kernel split (multi-wave LDS K-split + norm_rope_scatter). On V4-Pro HCA Main beats single 1.06–3.7× post slice_size + VEC=8 refactor.
    - **`hca_per_n_config`** — exposed tuning table dispatching on `plan_capacity` (CUDAGraph-stable). `flydsl_hca_compress_attn` auto-picks when caller passes `None`.

    ## Coverage

    Pure-PyTorch reference at `aiter/ops/torch_ref/fused_compress_attn.py` mirrors kernel semantics 1:1 (online softmax, RMSNorm, GPT-J RoPE, FP8 + ue8m0 + preshuffle, paged scatter).

    Unit test at `op_tests/test_flydsl_compress_attn.py` (test_quant.py style — standalone script with argparse + @benchmark + pandas summary) sweeps:

    - **3 shapes** × **10 batch sizes** {1,2,4,8,16,32,65,128,256,512} × **2 MTP** {0,3} for decode
    - **3 shapes** × **3 batch sizes** {1,4,32} for prefill
    - HCA Main also cross-checked against the 2-kernel split launcher
    - **Sentinel padding rows** (`position=-1`) in plan, verifying kernel bail-skip
    - **CUDAGraph token padding** (kv_in/score_in tail filled with NaN), verifying kernel never reads past valid `ragged_id`

    Total 115 checkAllclose calls. Per-shape tolerances:

    | Path | rtol | atol | tol_err_ratio |
    |---|---|---|---|
    | BF16 kv_cache | 1e-2 | 2e-2 | 0.02 |
    | FP8 kv_cache  | 1e-2 | 1e-2 | 0.05 |
    | `cache_scale` | 0    | 0    | 0    |

    `cache_scale` is bit-exact across all FP8 cases (kernel uses `am_safe * inv_fp8_max_constant` + ue8m0 bit-trick; reference mirrors via `am_safe * inv_fp8_max_fp32_tensor` + `math.ldexp(1, ceil(log2))`). FP8 bytes show occasional 1-ULP mismatches from hw `v_rcp.f32` vs host fp32 reciprocal — under 0.001% of cells.

    ## Test plan

    - [x] `python3 op_tests/test_flydsl_compress_attn.py` — full sweep passes (no failures)
    - [x] `python3 op_tests/test_flydsl_compress_attn.py --modes decode -s csa_main -b 1` — smoke OK
    - [x] black + ruff clean on all new files
    - [ ] CI green
