sources:
- id: report
  url: https://github.com/ROCm/aiter/pull/3901
  excerpt: |-
    ## Motivation

    Split-KV MLA decode stage 2 **reduce/combine** merges per-split fp32 partial `O`/`LSE` values into the final bf16/fp16 output using an LSE-weighted online softmax (`kn_mla_reduce_v1` in `csrc/kernels/mla/reduce.cu`).

    This PR adds a FlyDSL port for **gfx942 (MI300X)**, targeting the validated **GLM-5.2** sparse MLA decode configuration at TP8 (`H=16`, `Dv=512`).

    ## Technical details

    - **Kernel:** The default configuration uses 256 threads per block. `Tier.ALL`, the production kernel, selects one of four per-tile algorithm bodies on-device: `simple`, `m64`, `m256`, or `mlds`. It handles multi-token direct-wrapper calls and empty tiles safely.
    - **Launch selection:** The wrapper first selects cooperative split-K (`plan_splitk_capture_safe`) for low-tile, high-split decode. Otherwise, it uses adaptive direct launch for eligible sparse multi-tile inputs. All other calls select conventional 3-D or persistent grid-stride launch from the total-work threshold. `low_direct_pmap_thr` is an adaptive-launch optimization that bypasses LDS staging for low split counts; it is not a separate launch mode.
    - **Wiring:** `flydsl_mla_reduce_v1()` is a drop-in alternative enabled with `AITER_MLA_REDUCE_FLYDSL=1`. HIP remains the production default. Tier selection happens on-device, so per-tile split counts can vary within a fixed captured launch topology. Changes that select split-K, adaptive, or persistent dispatch require a separately captured topology.
    - **Occupancy:** `waves_per_eu` is an explicit wrapper argument and is part of the FlyDSL launch-cache identity for both normal and split-K dispatch.

    ## Test plan

    Validation environment:

    | Component | Value |
    |---|---|
    | GPU | MI300X (`gfx942`) |
    | ROCm | 7.2.4 |
    | PyTorch | 2.10.0+rocm7.2.4 |
    | FlyDSL | 0.2.4 |

    `op_tests/test_flydsl_mla_reduce.py` is a pytest-free, self-contained op test. The shared test helper was inlined into the test file; run the test directly with Python:

    ```bash
    python3 op_tests/test_flydsl_mla_reduce.py
    ```

    The suite compares production-shaped metadata against HIP and torch references across `H=8, Dv=256` torch-reference cases, `H=128, Dv=512` HIP-reference tier stress cases, and the production `H=16, Dv=512` serving fixtures. It covers variable splits, gapped indices, tier boundaries, empty tiles, split-K thresholds, adaptive launches, the `actual_max_splits` gate, serving OOB guards, and CUDA-graph capture/replay.

    ## Performance benchmark

    The following results are CUDA-graph replay latency on `H=16`, `Dv=512`, bf16. Values are the mean of two runs: one with fresh JIT and FlyDSL caches and one warm-cache repeat. `wrapper` denotes `flydsl_mla_reduce_v1()`. All wrapper and HIP correctness checks reported zero error.

    | Active tiles | Splits | HIP (µs) | FlyDSL (µs) | FlyDSL / HIP | Speedup |
    |---:|---:|---:|---:|---:|---:|
    | 1 | 128 | 13.88 | **7.23** | **0.52×** | **1.92×** |
    | 8 | 32 | 5.99 | **4.91** | **0.82×** | **1.22×** |
    | 8 | 26 | 5.47 | **4.92** | **0.90×** | **1.11×** |
    | 8 | 13 | 4.39 | **3.97** | **0.90×** | **1.11×** |
    | 8 | 6 | 3.84 | **3.41** | **0.89×** | **1.13×** |
    | 8 | 5 | 3.78 | **3.37** | **0.89×** | **1.12×** |
    | 8 | 3 | 3.77 | **3.02** | **0.80×** | **1.25×** |
    | 8 | 2 | 3.73 | **2.77** | **0.74×** | **1.35×** |

    ### End-to-end serving

    The kernel win above is small relative to a full decode step, so it was also measured end to end. Two vLLM servings of GLM-5.2-FP8 (TP8, fp8 KV cache, 131k context, `gpu_memory_utilization: 0.82`) were run over the same twelve request shapes, one with `AITER_MLA_REDUCE_FLYDSL=0` and one with `=1`.

    | Input length | Shapes | Output throughput | TPOT (decode) |
    |---:|---:|---:|---:|
    | 1K | 4 | +0.8% | −1.4% |
    | 8K | 4 | +3.0% | −3.2% |
    | 128K | 4 | +1.3% | −2.3% |
    | **All** | **12** | **+1.7%** | **−2.3%** |

    Geometric means; negative TPOT is faster. Across the twelve shapes, decode TPOT improved 2.3%.

    TPOT is the metric this PR should move since the gate only fires on decode and it improves on most shapes. Per-shape throughput suggests no regression. Measured TTFT differences are not attributable to this PR as prefill never reaches the reduce kernel.

    All lengths cover concurrency 1/2/4/8. The 1K and 8K rows use nominal 1,024- and 8,192-token inputs, respectively, with 1,024 output tokens and 8/16/32/64 prompts; these retain the original `random-range-ratio: 0.8` randomized traffic. The 128K sweep instead uses fixed 128,000-token inputs and 1,024-token outputs (`random-range-ratio: 0.0`), so every request stays within the 131,072-token model context. It uses 4/8/16/24 prompts, and both HIP and FlyDSL completed all four points with zero failed requests.

    ### Accuracy

    The FlyDSL serving path completed the 5-shot GSM8K evaluation (1,319 samples, deterministic decoding, 32 client requests in flight). The saved result reports **95.07%** `flexible-extract` exact match and **95.00%** `strict-match` exact match, consistent with thereported 94.9% HIP score; with one run and roughly 0.6 percentage-point standard error.

    ### Safety coverage

    - **Split-K overwrite:** `reduce_indptr` reaches the combine kernel, which reads `reduce_final_map` and writes output/LSE only when `n_splits > 1`. Mixed `[0, 64]` and `[1, 64]` cases with a stale map are tested eagerly and under CUDA-graph replay.
    - **Production dispatch:** FlyDSL is selected only for the validated target: gfx942, one-token decode, `H=16`, and `Dv=512`. Unsupported architectures, prefill or multi-token calls, and unsupported shapes remain on HIP without compiling FlyDSL.
    - **Pointer ABI:** The direct FlyDSL API rejects invalid pointer dtypes, ranks, shapes, devices, contiguity, output strides, and split counts before JIT compilation.
    - **Capture safety:** CUDA-graph capture requires a warmed CSR cache or an explicit `actual_max_splits` value; an unresolved capture does not launch.
