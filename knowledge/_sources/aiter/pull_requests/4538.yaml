sources:
- id: body
  url: https://github.com/ROCm/aiter/pull/4538
  excerpt: "## Motivation\n\nThis PR introduces a FlyDSL kernel for computing DeepSeek-V4 sparse attention\
    \ lightning indexer on `gfx950`. The new kernel is drop-in replacement for the existing Triton/Gluon kernel.\
    \ For the DSv4 prefill shapes it generally faster than the existing Triton/Gluon kernel. The `gfx942` version\
    \ was introduced in an earlier PR #3913.\n\n## Technical Details\n\nThere are two alternative implementation\
    \ on `gfx950`\n\n- Direct load kernel similar `gfx942`: Data is streamed directly from DRAM to registers.\n\
    - LDS staged kernel where KV slices are stored on LDS and shared among all wavefronts where each wavefront\
    \ computes it's own disjoint set of query rows. Q fragments and per-row weights are preloaded into registers\
    \ once per block (similar to the direct load kernel. The LDS staging uses gfx950 specific async global\
    \ → LDS DMA which writes directly to LDS without passing through VGPRs. XOR swizzle is used for LDS writes\
    \ and reads to reduce the rate of bank conflicts.\n\nThe LDS staged instance can have two or more LDS buffer\
    \ combined with one or more prefetch stages. Allocation of one LDS buffer more than the prefetch depth\
    \ (`PD`) enables to reduce the number of required barriers by one (barriers are required to ensure data\
    \ is ready before running MFMA on it). In practice, the most performant combination is 3 LDS buffers with\
    \ `PD=2` (only one barrier required).\n\nThere is instance auto-selection which selects the best kernel\
    \ for a given shape. However, similarly to the existing implementation, the auto-selected instance can\
    \ be overridden with an environment variable. \n\nThere's also one common optimization for both `gfx942`\
    \ and `gfx950`: when `clean_logits=True`, the baseline implementation uses `torch.fill` to initialize the\
    \ logits matrix with `-inf` values. Since half of the values are subsequently overwritten by the logits\
    \ kernel, we have fused the \"clean logits\" initialization step into the logits kernel. This provides\
    \ performance boost for small sequence lengths.\n\n## Test Plan\n\nAll tests added in PR #3913 are now\
    \ enabled for `gfx950`. For performance, benchmarked the same DSv4 shapes in PR #3913\n\n## Test Result\n\
    \nAll unit tests pass on both `gfx942` and `gfx950` (note: they are not enabled as part of the CI workflow)\n\
    \nFor `gfx950`, the new kernel is compared against the existing Triton/Gluon kernel\n\nShape | Triton TFLOPs\
    \ | FlyDSL TFLOPs | FlyDSL instance | Verification | Speedup\n-- | -- | -- | -- | -- | --\nbs1 4096x4096\
    \ H64 D128 [fn/fn] | 1317.8 | 1612.9 | mfma32x32x64_bkv64_r1_w2_lds3 | PASS (rel=1.0e-02) | x1.22\nbs1\
    \ 8192x8192 H64 D128 [fn/fn] | 1594.5 | 1949.3 | mfma32x32x64_bkv64_r2_w2_lds3 | PASS (rel=1.0e-02) | x1.22\n\
    bs1 128x32768 H64 D128 [fn/fn] | 149.3 | 1584.4 | mfma32x32x64_bkv64_r2_w2_lds3 | PASS (rel=1.3e-02) |\
    \ x10.61\nbs1 671x131072 H64 D128 [fn/fn] | 493.0 | 1598.5 | mfma32x32x64_bkv64_r2_w2_lds3 | PASS (rel=1.3e-02)\
    \ | x3.24\n\nVerification is done against the existing Triton implementation. \n\nFor `gfx942`, the changes\
    \ are compared against the baseline FlyDSL kernel\n\nShape (sq × skv) | Variant | Baseline µs | Fused clean\
    \ logits µs | Δ% | Speedup\n-- | -- | -- | -- | -- | -- \n4096 × 4096 |  mfma_r2_w4 | 210.4 | 191.4 | −9.0%\
    \ | 1.10×\n8192 × 8192 |  mfma_r2_w2 | 672.4 | 633.6 | −5.8% | 1.06×\n128 × 32768 |  mfma_r2_w4 | 114.0\
    \ | 106.8 | −6.3% | 1.07×\n671 × 131072 | mfma_r2_w4 | 1899.4 | 1797.7 | −5.4% | 1.06×\n\nFor all cases\
    \ the number of heads (H) is 64. Verification against the existing Triton kernel passes.\n\nA recent PR\
    \ #4563 improved the Gluon kernel for the GLM -5 shapes where `H=32`. Here's a comparison of this FlyDSL\
    \ results against the latest Gluon logits kernel the shapes are taken from PR #4563 \n\nISL=OSL | batch\
    \ | rows | Triton (Gluon) | FlyDSL | speedup\n-- | -- | -- | -- | -- | --\n1,024 | 1 | 1,024 | 16.8 µs\
    \ / 256 | 16.5 µs / 260 | 1.02x\n1,024 | 4 | 4,096 | 35.3 µs / 488 | 32.5 µs / 530 | 1.09x\n1,024 | 8 |\
    \ 8,192 | 101.5 µs / 339 | 69.9 µs / 492 | 1.45x\n1,024 | 16 | 16,384 | 279.9 µs / 246 | 224.4 µs / 307\
    \ | 1.25x\n2,048 | 1 | 2,048 | 27.7 µs / 621 | 25.6 µs / 671 | 1.08x\n2,048 | 2 | 4,096 | 46.0 µs / 748\
    \ | 40.9 µs / 840 | 1.12x\n2,048 | 4 | 8,192 | 118.3 µs / 581 | 81.9 µs / 839 | 1.44x\n2,048 | 8 | 16,384\
    \ | 311.5 µs / 441 | 273.5 µs / 503 | 1.14x\n4,096 | 1 | 4,096 | 68.2 µs / 1,008 | 54.0±3.2 µs / 1,273\
    \ | 1.26x\n4,096 | 2 | 8,192 | 158.8 µs / 866 | 108.8 µs / 1,264 | 1.46x\n4,096 | 4 | 16,384 | 381.5 µs\
    \ / 721 | 349.6 µs / 786 | 1.09x\n8,192 | 1 | 8,192 | 223.6 µs / 1,230 | 173.9 µs / 1,581 | 1.29x\n8,192\
    \ | 2 | 16,384 | 517.8 µs / 1,062 | 461.7 µs / 1,191 | 1.12x\n  |   | geomean |   |   | 1.208x"
