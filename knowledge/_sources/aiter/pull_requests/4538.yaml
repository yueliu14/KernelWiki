- id: gfx950_registry
  commit: 9402ade66cbd8282270b1daee3b28ab6478d9485
  parent_commit: 28cbc38b00ec583d660758307c4b053347d4d209
  file: aiter/ops/flydsl/fp8_mqa_logits_kernels.py
  before: ''
  after: |2-
        # CDNA4 scaled MFMA atoms (K=128/64): gfx950-only, since those instructions
        # require native FN operands and do not exist on gfx942.
        _K64 = _MFMA32_K64
        _K128 = _MFMA16_K128
  summary: Introduce the gfx950 registry, including LDS-pipelined variants and shape-dependent selection.
- id: fused_clean
  commit: 9402ade66cbd8282270b1daee3b28ab6478d9485
  parent_commit: 28cbc38b00ec583d660758307c4b053347d4d209
  file: aiter/ops/flydsl/kernels/mqa_logits/fp8_mqa_logits.py
  before: |2-
        if clean_logits:
            logits = torch.full(
  after: |2-
            # ---- Fused clean_logits prefill (must come after the tile loop) ----
            if const_expr(clean_logits):
                neg_inf = fx.Float32(float("-inf"))
  summary: Move out-of-window negative-infinity initialization into the score kernel.
