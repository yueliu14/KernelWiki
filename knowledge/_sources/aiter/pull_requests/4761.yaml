- id: report
  url: https://github.com/ROCm/aiter/pull/4761
  excerpt: |-
    ## Summary
    - skip per-element causal and bounds masking for fully visible prefill tiles in the Triton 2D unified-attention kernel
    - restrict the fast path to gfx950, head size 128, FP8 Q/FP8 KV, query length at least 256, non-windowed, non-shuffled prefill
    - preserve current-main dispatch and launch configurations, including the gfx950 tuning merged in #4918; this PR no longer overrides decode routing or launch configs
    - select the eligible family through the gfx950 JSON configuration introduced by #5088, with exact safety checks kept compile-time in the kernel and the refactored wrapper unchanged

    ## Integration context

    The PR branch is rebased onto AITER `main` at
    [`5e4a8119`](https://github.com/ROCm/aiter/commit/5e4a8119cc2a6b578667102b75b4f321852dfd8c),
    including [#5088](https://github.com/ROCm/aiter/pull/5088) and
    [#4918](https://github.com/ROCm/aiter/pull/4918). The kernel patch is unchanged
    from the benchmarked candidate. A 480-case configuration and effective-gate
    comparison confirmed that the JSON migration preserves all existing launch
    parameters and enables the fast loop only for the benchmarked shape family.

    The end-to-end comparison used two derivatives of the same pinned Image C
    parent (`sha256:653c62aad83496c96748cd28151810f13757509120f548a389d555527957fbb4`).
    The baseline derivative installed the two unified-attention source files from
    `35c652ed`; the candidate installed those files from this PR at `c4638c76`.
    All other image contents, model files, runtime flags, and workload inputs were
    held fixed.

    ## Performance validation

    Tested on MI355X/gfx950 with Qwen3-VL-235B-A22B-Instruct-MXFP4. Servers were
    NUMA-pinned to disjoint GPUs, clients were launched synchronously, and results
    used same-GPU or same-pair crossover placement. Full-node GPU utilization and
    temperatures were sampled throughout the runs.

    - TP1, 60k input / 600 output, concurrency 32: **+9.10%** median output throughput; **8.34%** lower duration; **9.25%** lower mean TTFT; **7.91%** lower mean TPOT across four same-GPU comparisons
    - TP2, 60k input / 600 output, concurrency 32: **+5.64%** median output throughput; **5.33%** lower duration; **5.98%** lower mean TTFT; **5.17%** lower mean TPOT across two same-pair comparisons
    - TP1, 8k input / 1k output, concurrency 128: **+2.35%** median output throughput; **2.30%** lower duration; **4.51%** lower mean TTFT; **2.14%** lower mean TPOT across four same-GPU comparisons
    - TP2, 8k input / 1k output, concurrency 256: **+1.62%** combined median output throughput; **1.59%** lower duration; **2.30%** lower mean TTFT; **1.53%** lower mean TPOT across two seeds and two same-pair placements. Three of four pair-seed comparisons were positive; the remaining comparison was **-0.54%**, so no repeatable short-context regression was observed.

    ## Latest-head E2E revalidation (2026-09-03)

    After the review and rebase changes, the four published E2E workloads were
    re-run against the same frozen baseline and Image C parent. The candidate was
    the current PR head `c3fe5b8217ed584aabc3cf1a36749d23cd7f7e5c`; the baseline
    remained `35c652ed3bd34e5d5828954e1545babc9255a69a`. Two-round same-GPU
    or same-pair crossover placement was used on GPUs 0–3.

    - TP1, 60k input / 600 output, concurrency 32: **+8.45%** median output throughput; **7.79%** lower duration; **8.27%** lower mean TTFT; **7.69%** lower mean TPOT (**-0.65 percentage points** versus the previously published +9.10% throughput result)
    - TP2, 60k input / 600 output, concurrency 32: **+7.00%** median output throughput; **6.54%** lower duration; **7.48%** lower mean TTFT; **6.40%** lower mean TPOT (**+1.36 percentage points** versus the previously published +5.64% throughput result)
    - TP1, 8k input / 1k output, concurrency 128: **+2.46%** median output throughput; **2.40%** lower duration; **5.06%** lower mean TTFT; **2.20%** lower mean TPOT (**+0.11 percentage points** versus the previously published +2.35% throughput result)
    - TP2, 8k input / 1k output, concurrency 256: **+1.98%** combined median output throughput; **1.94%** lower duration; **3.12%** lower mean TTFT; **1.84%** lower mean TPOT across seeds 16 and 24 (**+0.36 percentage points** versus the previously published +1.62% throughput result)

    All 28 measured client arms returned status 0 and completed the expected
    prompt counts. Every workload passed the regression guardrails, so the frozen
    old candidate diagnostic was not needed. One TP2 short pair/seed comparison
    was negative (`-1.61%`), but it did not repeat on that physical pair and the
    combined median remained positive. Test GPUs stayed healthy, with sampled
    junction temperatures below 59 C.

    An instrumented serving request confirmed that the production path reaches the
    2D prefill kernel with head size 128, FP8 Q, FP8 KV, no sliding window, no
    shuffled cache, and the guarded fast path enabled.

    ## Rebase and benchmark provenance

    - Frozen benchmark baseline: `35c652ed3bd34e5d5828954e1545babc9255a69a`
    - Benchmarked candidate: `c4638c761293b92ba41dad628c71b77e2131dc4e`
    - Current rebase base: `5e4a8119cc2a6b578667102b75b4f321852dfd8c`
    - Original optimization source: `389fb3d32494729561f981ba5d0be898dc189644`

    ## Test plan
    - [x] rebase onto AITER `main` at `5e4a8119cc2a6b578667102b75b4f321852dfd8c`
    - [x] preserve the #5088 wrapper, select the eligible family in the gfx950 JSON config, and retain exact safety checks in the kernel
    - [x] preserve #4918 and gfx1151 dispatch/config behavior
    - [x] `git diff --check upstream/main...HEAD`
    - [x] validate 480 config combinations; existing launch parameters remain unchanged
    - [x] existing full unified-attention correctness suite on gfx950 — **1,088 passed, 1,056 skipped**
    - [x] paired unified-attention microbenchmarks — 21 shapes × 3 alternating repetitions; **1.018×** overall geomean with no regression greater than 2%
    - [x] TP1 and TP2 end-to-end serving crossover at 8k/1k and 60k/600
    - [x] latest-head E2E revalidation at `c3fe5b821` — all four published workloads passed regression guardrails
    - [ ] upstream CI rerun on the current rebased head

    ## CI note

    CI is rerunning after rebasing onto the merged #5088 refactor. The previous
    pre-refactor head passed all required checks.

