- id: mtp_results
  url: https://github.com/ROCm/aiter/pull/4907
  excerpt: |-
    ### Gated delta rule, MTP verify

    Full 144-cell sweep (3 contracts x 4 TP settings x 2 state dtypes x 2 draft lengths x
    3 batch sizes), averaged over two independent runs.

    #### gfx950

    The two runs returned a geomean of 1.451x and 1.431x. All 144 cells are at or above
    parity, the lowest at 1.034x.

    | contract | base kernel | geomean | median |
    | ------------- | ---------------------------------------------- | ------- | ------ |
    | vllm_chain | vLLM fused_recurrent_gated_delta_rule | 1.522x | 1.466x |
    | sglang_tree | SGLang, tree/EAGLE arms | 1.446x | 1.319x |
    | sglang_chain | SGLang fused_sigmoid_gating_delta_rule_update | 1.363x | 1.309x |
    | all 144 cells | | 1.442x | 1.360x |

    On `vllm_chain` FlyDSL is also 1.168x over aiter's own Triton kernel, over those 48 cells.

    Geomean speedup by shape parameter:

    | parameter | | | | |
    | ----------- | ----------- | ----------- | ----------- | ---------- |
    | batch | b1 1.905x | b32 1.341x | b128 1.175x | |
    | TP | tp1 1.354x | tp2 1.414x | tp4 1.464x | tp8 1.545x |
    | state dtype | fp32 1.551x | bf16 1.341x | | |

    The gain is largest where a verify step actually runs -- small batch, high TP -- since
    both leave less work per launch.

    Latency in us at tp1 (32 v-heads), fp32 state, seqlen 4, batch 1 / 32 / 128:

    | contract | FlyDSL | upstream base | aiter Triton |
    | ------------- | --------------------- | ---------------------- | ---------------------- |
    | vllm_chain | 8.13 / 55.13 / 262.09 | 19.36 / 65.50 / 281.66 | 11.22 / 55.46 / 260.21 |
    | sglang_chain | 8.09 / 63.33 / 253.22 | 16.61 / 73.39 / 312.18 | n/a |
    | sglang_tree | 7.85 / 80.91 / 325.04 | 17.13 / 98.52 / 359.02 | n/a |

    Per-cell speedups agree between the two runs to 0.91% at the median. Two cells move by
    more than half, both `vllm_chain` at 16 v-heads with a bf16 state, and the movement is
    upstream's: FlyDSL holds to 8% across the two runs there while the vLLM baseline swings
    by 70%. Read the aggregates rather than individual cells.

    #### gfx942

    The two runs returned a geomean of 1.374x and 1.370x.

    | contract | base kernel | geomean | median |
    | ------------- | ---------------------------------------------- | ------- | ------ |
    | vllm_chain | vLLM fused_recurrent_gated_delta_rule | 1.414x | 1.200x |
    | sglang_tree | SGLang, tree/EAGLE arms | 1.428x | 1.262x |
    | sglang_chain | SGLang fused_sigmoid_gating_delta_rule_update | 1.278x | 1.128x |
    | all 144 cells | | 1.371x | 1.211x |

    On `vllm_chain` FlyDSL is also 1.233x over aiter's own Triton kernel, over those 48 cells.

    Geomean speedup by shape parameter:

    | parameter | | | | |
    | ----------- | ----------- | ----------- | ----------- | ---------- |
    | batch | b1 2.046x | b32 1.142x | b128 1.103x | |
    | TP | tp1 1.215x | tp2 1.347x | tp4 1.473x | tp8 1.466x |
    | state dtype | fp32 1.463x | bf16 1.285x | | |

    The gain is largest where a verify step actually runs -- small batch, high TP -- since
    both leave less work per launch.

    Latency in us at tp1 (32 v-heads), fp32 state, seqlen 4, batch 1 / 32 / 128:

    | contract | FlyDSL | upstream base | aiter Triton |
    | ------------- | --------------------- | ---------------------- | ---------------------- |
    | vllm_chain | 16.21 / 158.11 / 684.92 | 30.96 / 182.22 / 734.09 | 18.76 / 193.92 / 741.64 |
    | sglang_chain | 17.52 / 181.90 / 710.60 | 30.06 / 190.33 / 712.32 | n/a |
    | sglang_tree | 22.65 / 194.38 / 811.42 | 34.44 / 220.44 / 862.08 | n/a |

    Per-cell speedups agree between the two runs to 0.83% at the median. Read the
    aggregates rather than individual cells.

    `aiter Triton` is n/a where it cannot express the call: it implements the chain contract
    only, and neither upstream implements the other's.
