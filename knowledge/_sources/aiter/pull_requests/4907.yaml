- id: mtp_contract
  url: https://github.com/ROCm/aiter/pull/4907
  excerpt: "Gated delta rule:\n\n* New FlyDSL gated delta rule: `flydsl_gdr_decode`, plus `flydsl_gdr_mtp`\
    \ (vLLM) and\n  `flydsl_gdr_mtp_sglang` (SGLang) for the verify step.\n* All three MTP contracts: vLLM's\
    \ chain, SGLang's chain with per-token snapshots, and\n  SGLang's EAGLE tree, which reloads each arm's\
    \ parent state.\n* Opt-in via `AITER_GDR_FLYDSL=1`; the default Triton path is unchanged.\n* Sigmoid gating,\
    \ the q/k L2 norm and the recurrence are one launch, with the state\n  resident in registers for the whole\
    \ token loop.\n* Per-token checkpointing, so a rejected draft token rolls the state back in place\n  rather\
    \ than by re-running the step.\n* The snapshot store is non-temporal wherever nothing reads it back: every\
    \ contract but\n  the tree, and the tree's own last step. It is write-once traffic either way, and at the\n\
    \  footprints where the state pool still fits in LLC it was evicting the pool that the\n  next token reads.\n\
    * On the tree, token 1's parent state stays in registers at either snapshot dtype. A\n  narrower snapshot\
    \ owes a rounding, but a store followed by its reload is a `truncf`\n  then an `extf`, so the round trip\
    \ is exact without going to memory.\n* bf16/fp16 q/k/v with an fp32 or bf16 state pool, GQA, validated\
    \ at 128x128 head dims,\n  gfx942/gfx950; anything else is refused.\n* Pool and snapshot terms sit in 64-bit\
    \ descriptor bases, for the reason the conv does.\n* Tiling is derived on the host from the launch grid:\
    \ decode splits the value dimension\n  until `batch_size * num_v_heads` covers the part, and the MTP ladder\
    \ does the same\n  before branching on the contract and the draft length, since the three contracts want\n\
    \  different splits at the same shape. `WAVES_PER_EU` rides with the one tiling that wants\n  it. `gdr_decode_tuned.csv`\
    \ and the lookup that read it are deleted here: a row was keyed\n  on the shape and the batch, and the\
    \ batch is half of the grid the rule already reads.\n* The public MTP dispatch accepts `draft_window` as\
    \ host-side metadata, avoiding the \n   GPU-to-CPU synchronization previously needed to infer it from `cu_seqlens`.\
    \ Calls \n   without this metadata fall back to Triton.\n* The default stream is selected from the input\
    \ device, explicit streams are checked \n   against it, and non-contiguous output buffers are rejected.\n\
    * CUDA Graph capture currently skips the FlyDSL route and falls back to Triton.\n* A validated private\
    \ launch path avoids repeating wrapper validation in the public dispatch."
