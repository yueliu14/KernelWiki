- id: early_public_regression
  url: https://github.com/ROCm/aiter/pull/4907#issuecomment-5613341779
  excerpt: |-
    ### Measure public-entry-point latency, including the dispatch synchronization

    **Location:** [`aiter/ops/triton/gated_delta_net/fused_rearrange_sigmoid_gdr.py:29–48`](https://github.com/ROCm/aiter/blob/041211b7ec423aee851eb3099a2460aafbd36dc0/aiter/ops/triton/gated_delta_net/fused_rearrange_sigmoid_gdr.py#L29-L48)

    `_uniform_draft_window()` performs a GPU-to-CPU copy and synchronization on every eligible dispatch. This overhead can outweigh the kernel-level improvement for small batches.

    In a warmed-up gfx950 wall-clock microbenchmark of the public entry point with `B=1`, `T=4`, and `HV=32`, I measured:

    | Configuration | Median time per call |
    |---|---:|
    | FlyDSL disabled | 35.9 µs |
    | FlyDSL enabled | 69.5 µs |

    This is one local microbenchmark, not a model-level performance result, but it demonstrates why kernel-only speedups should be reported separately from public-API latency.

    Please add a benchmark that includes dispatch overhead and consider accepting the draft window through host-side metadata to avoid synchronization in the hot path. Also document that the current dispatch falls back to Triton during CUDA Graph capture.

    ---
