            _KIMI_K3_TOPK,
        ):
            return "kimi_k3"
        if (score_func, experts, topk) == (
            "sigmoid",
            _MINIMAX_M3_EXPERTS,
            _MINIMAX_M3_TOPK,
        ):
            return "minimax_m3"
        return None
