- id: report
  url: https://github.com/ROCm/aiter/pull/5896
  excerpt: |
    ## Summary

    A FlyDSL MXFP8 batched GEMM for gfx950 serves the e8m0 block-scale GEMMs of DeepSeek-V4 / V4.1:
    `gemm_a8w8_blockscale_bpreshuffle` with e8m0 `x_scale` and `w_scale` (32x32 group32 or 128x128 blockscale) and the V4 `wo_a` batched GEMM. FP32 scales keep the existing CK / asm path. Tuned gfx950 tables are included.

    ## Changes

    - **Kernel** `aiter/ops/flydsl/kernels/bmm_a8w8_mxscale_gfx950.py`: scaled MFMA 16x16x128, async LDS DMA pipeline, 32x32 / 128x128 e8m0 blocks, split-K with a same-XCD last-arrival reduction, B direct to registers, XCD tile order, non-temporal B, per-stage or preloaded scale panels, K % 64 tail (half step), column-major (blockscale) `x_scale`.
      - Scale rows that are not whole dwords (128-wide blocks at K = 384 / 768, split or per-stage panels) are copied a byte per LDS slot with exact buffer bounds; dword-aligned panels are unchanged.
      - `check_bmm_config` is the single legality source; it rejects tiles whose waves would cover partial MFMA tiles and tiles that straddle `w_scale` blocks.
    - **Front door** `aiter/ops/flydsl/batched_gemm_a8w8.py`: `run_bmm_a8w8_mxfp8` / `bmm_a8w8_mxfp8_supported`, dispatching by (arch, `w_scale` block, `x_scale` layout) to the gfx950 or gfx1250 runner; only the running arch's module is imported.
    - **gfx950 module** `aiter/ops/flydsl/batched_gemm_a8w8_gfx950.py`: kernelName `flydsl_bmm_mxfp8_mfma_t{m}x{n}x{k}_w{mw}x{nw}_nb*_sk*[_bd*][_nt][_xcd][_sps]`, heuristic for untuned shapes, and a cache of compiled launchers that skips FlyDSL's per-launch argument binding (public-API host cost 71 -> 21 us per call).
    - **Routing** `aiter/ops/gemm_op_a8w8.py`: on gfx950, e8m0 operands take the FlyDSL kernel through the tuned table `AITER_CONFIG_GEMM_A8W8_BLOCKSCALE_MXSCALE_BPRESHUFFLE` (keyed gfx, cu_num, M, N, K, w_scale_block; rows are `flydsl` / `bmm`). `gemm_a8w8_blockscale(isBpreshuffled=True)` forwards native group32 operands there.
    - **AOT** `aiter/aot/flydsl/gemm.py`: precompiles `kernelId=bmm` rows, both `x_scale` layouts for 128x128.
    - Also carries the other local changes of this tree: `inverse_rope_group_quant`, opus policy / bmm tune, gfx1250 bmm wrapper, `tensor_shim` helpers.

    ## Tuned configs (gfx950, 256 CUs)

    | table | rows | vs baseline |
    |---|---:|---|
    | `model_configs/dsv4_a8w8_blockscale_mxscale_bpreshuffle_tuned_gemm.csv` (DeepSeek-V4-Pro 128x128 linears, TP1/4/8 incl. K = 384 / 768) | 980 | 1.30x geomean vs CK/asm, total time -23% |
    | `model_configs/dsv41_a8w8_blockscale_mxscale_bpreshuffle_tuned_gemm.csv` (DeepSeek-V4.1 group32) | 1224 | 1.22x geomean vs the Triton group32 kernel |
    | `model_configs/dsv4_batched_gemm_a8w8_blockscale_mxscale_bpreshuffle_tuned.csv` (V4 `wo_a`, gfx950 rows) | 680 | retuned |

    Timings are `perftest` medians with the candidates and the baseline alternated in one process; errRatio <= 0.003 against a dequantized FP32 reference.

    ## Tests

    - [x] `op_tests/test_gemm_group32_interface.py`, `op_tests/tuning_tests/test_config_shape_collision.py`: 164 passed (routing, elementwise dequant reference incl. K = 384 / 576 / 768 and M = 1 / 37 / 300, mid-dword scale rows across kernel layouts, legality regressions).
    - [x] `op_tests/test_flydsl_batched_gemm.py` (gfx950 a8w8 32 / 128 blocks).
    - [x] Randomized correctness sweeps (with 0xFF past every scale tensor): 828 (config, M) runs, 0 failing.
    - [x] AOT: every kernel of the three tables compiles; run-only sampled rows hit the cache and match the reference.
    - [ ] CI

    ## Notes

    - FlyDSL reuses a module loaded on one GPU when the same process launches the kernel on another GPU (the launch logs `hipErrorInvalidDevice` and does nothing). This is a FlyDSL limitation affecting every FlyDSL kernel, not introduced here; one GPU per process (e.g. ATOM) is unaffected.
