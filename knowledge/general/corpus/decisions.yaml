  question: Is launch or host work inside the metric being optimized?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id005
  - A small kernel may be dominated by allocation, argument binding, dispatch or graph replay rather than its
    device body.
  actions:
  - Measure eager and captured execution using the actual benchmark bracket; compare a minimal launch/replay
    control on the same stack.
  - Use controlled host-delay or allocation probes to determine whether that work is exposed or hidden by queued
    GPU work.
  - Recheck state lifetime and allocator behavior before attributing periodic per-case differences to device
    code.
  why:
  - Some reports benefited from reducing host work while others timed only captured device execution or paid
    more for graph replay than for a direct launch.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Device time and host time from different profiling protocols cannot simply be subtracted to claim exact
    overhead. Empty controls bound possibilities; they are not deployable implementations.
  experience:
  - outcome: mixed
    conditions: *id005
    summary: Some reports benefited from reducing host work while others timed only captured device execution
      or paid more for graph replay than for a direct launch.
