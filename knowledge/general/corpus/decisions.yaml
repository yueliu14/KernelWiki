  question: What resource limits occupancy on a matrix-core kernel?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id007
  - Matrix instructions use architecture-specific vector and accumulator register allocation.
  actions:
  - Use the code object and the target architecture allocation rules to account for VGPRs, AGPRs, LDS, waves
    and workgroups together.
  - Verify achieved residency and scratch behavior after a change; lower register counts or higher waves per
    SIMD are not sufficient evidence of improved throughput.
  why:
  - A historical CDNA4 analysis found that counting only one register class overestimated available occupancy.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Register accounting is architecture- and toolchain-specific; no fixed register budget or waves-per-CU target
    applies to every device.
  experience:
  - outcome: constraint
    conditions: *id007
    summary: A historical CDNA4 analysis found that counting only one register class overestimated available
      occupancy.
    provenance:
      kind: historical_summary
