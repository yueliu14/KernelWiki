  question: When should an optimization direction that previously failed be tested again?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id004
  - A negative result was obtained for a particular implementation, operating regime and baseline.
  actions:
  - Preserve the mechanism and tested conditions of a negative result, then revisit it when dtype, tile, accumulation,
    cache footprint, compiler or timing protocol changes.
  - Test a proposed combination against the same baseline and against its strongest component; individually
    positive changes can interfere or become unreachable after dispatch changes.
  - Keep corrected or withdrawn explanations with their scoped conclusion; a historical gain, an artifact-integrity
    check and an independently reproduced deployment are different evidence claims.
  why:
  - Several discarded directions became useful after the limiting resource or selected implementation changed;
    other combinations erased an earlier gain.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - An unmeasured idea, build failure and measured no-gain result are different outcomes. None establishes
    a permanent prohibition.
  experience:
