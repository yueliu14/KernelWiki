  question: How can a small performance change be distinguished from measurement drift?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id001
  - The candidate and baseline implement the same contract and are timed under the actual execution protocol.
  actions:
  - Interleave paired baseline/candidate blocks in both orders and include an A/A control. Keep warmup, allocations,
    clocks, power limits and contention comparable.
  - Report per-case results and uncertainty with the intended workload weights. Choose a justified acceptance
    rule instead of inheriting a historical fixed percentage.
  - Check correctness independently of the edited implementation, and separate a counter change from a latency
    change.
  - Re-establish the noise floor on the actual host and wait for stable warmup after each restart; do not inherit
    a fixed number of warmup rounds from another run.
  - Compare serving-accuracy changes and gate margins with the accuracy harness's repeatability; an apparent
    pass near the threshold may need additional validation.
  why:
  - Historical experiments found order bias, power/clock drift and timing-bracket effects large enough to reverse
    small apparent wins.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - A non-overlap rule or median alone is not a universal statistical guarantee. Raw timing histories remain
    private.
  experience:
  - outcome: constraint
    conditions: *id001
    summary: Historical experiments found order bias, power/clock drift and timing-bracket effects large enough
      to reverse small apparent wins.
    provenance:
      kind: historical_summary
      references:
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/e2e_workflow/knowledge/learned/method-e2e-ab-harness.md
