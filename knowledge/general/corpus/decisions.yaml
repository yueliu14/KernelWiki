    - ck
    - asm
    - tilelang
  question: How should isolated improvements be evaluated as an end-to-end change?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id008
  - The workload contains multiple kernels or phases, potentially with host work and communication overlap.
  actions:
  - Screen a candidate using its time share within a clearly stated boundary, then measure the full workload
    with the intended phase mix and topology.
  - Report a combined improvement as a combined result unless independent ablations isolate component effects.
  - Retain correct modest improvements only when the final combination passes the full correctness and performance
    gate.
  - Choose the deployment phase and operating point explicitly; estimate startup, warmup and repetition costs
    before deciding whether the expected end-to-end gain can be resolved within the available time.
  - 'Re-time the selected change on the serving path: isolated kernel rankings and phase-specific improvements
    can change under the deployment workload.'
  why:
  - Historical serving summaries found that individually small kernels and phase-specific gains did not translate
    proportionally to whole-model throughput.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Do not multiply a time share by a phase fraction a second time if the measured share already includes that
    phase weighting. An Amdahl estimate is a model, not a measured serving gain.
