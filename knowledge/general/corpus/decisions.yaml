  question: How should roofline and counter observations guide a concrete experiment?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id006
  - The deployed CU count, dtype, shape and execution boundaries are known.
  actions:
  - Count required bytes and FLOPs for the actual semantics, including sparse gathers, partial buffers and
    scale metadata; use the resources actually available to the process.
  - Attribute instructions and dependencies to the hot region, and compare plausible traffic/compute bounds
    to a matching measurement.
  - Use a controlled ablation to test the proposed cause. A deliberately incomplete control must stay separate
    from correctness-gated candidate results.
  why:
  - Historical reports found inflated peak denominators, removable scratch traffic and misleading instruction/counter
    proxies behind apparently exhausted kernels.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - A high counter or fraction of peak does not prove that reducing it will improve latency. Bounds and measured
    performance are separate claims.
  experience:
  - outcome: constraint
    conditions: *id006
    summary: Historical reports found inflated peak denominators, removable scratch traffic and misleading
      instruction/counter proxies behind apparently exhausted kernels.
