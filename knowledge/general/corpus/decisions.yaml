- id: method-grid-and-lifetime-contract
  type: performance_candidate
  axes:
  - resource_model
  - integration
  match:
    operator_families: *id002
    target_languages:
    - triton
    - gluon
    - flydsl
    - hip
    - ck
    - asm
    - tilelang
  question: When can a new grid axis improve a composed kernel chain?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id009
  - A stage partitions only tokens while another independent dimension can supply useful parallelism.
  actions:
  - Check useful workgroups against available CUs, then partition the independent dimension while preserving
    output ownership and producer/consumer lifetimes.
  - Hoist invariant bounds checks only when the full dynamic domain is covered; inspect the generated code
    and validate tails.
  - Measure each stage and the complete chain after combining grid, tile and fusion changes.
  why:
  - A historical composed TileLang chain benefited from exposing hidden-dimension parallelism and removing
    invariant loop work; further fusion did not automatically improve the result.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - The original combined speedup cannot be assigned independently to each technique. More workgroups may increase
    memory traffic or change the limiting resource.
  experience:
  - outcome: mixed
    conditions: *id009
    summary: A historical composed TileLang chain benefited from exposing hidden-dimension parallelism and
      removing invariant loop work; further fusion did not automatically improve the result.
