- id: method-live-binary-and-integration
  type: performance_candidate
  axes:
  - integration
  match:
    operator_families: *id002
    target_languages:
    - triton
    - gluon
    - flydsl
    - hip
    - ck
    - asm
    - tilelang
  question: How can an optimization be tied to the code and call path that actually ran?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id003
  - Compilation caches, imported aliases or serving workers can resolve a different implementation from the
    edited source.
  actions:
  - Record source and binary identities privately; inspect the compiled artifact and prove the intended callable
    executes in every relevant worker.
  - After changing module-level flags or included headers, invalidate or isolate the relevant compilation cache
    and verify that the changed binary was loaded.
  - Validate graph capture, stream handling, dynamic inputs and repeated calls on the real integration path
    before measuring end-to-end behavior.
  - Record the effective process environment privately and verify positive selection markers plus expected
    negative/fallback markers on every relevant rank.
  - Restart processes and recapture graphs after configuration changes when the runtime caches the old selection;
    a file changed on disk does not establish deployment.
  why:
  - Historical summaries repeatedly reported unchanged or stale binaries and unpatched importing call sites
    being mistaken for optimization results.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - A loaded-module message does not prove the timed path used the candidate. A correct isolated kernel does
    not establish successful serving integration.
  experience:
  - outcome: constraint
    conditions: *id003
    summary: Historical summaries repeatedly reported unchanged or stale binaries and unpatched importing call
      sites being mistaken for optimization results.
    provenance:
