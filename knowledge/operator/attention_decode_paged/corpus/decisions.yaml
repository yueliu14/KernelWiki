  question: When should KV loads bypass cache or use explicit prefetch?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unresolved
    checked_at: '2026-11-05T02:04:28.752103+00:00'
    summary: Read all 5 pinned GEAK summaries already cited by this card. They attribute experiment-specific
      implementation or tuning outcomes, but provide no uniquely identified AITER change commit or PR for those
      outcomes. The GEAK documentation commit identifies the published summaries, not an AITER optimization
      commit. Existing historical experience is retained; upstream PR association and effect confidence remain
      unknown.
  conditions:
  - The KV working set, reuse across heads/calls and load representation can be measured for each served regime.
  actions:
  - First remove avoidable scratch or repeated gathers; compare cache policy separately for each operand and
    workload bucket.
  - Inspect generated loads to prove the intended cache modifier survives vectorization, with alignment and
    tail masking preserved.
  - When testing global-to-LDS transfer, measure whether it buys useful prefetch depth without excessive live
    registers or LDS pressure.
  why:
  - Historical decode reports found both positive and negative non-temporal results; footprint changes reversed
    the preferred policy. A DMA instruction alone did not establish a gain.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Read-once source code does not imply zero hardware/cache reuse. Re-test policies after changing KV dtype,
    tile geometry or concurrency.
  references:
  - knowledge/operator/attention_decode_paged/README.md
  - knowledge/general/README.md
