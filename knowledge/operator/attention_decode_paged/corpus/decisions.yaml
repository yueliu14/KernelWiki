  question: Does a high LDS or instruction counter identify removable decode latency?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unresolved
    checked_at: '2026-11-05T02:04:28.752814+00:00'
    summary: Read all 2 pinned GEAK summaries already cited by this card. They attribute experiment-specific
