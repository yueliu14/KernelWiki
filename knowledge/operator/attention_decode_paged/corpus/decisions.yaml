  question: What host state can a decode wrapper reuse safely?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unresolved
    checked_at: '2026-11-05T02:04:28.752743+00:00'
    summary: Read all 5 pinned GEAK summaries already cited by this card. They attribute experiment-specific
      implementation or tuning outcomes, but provide no uniquely identified AITER change commit or PR for those
      outcomes. The GEAK documentation commit identifies the published summaries, not an AITER optimization
      commit. Existing historical experience is retained; upstream PR association and effect confidence remain
      unknown.
  conditions:
  - The actual timing boundary exposes repeated allocation, argument preparation or binding overhead.
  actions:
  - Compare direct launch, reusable plans and capture using the same input/stream contract and benchmark protocol.
  - Reuse only invariant device properties and plans; refresh every mutable tensor pointer, scalar and derived
    bound, and manage scratch per concurrent invocation.
  - Treat scale tensors as data-dependent unless their invariance is proven; re-test cache and occupancy policy
    after a storage-dtype change.
  why:
  - Historical reports benefited from host-plan/scratch reuse in some regimes, but stale pointer memoization
    corrupted results and one-node replay often cost more than direct dispatch.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - A warm benchmark that reuses identical tensors does not prove correctness on new inputs. Avoid result caching
    and shape-only caching of data-dependent scales.
  references:
  - knowledge/operator/attention_decode_paged/README.md
  - knowledge/general/README.md
