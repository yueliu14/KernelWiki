  question: When can combining split-KV stages in one dispatch beat a separate reduction?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unresolved
    checked_at: '2026-11-05T02:04:28.752543+00:00'
    summary: Read all 3 pinned GEAK summaries already cited by this card. They attribute experiment-specific
      implementation or tuning outcomes, but provide no uniquely identified AITER change commit or PR for those
      outcomes. The GEAK documentation commit identifies the published summaries, not an AITER optimization
      commit. Existing historical experience is retained; upstream PR association and effect confidence remain
      unknown.
  conditions:
  - Partial results are shared across workgroups and the complete publish/signal/consume protocol can be implemented
    correctly.
  actions:
  - Price the second dispatch and its reduction work against the cost of cross-workgroup visibility, counter
    traffic, held registers and LDS residency.
  - Use a memory-model-correct protocol with initialized per-invocation state, proper scope and ordering; validate
    concurrent streams and repeated calls.
  - Compare small and wide grids separately and retain the two-dispatch path when protocol/resource costs exceed
    the saved launch.
  why:
  - Historical summaries reported both useful fused merges and large regressions caused by synchronization
    or residency cost; fewer launches did not consistently mean lower latency.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Instruction-level fence shortcuts from one report are not portable synchronization recipes. A last-arriver
    scheme must not require unscheduled workgroups to run while resident workgroups spin.
  references:
  - knowledge/operator/attention_decode_paged/README.md
  - knowledge/general/README.md
