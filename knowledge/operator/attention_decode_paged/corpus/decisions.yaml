  question: How should a decode tile and its split grid be sized together?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unresolved
    checked_at: '2026-11-05T02:04:28.752343+00:00'
    summary: Read all 8 pinned GEAK summaries already cited by this card. They attribute experiment-specific
      implementation or tuning outcomes, but provide no uniquely identified AITER change commit or PR for those
      outcomes. The GEAK documentation commit identifies the published summaries, not an AITER optimization
      commit. Existing historical experience is retained; upstream PR association and effect confidence remain
      unknown.
  conditions:
  - The kernel has head-width-dependent resource use, paged or windowed KV, and a legal split/reduce path.
  actions:
  - Inspect the real launched grid before tuning; decouple logical KV tile size from storage page size only
    if the gather implementation supports it.
  - Sweep tile size, useful split count, warp count and pipeline depth together, accounting for head width,
    CU count and scratch round trips.
  - Pass identical tile/segment bounds through producer and reducer, cull truly empty window segments and validate
    widest heads and ragged tails.
  why:
  - Historical reports improved underfilled or oversplit launches through coupled geometry changes; their optimal
    workgroups-per-CU targets differed, and a previously helpful memory change could regress after retiling.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Neither one workgroup per CU nor a fixed multiple is a universal optimum. Graph metadata and fallback branches
    must remain valid for every supported shape.
  references:
  - knowledge/operator/attention_decode_paged/README.md
  - knowledge/general/README.md
