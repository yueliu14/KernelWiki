  question: How do page layout and compiled template contracts constrain paged-attention tuning?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unresolved
    checked_at: '2026-11-05T02:04:28.751918+00:00'
    summary: Read all 3 pinned GEAK summaries already cited by this card. They attribute experiment-specific
      implementation or tuning outcomes, but provide no uniquely identified AITER change commit or PR for those
      outcomes. The GEAK documentation commit identifies the published summaries, not an AITER optimization
      commit. Existing historical experience is retained; upstream PR association and effect confidence remain
      unknown.
  conditions:
  - The served path uses paged or ragged KV with a version-specific dispatch/template selector.
  actions:
  - Inspect the actual page size, cache dtype, head width and called entry before selecting a rewrite or library
    candidate.
  - Keep producer and reduce partition sizes consistent with the compiled kernel; validate a partition sweep
    before accepting its latency.
  - Check shape/dtype eligibility and actual engagement of experimental template variants, including graph
    execution.
  why:
  - Historical reports found that non-power-of-two and one-token pages changed the usable path; an experimental
    BF16/head-width-specific template existed despite an earlier no-knob claim. Incompatible partition sizes
    produced invalid fast results.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Do not generalize old framework flags or template eligibility to another revision. A template intended
    for BF16 KV may cease to apply after KV quantization.
  references:
  - knowledge/operator/attention_decode_paged/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
    conditions:
    - The served path uses paged or ragged KV with a version-specific dispatch/template selector.
    summary: Historical reports found that non-power-of-two and one-token pages changed the usable path; an
