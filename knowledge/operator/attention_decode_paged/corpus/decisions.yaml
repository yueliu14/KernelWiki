      unknown.
  conditions:
  - The attention kernel has substantial overlap between memory, LDS traffic and computation.
  actions:
  - Attribute elapsed time to the actual dependent chain and test a targeted change, rather than promoting
    an instruction/register reduction from counters alone.
  - Check the regime again after changing tile footprint or parallelism; preserve required masks and ownership
    even when their cost looks redundant.
  why:
  - Reported decode variants with fewer instructions or registers could lose because the removed work was overlapped;
    some footprint changes helped only underfilled cases.
