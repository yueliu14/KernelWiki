    checked_at: '2026-11-04T15:47:13.494575+00:00'
    summary: Reviewed the linked PRs and cited results for the specified backend/axes; other implementations
      and shapes remain unreviewed.
  conditions:
  - Correct scoring exists but query-row count and valid KV window lengths leave an uneven grid.
  actions:
  - Try query-row grouping and KV splitting with the exact row-window contract, keeping any split workspace
    and completion protocol.
  - Use the wrapper's variant resolver and split policy as legal starting points; they are shape- and architecture-dependent.
  - Account for score writes and top-k/merge work when comparing partitions rather than considering only the
    dot-product body.
  alternatives:
