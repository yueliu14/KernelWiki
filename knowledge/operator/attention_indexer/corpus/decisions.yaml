  question: Which packed payload, scale and tile constraints accompany paged MXFP4 scoring?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions:
  - The candidate targets build_pa_mqa_logits_fp4_module and its packed cache representation.
  actions:
  - Keep packed Q/KV bytes, E8M0 scale indexing and physical block-table addressing aligned; head_dim is not
    the byte width of a packed row.
  - Enforce head_dim multiples of 128, head-count/MFMA alignment and page/block tile divisibility from the
    builder.
  - Preserve the per-K-tile Q and KV scale application inside scaled MFMAs rather than substituting one scale
    for a whole row.
  alternatives:
  - Use explicit unpack/dequant scoring as a reference for the same logical cache.
  why:
  - The builder separately derives packed data and KV-scale strides and applies scale_a/scale_b for each compute
    tile.
  source_evidence:
  - aiter_b3ad6c46:src_e48c6dafa5c4e45b
  measurement_evidence: []
  limitations:
  - A contiguous FP8 score kernel cannot consume this cache by changing dtype alone.
  - Builder existence is not proof that the current host route enables this variant.
  references:
  - knowledge/operator/attention_indexer/README.md
- id: indexer-minimax-page-max-score
  type: semantic
  axes:
