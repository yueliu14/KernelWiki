  question: When can a single-query index score use a vector reduction instead of a degenerate matrix product?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id001
  - Exactly one query is scored and the reference operation is the corresponding dot product over the same
    keys/features.
  actions:
  - Compare an FP32 multiply/reduce specialization with the matrix path, preserving the score formula, masks
    and output layout.
  - Keep the multi-query fallback and its required FP32 accumulation for low-precision cache inputs.
  why:
  - A historical sparse-attention report included a separate decode index-score vector specialization alongside
    its prefill sub-tiling change.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - A combined serving improvement does not isolate this specialization. Reduction-order and low-precision
    accuracy must pass the unchanged accepted gate.
  references:
  - knowledge/operator/attention_indexer/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
    conditions: *id001
    summary: A historical sparse-attention report included a separate decode index-score vector specialization
