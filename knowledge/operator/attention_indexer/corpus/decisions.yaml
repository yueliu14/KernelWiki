- id: relu-on-mfma-accumulator-integer-max
  type: performance_candidate
  axes:
  - compute_schedule
  - numerical_contract
  match:
    operator_families:
    - attention_indexer
    target_languages:
    - gluon
    - triton
    gfx:
    - gfx950
  question: Can a ReLU on f32 MFMA accumulator output be lowered to one integer max instead of a canonicalize
    plus a float max?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions:
  - The kernel applies max(x, 0) to f32 matrix-core (MFMA) output before scaling or reduction
  - 'The ISA shows two v_max_f32 per element after the MFMA: LLVM does not treat MFMA results as canonical,
    so it inserts a canonicalize before the real max'
  - Epilogue VALU work sits in the main loop alongside MFMA, so removing VALU instructions can shorten the
    iteration
  - Only finite accumulator values need correct ReLU semantics (no NaN propagation contract)
  actions:
  - Inspect the compiled ISA around each ReLU for a canonicalize v_max_f32 followed by the real max
  - Bitcast the f32 value to int32, take an integer max with 0, and bitcast back to f32 (one v_max_i32)
  - Apply the rewrite at every ReLU site of the path (prologue, main loop, tail and any fused extra rows),
    not only the steady-state loop
  - Recount main-loop VALU, VGPRs, occupancy and spills from the ISA after the change
  - Re-run correctness and selected-index parity, since scores feed top-k
  alternatives:
  - Keep the float max where the compiler already emits a single max or the epilogue is off the critical path
  - Fold the ReLU into the weight scale as sign(w) * max(o*|w|, 0); in the recorded attempt the engineer reported
    it de-packed the multiplies, raised VALU and VGPRs, and left speed flat
  why:
  - A negative IEEE f32 has its sign bit set, so it is a negative int32 and an integer max with 0 maps it to
    +0.0
  - Non-negative f32 values order the same as their int32 bit patterns, so non-negative inputs pass through
    unchanged
  - One v_max_i32 replaces a canonicalize v_max_f32 plus the max, freeing VALU issue slots in an MFMA-interleaved
    loop
  source_evidence: []
  measurement_evidence: []
  limitations:
  - NaN handling differs from the float max; use the rewrite only where accumulator output is known finite
  - -0.0 becomes +0.0, which matches max(-0.0, 0.0) only up to the sign of zero
  - Recorded on one fp8_e4m3 indexer decode step on gfx950; the gain depends on epilogue VALU being on the
    critical path
  - Rewrites that remove the canonicalize by reshaping the math can break packed multiplies and raise VGPRs,
    so recheck the ISA
  experience:
  - outcome: beneficial
    conditions:
    - fp8_e4m3 paged MQA-logits indexer decode on gfx950 (MI355X), Gluon kernel with ReLU, per-head weight
      scale and row reduction on MFMA f32 output, including fused second query rows
    - decode M=6-18; the engineer's buckets were batch 2-3 at contexts from 104k to 418k tokens and all improved
    - the rewrite was applied at every ReLU site (prologue, main loop, tail) of one gfx950 preshuffle code
      path
    - the engineer's ISA count reported main-loop VALU 276 -> 221 with MFMA count, VGPRs (129), occupancy (3)
      and spills (0) unchanged
    - MFMA output in this kernel is finite, so the NaN difference of the integer max did not apply; correctness,
      parity and graph replay passed
    summary: Replacing the float ReLU on MFMA output with an int32 max on its bits removed the extra canonicalize
      max per element. The step beat its parent at unchanged register use and occupancy, and was built on in
      later rounds.
    provenance:
      kind: private_summary
      references: []
      artifacts: not_published
      verification: internally_validated
    context:
      gfx: gfx950
      software: torch 2.9.1+rocm7.2.0, HIP 7.2.26015, Triton 3.7.0; AMD Instinct MI355X
      dtype: fp8_e4m3
      shape_layout: decode M=6-18
      baseline: the parent source of the same recorded GEAK optimization step
