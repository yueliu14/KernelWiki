- id: indexer-topk-row-index-contract
  type: constraint
  axes:
  - selection_contract
  - implementation_contract
  match:
    operator_families:
    - attention_indexer
    target_languages:
    - flydsl
  question: What must a top-k implementation preserve beyond score values?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions:
  - A per-row selector converts scores into the indices consumed by sparse attention.
  actions:
  - Validate effective row lengths, k, output index dtype and strides, and optional score outputs.
  - For packed rows, preserve the convention that output indices are relative to row_starts, while plane_width
    bounds the launch geometry.
  - Check tie behavior and padding explicitly for the selected implementation; a stable parameter in a wrapper
    signature is not proof that every fast path enforces stable ordering.
  - For graph capture, initialize the split path's stream-local arrival state on the capture stream as documented
    by the wrapper.
  alternatives:
  - Compare against a reference top-k with an explicitly stated tie convention and row bounds.
  why:
  - The host wrapper validates tensor signatures, has packed-row inputs, and dispatches between one-workgroup
    and split implementations.
  source_evidence:
  - aiter_b3ad6c46:src_f484e96fd009362f
  - aiter_b3ad6c46:src_37b61d0cec250b59
  measurement_evidence: []
  limitations:
  - Score closeness alone does not prove index equivalence.
  - Allocated row width and effective per-request context length are separate quantities.
  references:
  - knowledge/operator/attention_indexer/README.md
- id: indexer-dcp-merge-ownership
  type: constraint
  axes:
  - distributed_merge
  - selection_contract
  - cache_layout
  match:
    operator_families:
    - attention_indexer
    target_languages:
    - flydsl
    requires:
    - distributed_candidates
  question: How does DCP top-k merge preserve rank ownership and physical KV slots?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: reviewed
    checked_at: '2026-11-04T16:56:44.784904+00:00'
    summary: Reviewed the linked PR changes, body and discussion for the specified implementation/conditions.
      This is a scoped historical association, not a complete review of every backend or version.
  conditions:
  - The selected implementation merges rank-major candidate scores for qlen=1 decode.
  actions:
  - 'Keep gathered candidate columns in rank-major order: column // local_k identifies the owner rank.'
  - Pad unused score candidates with negative infinity, not zero; another rank's plane has no local index liveness
    signal.
  - Provide int32 block tables, indices, indptr, staging and counts with the validated capacity; convert the
    owned winning logical tokens to physical cache slots.
  - Respect the wave64 and qlen=1 restrictions and warm each compiled shape before graph capture.
  alternatives:
  - Keep candidate gathering, global selection and rank-local packing as explicit stages while validating ownership.
  why:
  - The merge API documents positional ownership, and its validator checks dtype, dimensionality, rank range
    and output capacities.
  source_evidence:
  - aiter_b3ad6c46:src_6a4f259be2e3b17c
  - aiter_b3ad6c46:src_ebe0c6b763af4201
  measurement_evidence: []
  limitations:
  - This merge does not implement the all-gather itself.
  - The decode-only row/indptr contract cannot be assumed valid for arbitrary prefill queries.
  references:
  - knowledge/operator/attention_indexer/README.md
  experience:
  - outcome: beneficial
    conditions:
    - Rank-major scores, W=8, k_loc=topk=2048, qlen=1, losing -inf padding, and valid physical-slot maps; the
      all-gather itself is outside the measurement.
    summary: The fused owned-slot DCP merge has a reported single-operator benefit; real multi-GPU all-gather
      and full-decode attribution remain unvalidated.
    provenance:
      kind: upstream_report
      references: []
      artifacts: not_published
      verification: not_reproduced
    upstream:
      pr: aiter_pr_5123
      change_refs:
      - owned_kv_slots
      result_refs:
      - one_row
      - many_rows
      assessment:
        association:
          level: high
          reasons:
          - The reviewed commit incorporates or changes the named construct in the cited implementation; the
            assessment is limited to this backend and version.
          missing_evidence: []
        attribution:
          scope: bundle
          confidence:
            level: low
            reasons:
            - The report concerns the implementation or validity change as a whole; it does not isolate the
              contribution of this individual direction.
            missing_evidence:
            - isolated_comparison
          isolation_source_refs: []
