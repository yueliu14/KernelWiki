provenance:
  schema_version: 6
  operator_family: attention_indexer
  curator_contract: Conditioned source precedents; target-workload validation decides correctness and performance.
traits:
  paged_kv: The design resolves logical KV positions through a physical page table.
  distributed_candidates: Top-k candidates are gathered from multiple ranks in a declared ownership order.
cards:
- id: indexer-mqa-score-semantics
  type: semantic
  axes:
  - score_semantics
  - numerical_contract
  match:
    operator_families:
    - attention_indexer
    target_languages:
    - triton
    - flydsl
    - gluon
  question: What does the DeepSeek-style MQA indexer compute before top-k?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions:
  - The workload uses weighted, rectified MQA logits over a per-query KV window.
  actions:
  - Preserve logits[m,n] = sum_h ReLU(dot(Q[m,h,:], K[n,:]) * kv_scale[n]) * weights[m,h].
  - Keep rectification before the head reduction and preserve the signed head weights and KV scale placement.
  - Validate selected indices after top-k as well as score error; small score changes near the cutoff may change
    the sparse attention input.
  alternatives:
  - Use a direct FP32 scoring expression and top-k over the same valid window as a reference.
  why:
  - The Triton score kernel performs the dot, KV scaling, ReLU, per-head weighting and reduction without softmax
    or a value projection.
  source_evidence:
  - aiter_b3ad6c46:src_e7b7a5ef2934fb22
  measurement_evidence: []
  limitations:
  - This is not ordinary softmax attention and not the MiniMax page-max scoring contract.
  references:
  - knowledge/operator/attention_indexer/README.md
  solutions:
  - backend: flydsl
    mechanism: The host API supplies the same Q, KV, scales, weights and row windows to explicitly selected
      kernel variants.
    source_evidence:
    - aiter_b3ad6c46:src_744823ffb69cb339
- id: indexer-fp8-architecture-format
  type: constraint
  axes:
  - numerical_contract
  - implementation_contract
  match:
    operator_families:
    - attention_indexer
    target_languages:
    - flydsl
    gfx:
    - gfx942
    - gfx950
  question: Which FP8 format conversions does the contiguous FlyDSL MQA logits path require?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions:
  - The selected path is flydsl_fp8_mqa_logits on gfx942 or gfx950.
  actions:
  - On gfx950, respect the wrapper's native e4m3fn Q/KV requirement.
  - On gfx942, keep the FN-to-FNUZ byte interpretation, negative-zero handling and compensating scale factor
    together; each FN operand contributes a factor of two.
  - Retain the wrapper's contiguous Q/KV materialization and logical-rank restoration for single-token scales
    and weights.
  alternatives:
  - Use a native-format path or an explicit higher-precision reference before attempting a byte reinterpretation.
  why:
  - The host wrapper explicitly distinguishes the two architectures and adjusts kv_scales consistently with
    operand recasting.
  source_evidence:
  - aiter_b3ad6c46:src_744823ffb69cb339
  measurement_evidence: []
  limitations:
  - The conversion is specific to the stated e4m3 formats and implementation; it is not a generic FP8 cast
    rule.
  references:
  - knowledge/operator/attention_indexer/README.md
- id: indexer-window-and-clean-output
  type: constraint
  axes:
  - score_semantics
  - selection_contract
  - implementation_contract
  match:
    operator_families:
    - attention_indexer
    target_languages:
    - flydsl
    - triton
  question: Who initializes logits outside each query's valid window?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: reviewed
    checked_at: '2026-11-04T15:47:13.494575+00:00'
    summary: Reviewed the linked PRs and cited results for the specified backend/axes; other implementations
      and shapes remain unreviewed.
  conditions:
  - The score buffer may be consumed by top-k over a larger allocated row.
  actions:
  - Preserve the half-open [cu_starts, cu_ends) validity interval and mask the tail.
  - With clean_logits=True the FlyDSL kernel writes negative infinity outside the window; with False the caller
    owns the skipped positions.
  - Never feed uninitialized or stale out-of-window values into a selector that does not independently honor
    the same bounds.
  alternatives:
  - Initialize invalid scores explicitly, or use a selector with verified matching row bounds.
  why:
  - The public FlyDSL API makes output cleaning an explicit behavior flag rather than an unconditional prefill
    of the output tensor.
  source_evidence:
  - aiter_b3ad6c46:src_744823ffb69cb339
  measurement_evidence: []
  limitations:
  - Skipping output cleaning is only valid when the downstream validity contract excludes those positions.
  references:
  - knowledge/operator/attention_indexer/README.md
  experience:
  - outcome: beneficial
    conditions:
    - clean_logits=True with identical valid-window and negative-infinity semantics; H=64 and the cited shape.
    summary: The PR reports lower operator latency after fusing invalid-logit initialization on gfx942.
    provenance:
      kind: upstream_report
      references: []
      artifacts: not_published
      verification: not_reproduced
    upstream:
      pr: aiter_pr_4538
      change_refs:
      - fused_clean
      result_refs:
      - gfx942_clean
      assessment:
        association:
          level: high
          reasons:
          - The reviewed PR commit changes the named implementation and the quoted before/after construct.
          missing_evidence: []
        attribution:
          scope: isolated
          confidence:
            level: medium
            reasons:
            - The report compares this isolated mechanism but has not been reproduced.
            missing_evidence:
            - independent_ablation
          isolation_source_refs:
          - body
        applies_to:
          axes:
          - implementation_contract
          backend: flydsl
- id: indexer-paged-mxfp4-layout
  type: constraint
  axes:
  - cache_layout
  - numerical_contract
  - implementation_contract
  match:
    operator_families:
    - attention_indexer
    target_languages:
    - flydsl
    requires:
