- id: gfx950-fp8-k128-scaled-mfma-unit-scales
  type: performance_candidate
  axes:
  - compute_schedule
  - implementation_contract
  - numerical_contract
  match:
    operator_families:
    - attention_indexer
    target_languages:
    - gluon
    gfx:
    - gfx950
  question: On gfx950, should an FP8 score dot with reduction length 128 use one unit-scale 16x16x128 scaled
    MFMA instead of four 16x16x32 FP8 MFMAs?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions:
  - Target is gfx950 (CDNA4), where the 16x16x128 f8f6f4 scaled MFMA exists
  - Both operands are FP8 e4m3 and the per-MFMA reduction length is exactly 128 (e.g. index head dim 128)
  - Dequantization scales are applied outside the MFMA (after accumulation), so the instruction can run with
    unit scales
  - 'Measured setting: decode (M=6-18) with one score MFMA group per KV chunk'
  actions:
  - Gate on CDNA version 4 and call the scaled MFMA (gl.amd.cdna4.mfma_scaled) with e4m3 operands and None
    (unit) scales
  - Build the MFMA layout with instr_shape [16,16,128] and set both dot-operand layouts to k_width=32
  - Keep the 16x16x32 FP8 MFMA path, its layout and k_width=16 for non-CDNA4 targets
  - Route every MFMA call site (main loop, pipelined stages, tail, fused extra query rows) through one helper
    so all paths use the same instruction and layout
  - Re-run score correctness and top-k index parity, because the 128-wide scaled instruction may accumulate
    in a different order than four chained 16x16x32 MFMAs
  - Re-dump the ISA to confirm the MFMA count, VGPR use and occupancy after the change
  alternatives:
  - Keep four 16x16x32 FP8 MFMAs per 128-wide dot, which also works on CDNA3
  - Pass real scales to the scaled MFMA instead of applying them afterwards (not tested in this step)
  - Use a different MFMA tile shape or layout for the score dot
  why:
  - One instruction covers the whole 128-wide reduction, so fewer MFMA instructions are issued per chunk
  - With unit scales the scaled MFMA computes the same e4m3 products as the unscaled FP8 MFMA
  - The gain is associated with replacing four MFMAs by one per 128-wide dot; the mechanism was not profiled
    in the measured step
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Evidence is one recorded step on one gfx950 FP8 decode indexer kernel; prefill and other shapes were not
    measured
  - Reduction lengths other than 128 and other FP8 formats were not tested
  - Not available on CDNA3 (gfx942); that target keeps the 16x16x32 path
  - The ISA, VGPR and occupancy claims were inherited from an earlier round and not re-verified in the measured
    step
  - A changed accumulation order can change score bits and therefore top-k selections; parity must be checked
    rather than assumed
  experience:
  - outcome: beneficial
    conditions:
    - Gluon paged MQA indexer logits kernel in decode (M=6-18) on gfx950 (MI355X), FP8 e4m3 Q and K
    - Score reduction (head) dimension of 128 per MFMA call; the K scale and per-head weights are applied after
      the MFMA, so the scaled MFMA ran with unit scales
    - 'Every MFMA site was switched together through one helper: main loop, pipelined stages, tail, and the
      fused extra draft query rows that reuse the same K operand'
    - The task's correctness checks passed; the engineer's interleaved same-slot rerun reported a consistent
      gain over the parent on every decode case, but did not re-dump the ISA
    summary: On gfx950 FP8 paged MQA decode logits, issuing one unit-scale 16x16x128 scaled MFMA per 128-wide
      dot instead of four 16x16x32 FP8 MFMAs improved the step over its parent, and later rounds built on it.
