- id: indexer-decode-query-row-fusion-per-k-tile
  type: performance_candidate
  axes:
  - work_partition
  - data_movement
  - compute_schedule
  match:
    operator_families:
    - attention_indexer
    target_languages:
    - gluon
    gfx:
    - gfx950
  question: How many decode query rows should share each loaded K tile in paged MQA-logits scoring, and when
    should a deeper fusion be selected?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions:
  - Paged MQA-logits decode where several next-n/draft rows of a row group read the same KV pages
  - The kernel already fuses rows and loads each K tile once per workgroup
  - Row-group count is divisible by the candidate fusion factor and row groups do not straddle sequences
  - Long contexts, where per-row K-tile loads and layout conversions are repeated work
  actions:
  - Add the fusion factor as a constexpr and compile a separate specialization in which each K tile feeds one
    MFMA per fused row
  - Give every fused row its own Q load, weight load, context length, -inf window/causal mask and output-row
    store; share only the K tile
  - Re-derive SplitKV so the total number of workgroups is kept when fusion reduces the row-group count
  - Select the fusion factor on the host from a Python-int shape parameter, so a captured graph freezes the
    choice
  - Before timing, check the ISA for VGPR count, occupancy, scratch and spills in both the old and the new
    specialization
  - Measure short-context and long-context cases separately and gate the deeper fusion to the regime where
    it wins
  alternatives:
  - Keep the shallower (2-row) fused body for all shapes
  - Gate on each call's actual context length instead of the pool-wide max_model_len
  - Recover parallelism through a larger split-KV instead of deeper row fusion
  why:
  - Each K tile load and its layout conversion is amortized over more query rows
  - More MFMA work is issued per loaded K tile, raising arithmetic per byte of KV read
  - Keeping per-row lengths and masks preserves each row's scores, so top-k selection is unchanged
  source_evidence: []
  measurement_evidence: []
  limitations:
  - One recorded step on gfx950, preshuffled-KV path only; variable-context, non-preshuffled and gfx1250 paths
    were not changed
  - The engineer reported that the ungated 3-row body was slower (-3..-7%) at the 104k and 173k context cases,
    so the gain is regime-specific
  - In serving, max_model_len is pool-wide, so a gate on it does not track the context length of each call
  - The gate assumes row groups never straddle sequences
  - 'Register use rises with fusion depth: the engineer reported 146 VGPRs for the 3-row variant versus 122
    for the 2-row variant, at the same occupancy; deeper fusion may cross an occupancy limit'
  experience:
  - outcome: beneficial
    conditions:
    - Paged FP8 MQA-logits indexer decode in Gluon, preshuffled-KV path, excluding the variable-context and
      gfx1250 variants
    - Row-group count divisible by 3, upgrading an existing 2-row fused body to 3 rows
    - Applied only when the host-side max_model_len is at least 200k; shorter calls stayed on the 2-row body
    - SplitKV re-derived so the total workgroup count did not drop when fusion reduced the number of row groups
    summary: Fusing a third decode query row onto each shared K tile, gated to long max_model_len, beat its
      2-row parent. The engineer associated the gain with the long-context cases and reported the shorter-context
      cases as roughly neutral because the gate kept them on the 2-row body.
    provenance:
      kind: private_summary
      references: []
      artifacts: not_published
      verification: internally_validated
    context:
      gfx: gfx950
      software: torch 2.9.1+rocm7.2.0, HIP 7.2.26015, Triton 3.7.0; AMD Instinct MI355X
