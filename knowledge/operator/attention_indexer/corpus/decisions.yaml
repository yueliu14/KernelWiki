  question: Which FP8 format conversions does the contiguous FlyDSL MQA logits path require?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: reviewed
    checked_at: '2026-11-05T02:11:46.064634+00:00'
    summary: Reviewed the linked PR changes, body and discussion for the specified implementation and conditions.
      Historical source incorporation is distinguished from measured effects; other backends and later versions
      are outside this scoped association.
  conditions:
  - The selected path is flydsl_fp8_mqa_logits on gfx942 or gfx950.
  actions:
  - On gfx950, respect the wrapper's native e4m3fn Q/KV requirement.
  - On gfx942, keep the FN-to-FNUZ byte interpretation, negative-zero handling and compensating scale factor
    together; each FN operand contributes a factor of two.
  - Retain the wrapper's contiguous Q/KV materialization and logical-rank restoration for single-token scales
    and weights.
  - Treat these format steps as correctness requirements, not a speed lever; benchmark against the current
    Gluon baseline per shape.
  alternatives:
  - Use a native-format path or an explicit higher-precision reference before attempting a byte reinterpretation.
  why:
  - The host wrapper explicitly distinguishes the two architectures and adjusts kv_scales consistently with
    operand recasting.
  source_evidence:
  - aiter_b3ad6c46:src_744823ffb69cb339
  measurement_evidence: []
  limitations:
  - The conversion is specific to the stated e4m3 formats and implementation; it is not a generic FP8 cast
    rule.
  - 'Reported comparisons do not isolate format conversion: on gfx950 with clean_logits=False, FlyDSL was slower
    than a newer Gluon baseline at batch=1, Sq=Skv=4096, H=64 but faster at batch=2, Sq=Skv=8192, H=32.'
  - The large gfx950 gain is one fn/fn skinny prefill case (Sq=128, Skv=32768) against an older Triton/Gluon
    baseline; the gfx942 gain was attributed to fused clean_logits initialization; all are low-confidence single
    cases.
