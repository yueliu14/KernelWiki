schema_version: 1
family: attention_indexer
contract:
  source_observation: A source observation is implementation evidence, not measured preference.
  attribution: Whole-implementation performance must not be assigned to an isolated axis.
comparison_context:
  required:
  - operator_family
  - math_contract
  - dtype
  - gfx
  - shape
  - layout
  - baseline
  - accounting
  - aiter_commit
  - toolchain
  contract: Different masks, scale formats, index conventions, routing or state semantics define different
    workloads.
development_order:
- step: 1
  title: Mathematical and validity contracts
  axes:
  - numerical_contract
  - score_semantics
  - selection_contract
- step: 2
  title: Layout and host interfaces
  axes:
  - implementation_contract
  - cache_layout
  - distributed_merge
- step: 3
  title: Candidate design space
  axes:
  - execution_geometry
  - compute_schedule
  - data_movement
  - work_partition
axes:
- id: implementation_contract
  kind: integration_contract
  question: What declarations, dispatch gates, shape checks and host state define a legal implementation?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - symbol_declaration
    - arch_gate
    - config_limit
    - config_space
    - config_validity
    - kernel_family
    - jit_cache
    - asm_object
    - asm_argblock
    - config_lookup
    - dispatch_padding
    - tunable_param
    - instance_name
  knob_aliases: {}
- id: execution_geometry
  kind: performance_choice
  question: How much work does each program own and how is the grid mapped?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - tile_shape
    - waves
    - split_k
    - persistent
    - grid_mapping
    - grid_fill
    - asm_tile
    - asm_launch
  knob_aliases:
    query_tile:
    - ROWS_PER_BLOCK
    kv_tile:
    - BLOCK_KV
    waves:
    - num_warps
    - NUM_WARPS
- id: compute_schedule
  kind: performance_choice
  question: Which compute, reduction and scheduling structures are written explicitly?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - mfma_intrinsic
    - mfma_shape
    - scheduling
    - ck_instance
    - ck_pipeline
    - pipeline_variant
    - lane_reduction
    - atomic_combine
  knob_aliases: {}
- id: data_movement
  kind: performance_choice
  question: How do data move between global memory, LDS and registers?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - lds_stage
    - lds_swizzle
    - lds_pad
    - lds_alloc
    - async_copy
    - access_width
    - cache_policy
    - layout_preshuffle
    - layout_transpose
    - layout_epilogue
    - fragment_layout
  knob_aliases:
    stages:
    - num_stages
    - lds_stage
    - STAGES
    async_copy:
    - use_async_copy
    - async_copy
- id: numerical_contract
  kind: hard_constraint
  question: Which scale, precision and parity conventions must remain unchanged?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - scale_operand
    - scale_in_k_loop
    - scale_after_k_loop
    - parity_tolerance
  knob_aliases: {}
- id: score_semantics
  kind: hard_constraint
  question: Is the score a weighted rectified head sum, a token score or a page maximum?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: cache_layout
  kind: integration_contract
  question: Which packed data/scales and page-table conventions does scoring consume?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: work_partition
  kind: performance_choice
  question: How are rows and KV windows partitioned without changing the score?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: selection_contract
  kind: hard_constraint
  question: Which bounds, index coordinates, padding and tie conventions define top-k?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: distributed_merge
  kind: integration_contract
  question: How are rank-owned candidates merged and converted to cache slots?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
dependencies:
- id: score-to-topk
  axes:
  - score_semantics
  - selection_contract
  - numerical_contract
  relation: coupled_contract
  rule: A score change can change selected indices even when numerical error is small.
  decision_refs:
  - indexer-mqa-score-semantics
  - indexer-topk-row-index-contract
- id: packed-scales
  axes:
  - cache_layout
  - numerical_contract
  - implementation_contract
  relation: coupled_contract
  rule: Packed payload and scale addressing form one ABI.
  decision_refs:
  - indexer-paged-mxfp4-layout
- id: rank-padding
  axes:
  - distributed_merge
  - selection_contract
  - cache_layout
  relation: coupled_contract
  rule: Rank-major ownership, losing padding scores and physical-slot conversion must agree.
  decision_refs:
  - indexer-dcp-merge-ownership
