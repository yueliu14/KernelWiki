- id: attention-online-softmax-mask
  type: semantic
  axes:
  - attention_semantics
  - numerical_contract
  match:
    operator_families:
    - attention_prefill_fmha
    - gqa_mqa_attention
    target_languages:
    - triton
    - flydsl
    - gluon
  question: How must tiled forward attention preserve masking and online softmax normalization?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: reviewed
    checked_at: '2026-11-04T16:56:44.784904+00:00'
    summary: Reviewed the linked PR changes, body and discussion for the specified implementation/conditions.
      This is a scoped historical association, not a complete review of every backend or version.
  conditions:
  - The operation is scaled dot-product forward attention, with an explicit causal or noncausal contract.
  actions:
  - Carry the running maximum, exponential sum and output accumulator together across KV tiles; rescale prior
    contributions when the maximum changes.
  - Apply sequence-tail and causal masks to scores before exponentiation; a zero-filled invalid key is not
    an excluded softmax position.
  - Keep QK scale, exponential base and accumulator precision consistent through the update and any final normalization.
  alternatives:
  - Retain a straightforward unfused reference for the same mask and scale contract.
  why:
  - The Triton prefill kernel updates m_i, l_i and acc jointly, masks invalid scores with negative infinity,
    and casts probabilities to the value dtype before the PV dot.
  source_evidence:
  - aiter_b3ad6c46:src_a3adfa0056dbdf43
  measurement_evidence: []
  limitations:
  - This softmax recurrence does not describe gated-delta or other recurrent attention.
  - An all-masked row needs an explicitly validated convention; the cited prefill body is not proof that every
    empty-row input is supported.
  references:
  - knowledge/operator/attention_prefill_fmha/README.md
  - knowledge/operator/gqa_mqa_attention/README.md
  experience:
  - outcome: beneficial
    conditions:
    - gfx950 FP8-Q/FP8-KV unified-attention prefill, head size 128, query length >=256, no sliding window or
      shuffled cache; retain all remaining masks and online-softmax state.
    summary: The final optimization elides masks only on fully visible prefill tiles; benchmark and revalidation
      revisions are separately recorded.
    provenance:
      kind: upstream_report
      references: []
      artifacts: not_published
      verification: not_reproduced
    upstream:
      pr: aiter_pr_4761
      change_refs:
      - visible_tile_loop
      result_refs:
      - tp1_long_original
      - tp1_long_revalidation
      assessment:
        association:
          level: high
          reasons:
          - The reviewed commit incorporates or changes the named construct in the cited implementation; the
            assessment is limited to this backend and version.
          missing_evidence: []
        attribution:
          scope: bundle
          confidence:
            level: low
            reasons:
            - The report concerns the implementation or validity change as a whole; it does not isolate the
              contribution of this individual direction.
            missing_evidence:
            - isolated_comparison
          isolation_source_refs: []
        applies_to:
          axes:
