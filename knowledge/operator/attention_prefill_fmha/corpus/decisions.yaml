  question: Which prefill path and phase actually benefit from an attention change?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: reviewed
    checked_at: '2026-11-04T16:56:44.784904+00:00'
    summary: Reviewed the linked PR changes, body and discussion for the specified implementation/conditions.
      This is a scoped historical association, not a complete review of every backend or version.
  conditions:
  - A framework routes full attention separately from decode or recurrent-attention layers.
  actions:
  - Identify the actual full-attention callable and importing call sites in every worker; compare eligible
    backend flags without assuming the historical winner transfers.
  - Specialize a zero-prefix path only behind its real prefix-length contract, preserving nonzero-prefix fallback
    and per-row causal masking.
  - Measure serving with its actual prefill/decode mix and unchanged numerical contract.
  why:
  - Historical reports found backend flags or short-chunk specialization useful on particular stacks, while
    isolated prefill gains translated weakly to a decode-heavy workload.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Do not infer a full-model speedup from an isolated prefill ratio. Small numerical changes can affect greedy
    token selection even when a loose local tolerance passes.
  references:
  - knowledge/operator/attention_prefill_fmha/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
    conditions:
    - A framework routes full attention separately from decode or recurrent-attention layers.
