schema_version: 1
family: attention_prefill_fmha
contract:
  source_observation: A source observation is implementation evidence, not measured preference.
  attribution: Whole-implementation performance must not be assigned to an isolated axis.
comparison_context:
  required:
  - operator_family
  - math_contract
  - dtype
  - gfx
  - shape
  - layout
  - baseline
  - accounting
  - aiter_commit
  - toolchain
  contract: Different masks, scale formats, index conventions, routing or state semantics define different
    workloads.
development_order:
- step: 1
  title: Mathematical and validity contracts
  axes:
  - numerical_contract
  - attention_semantics
- step: 2
  title: Layout and host interfaces
  axes:
  - implementation_contract
- step: 3
  title: Candidate design space
  axes:
  - compute_schedule
  - data_movement
  - kv_partition
axes:
- id: implementation_contract
  kind: integration_contract
  question: What declarations, dispatch gates, shape checks and host state define a legal implementation?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - symbol_declaration
    - arch_gate
    - config_limit
    - config_space
    - config_validity
    - kernel_family
    - jit_cache
    - asm_object
    - asm_argblock
    - config_lookup
    - dispatch_padding
    - tunable_param
    - instance_name
  knob_aliases: {}
- id: compute_schedule
  kind: performance_choice
  question: Which compute, reduction and scheduling structures are written explicitly?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - mfma_intrinsic
    - mfma_shape
    - scheduling
    - ck_instance
    - ck_pipeline
    - pipeline_variant
    - lane_reduction
    - atomic_combine
  knob_aliases: {}
- id: data_movement
  kind: performance_choice
  question: How do data move between global memory, LDS and registers?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - lds_stage
    - lds_swizzle
    - lds_pad
    - lds_alloc
    - async_copy
    - access_width
    - cache_policy
    - layout_preshuffle
    - layout_transpose
    - layout_epilogue
    - fragment_layout
  knob_aliases:
    stages:
    - num_stages
    - lds_stage
    - STAGES
    async_copy:
    - use_async_copy
    - async_copy
- id: numerical_contract
  kind: hard_constraint
  question: Which scale, precision and parity conventions must remain unchanged?
  comparison_contract: Compare only the same workload and ABI; a source declaration supplies no performance
    ranking.
  source_mappings:
  - representation: source_observation
    categories:
    - scale_operand
    - scale_in_k_loop
    - scale_after_k_loop
    - parity_tolerance
  knob_aliases: {}
- id: attention_semantics
  kind: hard_constraint
  question: What are the score, mask, head-mapping and normalization semantics?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
- id: kv_partition
  kind: performance_choice
  question: How are query and KV work partitioned, and how are partials merged?
  comparison_contract: Meaning is established by the curated cards and cited function bodies, not inferred
    from an API name.
  source_mappings: []
  knob_aliases: {}
dependencies: []
