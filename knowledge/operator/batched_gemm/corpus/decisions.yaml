  experience:
  - outcome: beneficial
    conditions:
    - gfx950, e8m0 32x32 or 128x128 scales; keep the two tuned populations and their different baselines separate.
    summary: The shared MXFP8 implementation has reported tuned linear-GEMM gains; the PR gives no separate
