  question: How can batched GEMM tile, buffering and split choices be seeded legally?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - The selected implementation matches the cited path and its input contract.
  actions:
  - 'Treat the parsed kernel name as a configuration bundle: tile M/N/K, warp grid, buffers, K splits, direct-B
    mode and scale preloading.'
  - Use the shape tier as a starting point and retain the fallback legality search over narrower tiles, fewer
    stages and per-stage scales.
  - Check the complete configuration before compiling; direct-B candidates and LDS-staged candidates have different
    split policies.
  alternatives:
  - Keep a simpler implementation with the identical numerical and layout contract for comparison.
  why:
  - The cited source declares these operations and checks; the combination is part of its interface.
  source_evidence:
  - aiter_b3ad6c46:src_48ce71b95815ba5a
