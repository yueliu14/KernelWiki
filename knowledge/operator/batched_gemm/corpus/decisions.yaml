  question: Which batch and scale layouts does the MXFP8 BMM wrapper accept?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: reviewed
    checked_at: '2026-11-05T02:10:32.112473+00:00'
    summary: Reviewed the linked PR changes, body and discussion for the specified implementation and conditions.
      Historical source incorporation is distinguished from measured effects; other backends and later versions
      are outside this scoped association.
  conditions:
  - The selected implementation matches the cited path and its input contract.
  actions:
  - Preserve XQ [M,B,K], preshuffled WQ [B,N,K] and Out [M,B,N]; batch is not a freely broadcast dimension
    in this entry point.
  - Select a runner using the architecture, weight-scale block and activation-scale orientation together.
  - On the gfx950 path distinguish 32x32 from 128x128 weight-scale blocks and row-major from the supported
    column-major activation scales.
  alternatives:
  - Keep a simpler implementation with the identical numerical and layout contract for comparison.
  why:
  - The cited source declares these operations and checks; the combination is part of its interface.
  source_evidence:
  - aiter_b3ad6c46:src_0c6d9aed9bf8a1da
  - aiter_b3ad6c46:src_5fe68591fabd20e2
