    with a state-size requirement.'
  - 'Select the cache output format explicitly: per-row FP8, grouped FP8 and FP4 have different scales and
    layouts.'
  - Enforce the builder's vector-width, rotary-dimension, state-size and FP4 alignment checks before tuning
    its pipeline.
  alternatives:
  - Keep compression and quantized cache packing separate until both intermediate outputs agree with the reference.
  why:
  - The builder couples compression geometry, online rescaling, quantization and cache scatter in one implementation.
