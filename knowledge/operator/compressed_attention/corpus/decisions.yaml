      are outside this scoped association.
  conditions:
  - The chosen source path is the fused compression/cache preparation kernel, not ordinary dense attention.
  actions:
  - 'Preserve the overlap setting: the builder uses K = 2*ratio for overlap and K = ratio without overlap,
    with a state-size requirement.'
  - 'Select the cache output format explicitly: per-row FP8, grouped FP8 and FP4 have different scales and
    layouts.'
  - Enforce the builder's vector-width, rotary-dimension, state-size and FP4 alignment checks before tuning
    its pipeline.
  alternatives:
  - Keep compression and quantized cache packing separate until both intermediate outputs agree with the reference.
  why:
  - The builder couples compression geometry, online rescaling, quantization and cache scatter in one implementation.
  source_evidence:
  - aiter_b3ad6c46:src_24c98837f9940bb0
  measurement_evidence: []
  limitations:
  - This source is a compression/preparation stage; it is not proof of a complete compressed-attention serving
    path.
  - FP4 and FP8 scale contracts are not interchangeable.
