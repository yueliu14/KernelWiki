  - 'Apply the identical transform at every site: the global-to-LDS store and the LDS-to-fragment load, for
    each operand that goes through LDS.'
  - 'Re-derive the swizzle period per architecture: gfx942 LDS has 32 banks in 64 KiB, gfx950 has 64 banks
    in 160 KiB, so a stride that fully aliases on one may only partially conflict on the other (background).'
  alternatives:
  - Keep the unswizzled layout as the control arm.
  - Pad the LDS row instead of swizzling when LDS headroom allows — the FlyDSL grouped-GEMM kernels pad K by
