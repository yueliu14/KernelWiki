- id: flydsl-preshuffle-b-layout-contract
  type: performance_candidate
  axes:
  - operand_layout
  - runtime_contract
  - implementation_variant
  - configuration_constraints
  match:
    operator_families:
    - dense_gemm
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
