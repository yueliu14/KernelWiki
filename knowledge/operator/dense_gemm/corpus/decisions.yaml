provenance:
  schema_version: 4
  operator_family: dense_gemm
  curator_contract: Conditioned source precedents; target-workload validation decides correctness and performance.
traits:
  lds_staging: 'The design stages at least one operand tile through LDS: it is stored to LDS and the MFMA fragments
    are read back from it.'
  reused_weight: B, the weight, is reused across calls, so a one-time host-side layout transform such as a
    preshuffle is paid once per weight rather than per call.
  split_k_hot_loop: The K loop is hand-scheduled with ROCm scheduling directives over LDS-staged operands,
    as the FlyDSL split-K HGEMM hot loop is.
cards:
- id: flydsl-gfx942-path-gates
  type: constraint
  axes:
  - architecture_capability
  - compute_instruction
  - memory_access
  - implementation_variant
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - grouped_gemm_moe
    - batched_gemm
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    gfx:
    - gfx942
  question: Which FlyDSL GEMM paths does gfx942 (MI300X) actually give you, and which does it silently switch
    or refuse?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - operator_family=gemm
  - target_language=flydsl
  - target architecture is gfx942 — read this before costing any other card on this page
  actions:
  - Read the architecture gates before the tuning tables. Whether a path exists on your box outranks every
    fact about how to tune it, and several gates in this library key on gfx942 alone.
  - Do not fund async copy for the split-K HGEMM family on gfx942. That family computes its async-copy flag
    as `architecture is not gfx942`, rejects any request that disagrees, and its kernel hard-codes async off
    on this branch — there is no knob to flip. This does NOT carry over to the A8 (fp8/int8) preshuffle family,
    which keeps `use_async_copy` as a real knob on gfx942 with a 4-byte A copy instead of 16 — see flydsl-async-copy-by-family.
  - Do not fund the small-M kernel family on gfx942. Its compile entry point raises, and its config registry
    returns nothing. Port the design if you want it; you cannot call it.
  - Expect the HGEMM to use the m16n16k16 fragment with 4-byte DMA and two MFMA steps per warp-K, not the m16n16k32
    / 16-byte / one-step bundle the other architectures get. The choice is made for you by one architecture
    test — see flydsl-half-mfma-call-forms.
  - Expect the A8 family on gfx942 to take its hand-written gfx942 schedule branch, K=32 fp8 MFMAs instead
    of the K=128 scaled MFMA, and tile_k=64 tiles that the gfx950 catalog omits — see flydsl-a8-mfma-selection
    and flydsl-a8-interleaved-schedule.
  - 'Expect no shipped FlyDSL seed: every gfx942 fp8 row in AITER''s tuned databases went to CK or ASM. Budget
    a FlyDSL kernel on this box as authoring work, not as a lookup — see gemm-shape-regime-routing.'
  - 'On gfx950 these gates open: the wider fragment, the 16-byte DMA, async copy and the small-M family are
    all in play. Other architectures are not excluded by these gates, but AITER ships no FlyDSL configuration
    for them.'
  alternatives:
  - On gfx942, spend the search on what remains genuinely open — the tile geometry, split_k, B staging and
    the epilogue — rather than on the gated paths.
  - If a gated path is the real ceiling for your shape, vendor and port it deliberately as a structural change,
    and budget it as one.
  why:
  - 'Six gfx942 tests exist in the FlyDSL GEMM sources and they do different things: one switches the HGEMM
    fragment/DMA/MFMA bundle, one fixes HGEMM async copy library-wide, two shut the small-M family, one narrows
    the A8 async A-copy width and one selects the A8 gfx942 schedule.'
  - This is the cheapest knowledge on the page. A gate costs nothing to check and a whole round to discover,
    and none of it is visible from the tuning tables, which record what was selected on the architectures where
    the path was open.
  source_evidence:
  - aiter_a6bb4993:src_c4c19187bcb7933c
  - aiter_a6bb4993:src_a0f1066a6a2d6667
  - aiter_a6bb4993:src_e689c0cbe1b4f8e8
  - aiter_a6bb4993:src_7eee3f6769348b4c
  - aiter_a6bb4993:src_e04716b6d760605b
  - aiter_a6bb4993:src_42146c2d073d655e
  - aiter_a6bb4993:src_fbe3baca81526883
  shipped_evidence:
  - aiter_a6bb4993:sel_5aecc3631bf688e9
  - aiter_a6bb4993:sel_438e88e4bc86460c
  - aiter_a6bb4993:sel_f1384cc1069c9823
  references:
  - knowledge/general/hardware/cdna3_mi300/memory_hierarchy.md
  - knowledge/general/backend/flydsl/knobs.md:71-75
  - knowledge/general/backend/flydsl/kernel_families.md:19-32
  measurement_evidence: []
  limitations:
  - These are the gates that name an architecture literally. A path can also be effectively closed by something
    this card does not see — a missing dtype, an LDS budget, a compiler version.
  - 'Gates are per family: a gate in one family''s source says nothing about another family''s, which is exactly
    how the async-copy statement used to be over-read.'
  - Gates move between releases. Every citation carries its file and line; re-read them against the checkout
    you are building on before trusting the list.
  - That a path is open says nothing about whether it is fast.
- id: flydsl-hgemm-tiling-validity
  type: constraint
  axes:
  - configuration_constraints
  - workgroup_tile
  - pipeline_schedule
  - execution_geometry
  match:
    operator_families:
    - dense_gemm
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - f16
    - bf16
  question: Which FlyDSL HGEMM configurations will fail to build at all, before any of them can be slow?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - operator_family=gemm
  - target_language=flydsl
  - candidate configurations are being generated automatically or swept
  actions:
  - 'Filter candidates before compiling them: N must satisfy N >= tile_n and N % tile_n == 0, and K/split_k
    must satisfy K/split_k >= tile_k and (K/split_k) % tile_k == 0.'
  - Require tile_k >= 32 and tile_k % 32 == 0, tile_m % (block_m_warps*16) == 0 and tile_n % (block_n_warps*16)
    == 0.
  - Require each of tile_m*tile_k, tile_n*tile_k and tile_m*tile_n to be divisible by 8*64*block_m_warps*block_n_warps,
    the per-block vectorised load width.
  - 'Estimate LDS as a_lds = max(stages*tile_m*tile_k*2, tile_m*tile_n*2) when B is not staged through LDS;
    when it is, the estimate is not a_lds plus something, it becomes align_up(a_lds,16) + stages*tile_n*tile_k*2.
    Drop candidates over the block budget, which the library takes from `addressable_lds_bytes_for_gfx`: 163840
    bytes on gfx950 and 65536 on the other CDNA targets.'
  - 'Do not spend a round on stages, pack_n or c_to_lds in the generic family: the kernel compiles a fixed
    2-stage pipeline, pack_n=1 and c_to_lds off, and rejects anything else. They read like tuning knobs in
    the signature and are not.'
  - Do not combine b_preshuffle=True with b_to_lds=True; the kernel rejects it.
  - Check the split-K reduction counter capacity separately — see flydsl-splitk-reduction-contract.
  alternatives:
  - Let the compiler reject the configuration and catch the exception — acceptable only when the search is
    small, since each rejection still costs a compile.
  why:
  - AITER performs all of these checks in host code before the kernel is built, so they are the stated contract
    rather than an inference from a crash.
  - An optimizer that cannot separate 'illegal' from 'slow' spends its budget re-discovering the first, and
    a budgeted search has few rounds to spend.
  source_evidence:
  - aiter_a6bb4993:src_9ae627bec0096537
  - aiter_a6bb4993:src_d3f3cb90295b0c40
  - aiter_a6bb4993:src_5c7e74ddb8a071de
  - aiter_a6bb4993:src_7c7ddd401ff4aaeb
  - aiter_a6bb4993:src_c139f07a63569327
  - aiter_a6bb4993:src_539c4b7bf95dca07
  - aiter_a6bb4993:src_0f8216bb2c53105f
  - aiter_a6bb4993:src_4404f2040e4191a0
  - aiter_a6bb4993:src_d76e1615be7ab856
  - aiter_a6bb4993:src_cbd1aeb93c0eb00c
  - aiter_a6bb4993:src_c01de8a05cd112e2
  - aiter_a6bb4993:src_d0f75ad1bcdf6730
  - aiter_a6bb4993:src_e248a6669d5daaaf
  - aiter_a6bb4993:src_ce6c8804ca232bf6
  - aiter_a6bb4993:src_c694123000988e0b
  references:
  - knowledge/general/backend/flydsl/authoring_optimization.md:75-93
  - knowledge/general/backend/flydsl/knobs.md:20-40
  - knowledge/general/backend/flydsl/patterns.md:21-39
  measurement_evidence: []
  limitations:
  - The LDS formula is the library's own estimate for this kernel shape; a rewritten staging scheme changes
    it and the estimate stops applying.
  - Passing every check means the configuration builds, not that it is fast, and not that it is correct in
    a modified kernel.
- id: flydsl-half-mfma-call-forms
  type: performance_candidate
  axes:
  - compute_instruction
  - architecture_capability
  match:
    operator_families:
    - dense_gemm
    - grouped_gemm_moe
    - batched_gemm
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - f16
    - bf16
  question: Which legal MFMA call forms can seed a FlyDSL f16/bf16 GEMM?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - operator_family=gemm
  - target_language=flydsl
  - input_dtype in {f16,bf16}
  actions:
  - For an m16n16k16 candidate, pair bf16 with mfma_f32_16x16x16bf16_1k and f16 with mfma_f32_16x16x16f16.
  - 'Check the target architecture before treating the K shape as a free axis: the shipped split-K kernel does
    not let you pick it. On gfx942 it selects m16n16k16 with 4-byte DMA and two MFMA steps per warp-K; on every
    other architecture it selects m16n16k32 with 16-byte DMA and one. Benchmarking the K=32 form on gfx942
    means rewriting that branch, not passing a flag.'
  - Also benchmark the m16n16k32 bf16/f16 forms where the architecture branch does select them and the fragment
    shape and register budget allow.
  - 'Keep 16x16 fragments as the default shape and reach for 32x32 only when the tile needs it: a 16x16 accumulator
    block costs 4 VGPRs per lane, a 32x32 block 16, at the same nominal rate (background).'
  alternatives:
  - Use the m16n16k16 form when the larger-K fragment does not fit the surrounding tile or register budget.
  - Let a higher-level backend select the instruction when direct MFMA control is not required.
  why:
  - AITER's FlyDSL split-K GEMM implements both K=16 and K=32 classes and branches explicitly on bf16 versus
    f16.
  - 'The two classes are not offered side by side at runtime: one architecture test picks the WMMA implementation,
    the DMA width and the MFMA-per-warp-K count together, as one bundle.'
  - This establishes legal implementation precedents; it does not establish which form is faster for a new
    shape.
  source_evidence:
  - aiter_a6bb4993:src_24517333d1cd6722
  - aiter_a6bb4993:src_0ed3b5780c589479
  - aiter_a6bb4993:src_387e95ce58e0449b
  - aiter_a6bb4993:src_79cfb57473ed817f
  - aiter_a6bb4993:src_e689c0cbe1b4f8e8
  solutions:
  - backend: triton
    mechanism: '`tl.dot` over the tile; the compiler picks the MFMA, steered by `matrix_instr_nonkdim` in the
      shipped config'
    source_evidence:
    - aiter_a6bb4993:src_cb8f85060eec45f8
  - backend: gluon
    mechanism: an explicit MFMA layout with `instr_shape` (e.g. [16, 16, 32] or [32, 32, 16]) chosen per kernel
    source_evidence:
    - aiter_a6bb4993:src_cf70b9a5bae73954
    - aiter_a6bb4993:src_422867b3bf9dfa13
  - backend: ck
    mechanism: an XDL device-op template; the MFMA shape is a positional template argument the corpus does
      not decode
    source_evidence:
    - aiter_a6bb4993:src_780fadebcc954d06
  references:
  - knowledge/general/hardware/shared/matrix_core_mfma_smfmac.md
  - knowledge/general/hardware/cdna4_mi350/matrix_core_blockscale.md
  - knowledge/general/backend/flydsl/authoring_tile_programming.md:201-277
  - knowledge/general/backend/flydsl/authoring_tile_programming.md:503-518
  measurement_evidence: []
  limitations:
  - No latency or occupancy comparison is attached; treat both K shapes as candidates and re-measure.
  - API spelling is version-sensitive; consult languages/flydsl/version_map.md before copying.
- id: flydsl-async-copy-by-family
  type: performance_candidate
  axes:
  - memory_access
  - architecture_capability
  - pipeline_schedule
  - implementation_variant
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - grouped_gemm_moe
    - batched_gemm
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    requires:
    - lds_staging
  question: Is global-to-LDS async copy a knob, a fixed fact, or unavailable — per FlyDSL kernel family and
    architecture?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - an operand tile is staged through LDS
  actions:
  - 'Split-K HGEMM: not a knob. The flag is computed from the architecture (off on gfx942, on elsewhere) and
    a request that disagrees raises. Every FlyDSL bf16 selection AITER ships for gfx950 has async_copy on.'
  - 'A8 preshuffle (fp8/int8): a real knob on both architectures. The A tile is copied 4 bytes per lane on
    gfx942 and 16 bytes elsewhere, and the tuner sweeps async on and off in both catalogs.'
  - 'Search it per M bucket rather than fixing it: in AITER''s gfx950 fp8 selections, async copy is on in 17
    of 72 rows at M<=16 but in 39 of 50 at M 1025-4096 and 65 of 77 above 4096.'
  - 'When async copy is on, drop the ds_write group from any hand schedule: A lands in LDS without passing
    through VGPRs.'
  - 'For an authored kernel, size the copy to the hardware: direct global-to-LDS moves up to 32 bits per lane
    on CDNA3 and up to 128 bits on CDNA4 (background), which is why the gfx942 A8 path copies 4 bytes.'
  alternatives:
  - Synchronous global-to-register-to-LDS staging, which is the gfx942 HGEMM path and the async=0 arm of the
    A8 sweep.
  why:
  - The same word — async copy — names an architecture fact in one family and a searched knob in the other;
    reading one family's gate as the other's rule removes a live candidate.
  - The copy width is written in the A8 compile entry point, and the sweep values are module constants in its
    tune catalog.
  source_evidence:
  - aiter_a6bb4993:src_c4c19187bcb7933c
  - aiter_a6bb4993:src_a0f1066a6a2d6667
  - aiter_a6bb4993:src_8f59fe9a6d65aaf3
  - aiter_a6bb4993:src_14bff946c5d70663
  - aiter_a6bb4993:src_42146c2d073d655e
  - aiter_a6bb4993:src_623470961bcb8c24
  - aiter_a6bb4993:src_6dd333649bf42b12
  shipped_evidence:
  - aiter_a6bb4993:cfg_909edfc582fce0bd
  - aiter_a6bb4993:cfg_496162f129968cb9
  - aiter_a6bb4993:cfg_9636311ea3a3ce0d
  - aiter_a6bb4993:cfg_973fe63f897809df
  references:
  - knowledge/general/hardware/cdna3_mi300/memory_hierarchy.md
  - knowledge/general/hardware/cdna4_mi350/memory.md:51-55
  - knowledge/general/backend/flydsl/deep.md:65-73
  - knowledge/general/backend/flydsl/knobs.md:71-75
  - knowledge/general/backend/flydsl/authoring_gemm_levers.md:119-131
  - knowledge/general/backend/flydsl/authoring_tile_programming.md:396-426
  measurement_evidence: []
  limitations:
  - Selection shares show where AITER's tuner chose async copy, not by how much it helped.
  - The HGEMM rule is tied to the current kernel; an authored HGEMM can stage however the hardware allows.
- id: gemm-workgroup-xcd-mapping
  type: performance_candidate
  axes:
  - work_partition
  - memory_access
  - execution_geometry
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - grouped_gemm_moe
    - batched_gemm
    - splitk_streamk_gemm
    - gemm_epilogue_fused
    target_languages:
    - flydsl
  question: How should a FlyDSL GEMM map workgroup IDs onto output tiles and XCDs, and where does AITER already
    do it?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - 'a multi-XCD part (MI300X / MI355X: 8 XCDs, each with its own L2)'
  - the grid launches enough workgroups that their placement across XCDs matters
  actions:
  - 'Know the starting point: no workgroup remap was found in the dense FlyDSL HGEMM or A8 sources scanned
    here (only the grouped-GEMM kernel has one), so consecutive workgroups follow the hardware''s round-robin
    across XCDs and neighbours that share an A or B panel land on different L2s (background).'
  - 'Port the remap as a block-id permutation in the kernel prologue, the way the FlyDSL grouped-GEMM kernel
    does behind `xcd_swizzle`: with 8 XCDs, wgid = (linear_id % 8) * (num_wgs / 8) + linear_id / 8, then rasterise
    M in groups of `xcd_swizzle` rows before decoding the (m, n) tile.'
  - 'Or follow Triton''s shared helpers: `remap_xcd` / `remap_xcd_chunked` regroup program IDs per XCD, then
    `pid_grid(..., GROUP_SIZE_M)` walks M in groups so consecutive programs reuse one B panel.'
  - Keep the unmapped kernel as the control arm (`xcd_swizzle=0` is the grouped kernel's default), gate the
    remap by grid size, and prove every tile is still visited exactly once when the grid is not a multiple
    of the XCD count.
  alternatives:
  - No remap — the default dispatch order.
  - Grouped-M rasterisation alone (`GROUP_SIZE_M`) without an XCD remap.
  why:
  - Two implementations in AITER already solve this and state the formula in source; the dense FlyDSL kernels
    are the ones that do not.
  - Whether it pays depends on how much panel reuse crosses XCDs for the shape, which is why it is a candidate
    with a control arm and not a default.
  source_evidence:
  - aiter_a6bb4993:src_69a5695f3c33fd50
  - aiter_a6bb4993:src_3a83a99245462451
  - aiter_a6bb4993:src_923af36a5869aea6
  solutions:
  - backend: triton
    mechanism: '`remap_xcd` / `remap_xcd_chunked` plus `pid_grid` with `GROUP_SIZE_M` in the shared pid helper,
      called from the GEMM kernels with `NUM_XCDS`'
    source_evidence:
    - aiter_a6bb4993:src_1b8ded5e4825e5e1
    - aiter_a6bb4993:src_a0815635126a1ea6
    - aiter_a6bb4993:src_d760ac9f0e4bff02
    - aiter_a6bb4993:src_334e95f3f9406108
    - aiter_a6bb4993:src_de6d336c2ee7601b
  references:
  - knowledge/general/optimization/xcd_l2_locality.md:36-49
  - knowledge/general/hardware/shared/l2_xcd_swizzle.md
  measurement_evidence: []
  limitations:
  - The grouped kernel's tile decode after the remap is MoE-specific; the remap ports, the decode has to be
    rewritten for a dense grid.
  - Measured effects of XCD remapping live in learned cards and expert skills behind their switches; this card
    carries none.
- id: flydsl-hgemm-config-space
  type: performance_candidate
  axes:
  - workgroup_tile
  - work_partition
  - execution_geometry
  - tunable_surface
  match:
    operator_families:
    - dense_gemm
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - f16
    - bf16
  question: Which tile, warp and split-K values will the FlyDSL HGEMM family actually accept, and how does
    a shape narrow them?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - operator_family=gemm
  - target_language=flydsl
  - a configuration is being chosen or searched for a known M, N, K
  actions:
  - Search tile_m within (16, 32, 48, 64, 80, 96, 112, 128, 160, 256), tile_n within (64, 128, 160, 192, 256)
    and tile_k within (64, 96, 128, 160, 256) rather than treating the 128x128x64 default as the space.
  - 'Search the warp layout and B staging as one knob: the registry enumerates exactly five (block_m_warps,
    block_n_warps, b_to_lds) variants — (1,2,F), (1,4,F), (2,2,F), (1,4,T), (2,2,T).'
  - 'Cap tile_m at max(96, align_up(2*M, 16)): a tile_m far above M pays for rows that do not exist, and the
    shipped derivation refuses those candidates outright.'
  - Take split_k from 1..32, keeping only values that divide K and leave K/split_k divisible by tile_k; every
    candidate must clear that filter, including 1, 2, 4, 8 and 16. Those five need nothing further; any other
    divisor also has to leave between 2 and 8 block-K loops per split.
  - 'Whether split_k > 1 is worth generating at all is the grid-fill decision in gemm-split-k-when-grid-underfills:
    the derivation here checks divisibility, never occupancy.'
  - 'Seed from what AITER shipped for your bucket before sweeping (FlyDSL tuned-DB table below): on gfx950
    bf16 every shipped FlyDSL selection used either (2,2,b_to_lds=True) or (1,4,b_to_lds=False); the M<=64
    buckets are dominated by tile_m=32 with split_k 4-16; every bucket above M=256 uses split_k=1, and M 257-1024
    favours the non-power-of-two tile_m=96.'
  alternatives:
  - Keep the library default 128x128x64 with split_k=1 as the control arm to measure against.
  - Fix the tile and search only split_k when N or K constrain the tiling to one legal shape.
  why:
  - AITER states the space as module-level option tuples and two derivation helpers, not as one default; the
    default is one point inside it.
  - The derivations encode the shape-dependence directly — tile_m is bounded by M, and split_k by the divisibility
    of K — so the narrowing rule is readable rather than guessed.
  - This card says which candidates are legal and worth generating. It does not say which one wins; that is
    what the benchmark is for.
  source_evidence:
  - aiter_a6bb4993:src_426b8960fb14a04f
  - aiter_a6bb4993:src_62ce0ec6b152ecaa
  - aiter_a6bb4993:src_3c72689d786ca8be
  - aiter_a6bb4993:src_fce6be7eb6b247d6
  - aiter_a6bb4993:src_96320a5bab17a8f5
  - aiter_a6bb4993:src_562e9940a52a202f
  - aiter_a6bb4993:src_642476c9b693d5f1
  - aiter_a6bb4993:src_27d99a67a1d27ccc
  shipped_evidence:
  - aiter_a6bb4993:cfg_973fe63f897809df
  - aiter_a6bb4993:cfg_ac0c03746ab634f6
  - aiter_a6bb4993:cfg_147eed9b10acbc4e
  - aiter_a6bb4993:cfg_ae017b25b6473300
  references:
  - knowledge/operator/splitk_streamk_gemm/tuning.md:16-19
  - knowledge/general/backend/flydsl/knobs.md:42-50
  - knowledge/general/backend/flydsl/authoring_gemm_levers.md:103-117
  - knowledge/general/optimization/occupancy_and_registers.md:54-67
  measurement_evidence: []
  limitations:
  - These are the values the library is willing to compile, not values anybody measured as best; every candidate
    still has to be timed on the target box.
  - Shipped selections come from AITER's tuner on its own box and competing set; they seed a search, they do
    not end one.
  - The option tuples are the generic HGEMM family's. The small-M family has its own, wider, N space — see
