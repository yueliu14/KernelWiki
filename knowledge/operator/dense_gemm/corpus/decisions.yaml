  question: Which lane holds which row and column of a 16x16 MFMA fragment in AITER's FlyDSL kernels, and what
    does that fix for loads, in-register scaling and stores?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - a kernel loads MFMA fragments, scales an accumulator per row or per column, or writes it back
  actions:
  - 'Load fragments by lane: in the HGEMM, lane l reads A row `l % 16` at K offset `(l // 16) * frag_values
    * mfma_steps` (`ldmatrix_a_m_idx`, `ldmatrix_a_k_vec_idx`), and B mirrors it along N (`ldmatrix_b_n_idx`,
    `ldmatrix_b_k_vec_idx`).'
  - 'Read the accumulator as lane l holding four consecutive rows starting at `(l // 16) * 4`, in column `l
    % 16`: the row epilogue''s row offset is `lane_div_16 * 4 + ii` for ii in 0..3, the HGEMM store uses `stmatrix_c_m_vec_idx
    = w_tid // WMMA_N * WMMA_C_FRAG_VALUES` and `stmatrix_c_n_idx = w_tid % WMMA_N`, and the A8 kernels name
    the same 4x16 lane grid `make_layout((4, 16), (16, 1))`.'
  - 'Scale in registers with that mapping: a lane multiplies its four rows by their row scales and its one
    column by that column''s scale — the in-loop block-scale multiply (gemm-blockscale-k-loop-scale-application)
    and a per-token epilogue both need it.'
  - 'Derive loads, scales and stores from one mapping: a transposed reading on any side permutes the output
    without failing to compile.'
  alternatives:
  - Stage the accumulator through LDS with a C-shuffle epilogue (flydsl-cshuffle-epilogue) and index it row-major
    there, paying LDS for a simpler mapping.
  why:
  - Every FlyDSL GEMM in AITER writes this mapping as index arithmetic, so it can be read off the source instead
    of being rediscovered by debugging a permuted result.
  source_evidence:
  - aiter_a6bb4993:src_f01ef3793a7bd87c
  - aiter_a6bb4993:src_7e41979f22eae1f9
  - aiter_a6bb4993:src_44f9bf23c53fc7bc
