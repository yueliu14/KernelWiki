    (the block-scale launcher also requires tile_n to divide N), and every split from 1 to 16 it supports,
    count the rounds `ceil(ceil(M/tile_m) * ceil(N/tile_n) * split / num_cu)`; keep the fewest rounds, and
    among equal rounds the one with fewer idle CUs in the last round or the larger `tile_m * tile_n / (tile_m
