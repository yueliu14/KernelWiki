  - knowledge/general/backend/flydsl/authoring_tile_programming.md:201-277
  measurement_evidence: []
  limitations:
  - The mapping is for the 16x16 MFMA atom these kernels use; a 32x32 instruction has a different lane layout.
  - K per lane depends on the instruction (four bf16 or eight fp8 elements per lane for the 16x16 forms), which
    the frag-value constants carry.
- id: flydsl-host-launch-contract
  type: constraint
  axes:
  - runtime_contract
  - work_partition
  - implementation_variant
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - grouped_gemm_moe
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
    - flydsl
  question: What does the host side of a FlyDSL GEMM have to provide in AITER — compile cache, launch grid,
    per-stream state and kernel name?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - a FlyDSL kernel is being launched, cached or registered for dispatch
  actions:
  - 'Compile once per configuration and cache it: AITER''s HGEMM, small-M, A8 preshuffle and 2-stage MoE compilers
    are `@functools.lru_cache(maxsize=1024)` (the mixed-precision MoE ones unbounded), keyed on the full configuration,
    so every new tile or split is a new compile — warm up before timing.'
  - 'Make the launch grid match what the kernel reads: the HGEMM and small-M launch `grid=(bm, bn, SPLIT_K)`
    — block x is the M tile, y the N tile, z the K split — while the A8 GEMM launches `(gx, gy, 1)`. A kernel
    that reads `block_idx.z` as its split needs the host to launch that z.'
  - 'Supply split-K''s per-stream state: the counter buffer and the current signal state go into every split-K
    launch and the state advances after it (flydsl-splitk-reduction-contract).'
  - 'Name the kernel in the registry''s grammar: tuned rows encode every knob in the kernel name matched by
    `_HGEMM_KERNEL_RE`, and `tuned_gemm` drops a `flydsl` row whose name does not parse.'
  - Check every FlyDSL symbol against the installed version before copying code across versions (version_map);
    a module that moved fails at import, not at compile.
  alternatives:
  - Call the library entry points (`flydsl_hgemm`, `flydsl_preshuffle_gemm_a8`), which own this contract, instead
    of launching an authored kernel directly.
  why:
  - Each of these is a failure that surfaces only at run time — a recompile per call, a grid that leaves splits
    unlaunched, counters that were never allocated, a tuned row silently dropped.
  source_evidence:
  - aiter_a6bb4993:src_4d28023c79d1fe52
  - aiter_a6bb4993:src_1e5ae08be5adf756
  - aiter_a6bb4993:src_ca495db46be070cd
  - aiter_a6bb4993:src_ada62c940d6fc161
  - aiter_a6bb4993:src_821a059af3542249
  - aiter_a6bb4993:src_569b9cec48bd2103
  - aiter_a6bb4993:src_328a63de09b9204a
  - aiter_a6bb4993:src_1e7dc0218412b0cf
  - aiter_a6bb4993:src_c9b676e9661f7f1e
  - aiter_a6bb4993:src_86aa6d1400d0f17f
  - aiter_a6bb4993:src_194c17aa69828857
  references:
  - knowledge/general/backend/flydsl/deep.md:116-122
  - knowledge/general/backend/flydsl/version_map.md:279-316
  - knowledge/general/backend/flydsl/patterns.md:104-108
  measurement_evidence: []
  limitations:
  - This is AITER's host contract at the pinned commit; an authored kernel launched outside AITER's wrappers
    must provide the same pieces itself.
- id: flydsl-test-parity-gate
  type: constraint
  axes:
  - validation_contract
  - work_partition
  - epilogue
  match:
    operator_families:
    - dense_gemm
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
    - flydsl
  question: Which parity does AITER's own FlyDSL GEMM test demand, where does it relax it, and what does that
    say about validating an authored kernel?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - a FlyDSL GEMM — especially a split-K one — is being validated against a reference
  actions:
  - 'Gate against an fp32 reference first: AITER''s split-K HGEMM test compares with `torch.isclose` at atol
    = rtol = 1e-2 and requires 99.9% of elements close.'
  - 'Relax only where the implementation had to: AITER''s split-K precision cases at split_k 8 (M=104, K=7168)
    and split_k 4 (M=1, K=512) hold the default gate; only its two M=1 `b_to_lds` cases are relaxed, to 99.0%
    of elements with max |delta| <= 32 at split_k 16 (K=7168) and <= 8 at split_k 8 (K=1536). The drift comes
    from the atomic combine of partials already rounded to bf16 (flydsl-splitk-reduction-contract).'
  - Let the task's oracle and tolerance decide acceptance (the workflow's verify step); use AITER's gate to
    judge a failure — drift within it is the known cost of split-K, drift beyond it points at a bug.
  alternatives:
  - Split-K with an fp32 workspace and a separate reduce pass (the Triton pattern), which keeps the combine
    in fp32 at the cost of a second kernel.
  why:
  - The relaxed cases are the implementation stating where its numerics drift; without them a correct split-K
    kernel reads as broken, or a broken one as merely imprecise.
  source_evidence:
  - aiter_a6bb4993:src_9d1d40ad1d82f015
  - aiter_a6bb4993:src_f0baf9a97c14b111
  - aiter_a6bb4993:src_1183d7ed5d869e8a
  - aiter_a6bb4993:src_217562a4a9b879dc
  - aiter_a6bb4993:src_636fbc44252bb90e
  - aiter_a6bb4993:src_972b88aa5143a3f7
  - aiter_a6bb4993:src_f30b29895e6d16b2
  - aiter_a6bb4993:src_724636e4ecf6c5f6
  - aiter_a6bb4993:src_dcea4e10d8996a4e
  references:
  - knowledge/operator/splitk_streamk_gemm/backend/flydsl.md:77-85
  - knowledge/operator/dense_gemm/numerics.md:59-63
  measurement_evidence: []
  limitations:
  - These are AITER's regression cases for its own kernel; an authored kernel is judged by the task's oracle,
    not by this test.
- id: gemm-streamed-operand-cache-policy
  type: performance_candidate
  axes:
  - memory_access
  - tunable_surface
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - grouped_gemm_moe
    - batched_gemm
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
    - flydsl
  question: Which operand loads and output stores should carry a streaming (non-temporal) cache policy, and
    which should keep the default?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - one operand is read once per call while the other is reused across tiles — typically the weight B at decode,
    where every workgroup streams its own slice of W while the few rows of A are shared — or an output is written
    once and not read back by this kernel
  actions:
  - 'Make the cache policy a per-operand knob on the global loads, not a kernel-wide switch: FlyDSL''s `buffer_ops.buffer_load`
    takes `cache_modifier`, and AITER''s FlyDSL MoE GEMM exposes it for its B loads only, as `b_nt` (default
    0 in one of its kernels and 2 in the other), while its other loads pass `cache_modifier=0`.'
  - Search the streamed operand's load policy — the default against the streaming setting — and leave the reused
    operand's loads at the default.
  - 'Store a write-once output non-temporally when nothing re-reads it soon: the FlyDSL MoE kernel writes its
    output with `llvm.StoreOp(..., nontemporal=True)`.'
  alternatives:
  - The default cache policy everywhere — the control arm.
  why:
  - 'AITER''s Triton a16w16 GEMM makes the same choice per operand: `cache_modifier` is a kernel parameter
    applied to the B loads only, never to A. Of the 306 shipped Triton GEMM config groups, 88 set it, and 87
    of those choose `.cg`.'
  - A line fetched once and never re-read only displaces lines that would have been reused; the reused operand
    is the one worth keeping resident.
  source_evidence:
  - aiter_a6bb4993:src_6a42df54a6f6b458
  - aiter_a6bb4993:src_e93e7dd39f7adedc
  - aiter_a6bb4993:src_106bcf16a01dfc38
  - aiter_a6bb4993:src_e59fe6013e3decd4
  solutions:
  - backend: triton
    mechanism: '`cache_modifier: tl.constexpr` on the a16w16 kernels, passed to `tl.load(b_ptrs, cache_modifier=...)`
      for B and never for A; the value is carried per bucket in the shipped configs'
    source_evidence:
    - aiter_a6bb4993:src_15cea189ebb33d4c
    - aiter_a6bb4993:src_92959715207084c1
    - aiter_a6bb4993:src_9667faa67584ba59
  references:
  - knowledge/general/hardware/shared/hbm_infinity_fabric.md:73-73
  - knowledge/general/hardware/cdna3_mi300/memory_hierarchy.md:48-48
  measurement_evidence: []
  limitations:
  - The spelling differs per backend — a Triton modifier string, a FlyDSL integer `cache_modifier`, an LLVM
    `nontemporal` store flag — and the corpus does not map one onto another; read what the target API accepts.
  - 'Whether streaming helps depends on the reuse the benchmark reproduces: a timing loop that re-reads the
    same weight from a warm cache measures a different reuse than serving, where each layer reads its own weight.'
- id: flydsl-lds-pipeline-depth
  type: performance_candidate
  axes:
  - pipeline_schedule
  - configuration_constraints
  - workgroup_tile
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - splitk_streamk_gemm
    - skinny_gemv_decode
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    requires:
    - lds_staging
  question: How many LDS stages should the K loop keep in flight, and what does each one cost?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - the design stages operand tiles through LDS (trait lds_staging)
  actions:
  - 'Treat the stage count as a knob that competes with the tile for LDS: the split-K HGEMM allocates `STAGES
    * BLOCK_M * BLOCK_K` elements for A and `STAGES * BLOCK_N * BLOCK_K` for B, so every extra stage costs
    one more A tile and one more B tile.'
  - Start from AITER's two stages — `STAGES = 2` in the split-K and small-M HGEMMs, `lds_stage=2` as the preshuffle
    GEMM's default — and try a deeper ring only where the tile is small enough for the LDS budget and the tiling
    validator to accept it.
  - Keep the stage count in the kernel name, as AITER does (`_S{STAGES}`, `_lds{lds_stage}`), so two builds
    that differ only in depth never share a compiled-kernel cache entry.
  alternatives:
  - 'More workgroups per CU instead of more stages: the same LDS spent on occupancy hides latency across workgroups
    rather than within one.'
  why:
  - A stage is how far the loader runs ahead of the MFMAs, and it is bought with LDS that the tile, occupancy
    and any LDS-staged epilogue also want.
  - 'AITER fixes two stages in the HGEMMs and exposes the depth only on the preshuffle GEMM, where it also
    restricts it (FP4 with tile_k=128 supports only lds_stage=2): the depth is a design axis, not a constant.'
  source_evidence:
  - aiter_a6bb4993:src_dbdbdbf21af30e3c
  - aiter_a6bb4993:src_8a036c537a13ff24
  - aiter_a6bb4993:src_1a80adca750d9118
  references:
  - knowledge/general/optimization/lds_and_bank_conflicts.md:56-60
  - knowledge/general/optimization/lds_and_bank_conflicts.md:95-97
  - knowledge/operator/skinny_gemv_decode/backend/flydsl.md:59-59
  measurement_evidence: []
  limitations:
  - The HGEMM families hard-code two stages; a different depth there means changing the kernel source, not
    passing a parameter.
  - 'Deeper is not monotonically better: once global latency is hidden, further stages only take LDS away from
    occupancy.'
