- id: moe-two-stage-intermediate
  type: semantic
  axes:
  - expert_compute
  - numerical_contract
  - expert_layout
  match:
    operator_families:
    - grouped_gemm_moe
    - fused_moe_grouped_gemm
    target_languages:
    - flydsl
    - triton
  question: What must match at the gate/up to down-projection boundary?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions:
  - MoE execution uses two expert GEMMs with an activation or gate between them.
  actions:
  - Preserve gate/up ordering, the exact activation and any clipping before the down projection.
  - Match the intermediate dtype, quantization scale layout and sorted-route ownership across both stages.
  - Choose stage-1 split/tiling and stage-2 consumption together; a fast stage-1 output is unusable if stage
    2 interprets it differently.
  - Consider the complete expert call and its metadata preparation when sizing a fusion or rewrite; preserve
    routed weights, activation order, layouts and intermediate lifetimes.
  - Check reduction order and deterministic-output requirements when adding split-K or moving work between
    stages.
  alternatives:
  - Keep the intermediate in a simple floating format before introducing compressed partials.
  why:
  - The FlyDSL family has distinct gate/up and down builders, including separate dequantization and scale helpers.
  source_evidence:
  - aiter_b3ad6c46:src_716da92976cf21bc
  - aiter_b3ad6c46:src_fd19baacbd3c48ef
  measurement_evidence: []
  limitations:
  - These FP8 family precedents do not establish arbitrary MXFP4 or mixed-expert-weight compatibility.
  - A dense-GEMM replacement may not match a fused expert callable. Combined serving improvements cannot be
    attributed to either GEMM without ablations.
  references:
  - knowledge/operator/grouped_gemm_moe/README.md
  - knowledge/operator/fused_moe_grouped_gemm/README.md
  - knowledge/operator/dense_gemm/README.md
  solutions:
  - backend: triton
    mechanism: The grouped GEMM exposes activation and quantization parameters in its own kernel contract.
    source_evidence:
    - aiter_b3ad6c46:src_51116808a6bd2b48
  experience:
  - outcome: mixed
    conditions:
    - A reported expert path included routing-metadata and intermediate-processing dispatches around two GEMM
      stages.
    summary: Historical MoE reports found metadata/auxiliary-dispatch removal useful after tuning the GEMMs,
      while a fast order-changing rewrite failed serving parity.
    provenance:
      kind: historical_summary
      references:
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/e2e_workflow/knowledge/learned/moe-mxfp4-grouped-authored-gfx950-vllm.md
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/kernel_workflow/knowledge/learned/axes-that-stayed-closed-on-a-bf16-fused-moe-with-a-decode-we-moe-grouped-gemm-gfx950-both.md
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/kernel_workflow/knowledge/learned/delete-the-satellite-dispatches-once-both-moe-gemms-sit-at-t-moe-grouped-gemm-gfx950-both.md
      artifacts: not_published
      verification: not_reproduced
- id: moe-live-config-and-scale-domain
  type: performance_candidate
  axes:
  - runtime_contract
  - configuration_constraints
  match:
    operator_families:
    - grouped_gemm_moe
    target_languages:
    - triton
    - gluon
    - flydsl
    - hip
    - ck
    - asm
    - tilelang
  question: Which tuning surface controls the served expert GEMM contract?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id001
  - Expert GEMMs use a framework- and version-specific combination of dtype, quantization, layout, topology
    and dispatch keys.
  actions:
  - Derive per-rank expert/intermediate dimensions from the actual TP/EP configuration and capture the exact
    selector key and served token buckets.
  - Tune each valid bucket with matched baseline initialization and warmup, preserving defaults for unserved
    or regressing cases.
  - Inspect override-versus-merge semantics at the installed revision; keep native per-32 E8M0, arbitrary blockscale
    and W4A16 paths distinct.
  why:
  - Historical MoE reports found useful configuration tuning and native-kernel rewrites on different paths,
    plus zero engagement when a dense or incompatible quantization selector was targeted.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - A single-process versus subprocess timing disagreement needs controlled cache/warmup analysis; neither
    protocol is automatically more trustworthy. Tile-only changes still require correctness checks.
  references:
  - knowledge/operator/grouped_gemm_moe/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
    conditions: *id001
    summary: Historical MoE reports found useful configuration tuning and native-kernel rewrites on different
      paths, plus zero engagement when a dense or incompatible quantization selector was targeted.
    provenance:
      kind: historical_summary
      references:
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/e2e_workflow/knowledge/learned/moe-bf16-tune-gfx942.md
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/e2e_workflow/knowledge/learned/moe-fp8-blockscale-tune-gfx950.md
