  question: How should MFMA shape and pipeline instance be chosen for each MoE stage?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id002
  - The selected CK or similar grouped-GEMM instance has a matching weight shuffle and expert-sort granularity.
  actions:
  - Tune gate/up and down projection using their own N extents; update host preshuffle and device instance
    together.
  - Keep tile ownership within the sorted expert block contract and validate any new padding or CShuffle layout.
  - Measure stage-level and full-call results, including changed register/LDS residency.
  why:
  - Historical blockscale reports found stage-specific MFMA/pipeline changes useful, but reusing an incompatible
    shuffle or letting a tile span expert groups broke correctness.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - MFMA-32 is a scoped candidate, not a replacement for MFMA-16 everywhere. A stage selector may constrain
    which tile combinations are expressible.
  references:
  - knowledge/operator/grouped_gemm_moe/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
    conditions: *id002
    summary: Historical blockscale reports found stage-specific MFMA/pipeline changes useful, but reusing an
      incompatible shuffle or letting a tile span expert groups broke correctness.
    provenance:
