- id: moe-per-bucket-binary-and-config
  type: performance_candidate
  axes:
  - runtime_contract
  - tunable_surface
  match:
    operator_families:
    - grouped_gemm_moe
    target_languages:
    - triton
    - gluon
    - flydsl
    - hip
    - ck
    - asm
    - tilelang
  question: When should expert token buckets use separate configurations or compiled entries?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id004
  - Different token/width regimes have distinct compiler resource footprints and valid launch configurations.
  actions:
  - Select configurations by runtime shape with a complete fallback; isolate compiled entries when a shared
    binary forces the narrow path to carry the wide path resource budget.
  - Keep every host/device-coupled layout or threshold consistent and distinguish compile-time availability
    from per-call selection.
  - Re-tune coupled launch parameters per arm and test boundary buckets and the final combined dispatch.
  why:
  - Historical reports found per-bucket routing useful where global settings canceled opposing gains; separate
    entries could reduce register or code-size costs.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - A startup-only preshuffle is not a freely changeable per-call knob. Do not encode benchmark case identities
    or depend on fixed input pointers.
  references:
  - knowledge/operator/grouped_gemm_moe/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
    conditions: *id004
    summary: Historical reports found per-bucket routing useful where global settings canceled opposing gains;
      separate entries could reduce register or code-size costs.
    provenance:
      kind: historical_summary
      references:
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/kernel_workflow/knowledge/learned/one-binary-per-shape-arm-selected-by-a-host-launcher-shim-moe-grouped-gemm-gfx950-prefill.md
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/kernel_workflow/knowledge/learned/per-m-bucket-launch-config-on-an-int4-weight-only-grouped-ge-moe-grouped-gemm-gfx950-compute-bound.md
