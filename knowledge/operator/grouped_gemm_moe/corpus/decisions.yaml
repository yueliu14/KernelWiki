  question: When can padding an expert epilogue staging tile reduce its critical-path conflicts?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id006
  - An LDS staging layout exhibits conflicts for the actual target bank geometry and access pattern.
  actions:
  - Change row stride and allocated group-segment size together, preserving the read/write mapping and vector
    alignment.
  - Validate full output coverage and measure end-to-end stage latency after the conflict counter changes.
  why:
  - A historical epilogue-pad change helped, but incomplete allocation updates broke correctness and further
    counter reductions brought little additional latency benefit.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Do not transplant a fixed bank count or padding value to another architecture or access width.
  references:
  - knowledge/operator/grouped_gemm_moe/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
