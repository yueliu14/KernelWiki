      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/e2e_workflow/knowledge/learned/moe-mxfp4-fused-aiter-fmoe-gfx950-sglang.md
