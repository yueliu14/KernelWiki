- id: moe-precision-and-scale-gates
  type: performance_candidate
  axes:
  - numerical_contract
  - expert_layout
  match:
    operator_families:
    - grouped_gemm_moe
    target_languages:
    - triton
    - gluon
    - flydsl
    - hip
    - ck
    - asm
    - tilelang
  question: When does narrowing expert operands remain valid and deployable?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id005
  - An explicitly permitted precision change targets streamed operand traffic or dequantization cost.
  actions:
  - Validate scale-group indexing, quantizer range, rounding and the complete expert output before comparing
    performance.
  - Use the actual SNR/error/task-accuracy gate; a cosine-only success does not transfer to a stricter cancellation-sensitive
    contract.
  - Include preparation cost and extra persistent weight storage in both the timing boundary and the serving
    memory budget.
  why:
  - Historical reports contained both useful narrow-weight representations and failed numeric or memory gates;
    the accepted scale contract determined which transformations were available.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Distinct per-K-group scales cannot be replaced by an average. Do not reuse data-dependent quantization
    solely because pointer addresses remain stable.
  references:
  - knowledge/operator/grouped_gemm_moe/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
    conditions: *id005
    summary: Historical reports contained both useful narrow-weight representations and failed numeric or memory
      gates; the accepted scale contract determined which transformations were available.
    provenance:
      kind: historical_summary
      references:
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/kernel_workflow/knowledge/learned/activation-narrowing-is-gated-by-parity-and-by-the-benchmark-moe-grouped-gemm-gfx950-mixed.md
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/kernel_workflow/knowledge/learned/derive-the-tile-then-renegotiate-the-scale-contract-moe-grouped-gemm-gfx950-prefill.md
