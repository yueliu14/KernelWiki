- id: moe-dequant-reuse-and-chain
  type: performance_candidate
  axes:
  - expert_compute
  - operand_layout
  - pipeline_schedule
  match:
    operator_families:
    - grouped_gemm_moe
    target_languages:
    - triton
    - gluon
    - flydsl
    - hip
    - ck
    - asm
    - tilelang
  question: Can expert-weight dequantization be reused or shortened on the critical path?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions: &id003
  - Packed expert weights or scale metadata are converted repeatedly while feeding grouped GEMM.
  actions:
  - Load a packed value once when extracting multiple components; consider reusing a dequantized weight tile
    across M blocks only when expert and scale ownership match.
  - 'Distinguish widening the number of dot tiles from widening each tile: compiler warp-layout changes can
    duplicate the very work being removed.'
  - Inspect scale gathers and dependent conversion chains, then re-tune tile grouping within register/LDS budgets.
  why:
  - Historical reports found useful packed extraction, shared dequantized tiles and shorter scale/convert chains;
    nominal instruction savings could be off the critical path or disappear after retiling.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - Preserve group-scale application and cancellation-sensitive arithmetic. Extra dequantized weight copies
    must be included in deployment memory accounting.
  references:
  - knowledge/operator/grouped_gemm_moe/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
    conditions: *id003
    summary: Historical reports found useful packed extraction, shared dequantized tiles and shorter scale/convert
      chains; nominal instruction savings could be off the critical path or disappear after retiling.
    provenance:
      kind: historical_summary
      references:
