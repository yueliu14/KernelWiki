- id: attention-gated-delta-state-contract
  type: constraint
  axes:
  - recurrent_state
  - implementation_contract
  match:
    operator_families:
    - linear_attention_gated_delta
    target_languages:
    - flydsl
    - gluon
  question: What state and index contracts distinguish gated-delta decode from softmax attention?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: reviewed
    checked_at: '2026-11-05T02:17:37.107586+00:00'
    summary: Reviewed the linked PR changes, body and discussion for the specified implementation and conditions.
      Historical source incorporation is distinguished from measured effects; other backends and later versions
      are outside this scoped association.
  conditions:
  - The workload executes the recurrent gated-delta decode path.
  actions:
  - Preserve the distinction between read_indices and write_indices; both default to indices but may designate
    different state slots.
  - Respect the state alignment, dtype and Q/K last-dimension stride checks; use need_shuffle_state only with
    its corresponding layout conversion.
  - Validate the updated recurrent state as well as the visible output, including multi-step execution and
    state-slot reuse.
  alternatives:
  - Use the unfused recurrent state update as a correctness reference; evaluate prefill/chunk implementations
    separately.
  why:
  - flydsl_gdr_decode explicitly validates index dtypes and state layout before selecting its tiling and launching
    the recurrent update.
  source_evidence:
  - aiter_b3ad6c46:src_c67a55e3e97ebe90
  measurement_evidence: []
  limitations:
  - Softmax KV-split reduction is not an implementation of this recurrence.
  - A one-step output match does not verify the next token's state.
  references:
  - knowledge/operator/linear_attention_gated_delta/README.md
  experience:
  - outcome: mixed
    conditions:
    - 'Scope is the MTP extension: preserve rollback, slot-zero conventions, parent snapshots, state dtype,
      output layout and stream device; opt-in routing falls back to Triton during graph capture.'
    summary: 'PR #4907 extends GDN state updates to MTP chains and draft trees. Kernel aggregates, the early
      synchronization regression and the later public-entry improvement have separate evidence.'
    provenance:
      kind: upstream_report
      references: []
      artifacts: not_published
      verification: not_reproduced
    upstream:
      pr: aiter_pr_4907
      change_refs:
      - mtp_api
      - state_modes
      result_refs:
      - gfx950_mtp_aggregate
      - gfx942_mtp_aggregate
      - early_public_sync_regression
      - public_metadata_fix
      assessment:
        association:
          level: high
          reasons:
          - The reviewed commit incorporates or changes the named construct in the cited implementation; the
            assessment is limited to this backend and historical version.
          missing_evidence: []
        attribution:
          scope: bundle
          confidence:
            level: low
            reasons:
            - The report concerns the implementation or correctness change as a whole; it does not isolate
              the contribution of this individual direction.
            missing_evidence:
            - isolated_comparison
          isolation_source_refs: []
        applies_to:
          axes:
          - recurrent_state
          - implementation_contract
          backend: flydsl
- id: gated-delta-prefill-state-and-snapshots
  type: constraint
  axes:
  - recurrent_state
  - implementation_contract
  match:
    operator_families:
    - linear_attention_gated_delta
    target_languages:
    - flydsl
  question: How are persistent states and per-chunk snapshots distinguished in gated-delta prefill?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: blocked
    checked_at: '2026-11-05T02:26:25.564445+00:00'
    summary: 'Examined the pinned source-file history; candidate PRs #2854, #4732 remain to be checked against
      the exact construct and their reported results. Complete PR metadata/body/discussion captures are unavailable
      in this pass after GitHub API rate limiting. A file origin or title is only a candidate, not an accepted
      association; PR effect confidence remains unknown.'
  conditions:
  - The selected implementation matches the cited path and its input contract.
  actions:
  - Keep persistent state_dtype separate from snapshot_dtype, which controls the per-chunk h snapshots.
  - When initial_state_indices is provided, supply a state pool and enable in-place final-state write-back
    with output_final_state=True.
  - Preserve the public [...,V,K] state layout and contiguous K/W/U inputs; reuse valid host metadata for varlen
    chunk scheduling.
  alternatives:
  - Keep a simpler implementation with the identical numerical and layout contract for comparison.
  why:
  - The cited source declares these operations and checks; the combination is part of its interface.
  source_evidence:
  - aiter_b3ad6c46:src_fa1931cd4a8e61ea
  measurement_evidence: []
  limitations:
  - Changing snapshot precision can change resource use and numerical behavior independently of persistent-state
    precision.
  - Prefill state semantics cannot be inferred from the decode output shape alone.
  references:
  - knowledge/operator/linear_attention_gated_delta/README.md
