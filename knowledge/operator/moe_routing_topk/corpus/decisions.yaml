          - implementation_contract
          backend: flydsl
- id: moe-sort-padding-sentinels
  type: constraint
  axes:
  - expert_layout
  - implementation_contract
  match:
    operator_families:
    - moe_routing_topk
    - grouped_gemm_moe
    - fused_moe_grouped_gemm
