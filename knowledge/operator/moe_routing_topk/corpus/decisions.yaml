- id: moe-herd-routing-profile
  type: constraint
  axes:
  - routing_semantics
  - implementation_contract
  match:
    operator_families:
    - moe_routing_topk
    target_languages:
    - flydsl
  question: When is the specialized HERD routing path a valid candidate?
  evidence_level: source_observed
  status: candidate_only
  upstream_review:
    status: reviewed
    checked_at: '2026-11-04T16:56:44.784904+00:00'
    summary: Reviewed the linked PR changes, body and discussion for the specified implementation/conditions.
      This is a scoped historical association, not a complete review of every backend or version.
  conditions:
  - A candidate intends to reuse the FlyDSL HERD sigmoid routing implementation.
  actions:
  - Check the source's supported (score_func, experts, topk) profile instead of treating HERD as a generic
    top-k replacement.
  - Preserve correction-bias scoring, candidate generation, final weight normalization and routed_scaling_factor
    as distinct parts of the contract.
  - Honor the token-count, contiguous expert-column, output dtype/device and wave64 checks in _unsupported_reason.
  alternatives:
  - Use the existing general routing implementation for unmatched profiles.
  why:
  - The orchestration separates sigmoid-bias candidate selection from finalize, and publishes explicit narrow
    supported profiles.
  source_evidence:
  - aiter_b3ad6c46:src_07127917d294dfe9
  - aiter_b3ad6c46:src_938ee9ec013bdbd5
  - aiter_b3ad6c46:src_6aed3c9825dd64f4
  measurement_evidence: []
  limitations:
  - The existence of a fast-path wrapper says nothing about its speed on a new workload.
  - Do not substitute sigmoid routing for a softmax or grouped-routing contract.
  references:
  - knowledge/operator/moe_routing_topk/README.md
  experience:
  - outcome: beneficial
    conditions:
    - HERD supported sigmoid routing profile; Kimi-K3 gate bias with std approximately 0.025; do not substitute
      unit-variance random bias for the production comparison.
    summary: The Kimi-K3 report supports a conditional HERD candidate; realistic bias and the supported profile
      matter, and no numeric speedup is encoded.
    provenance:
      kind: upstream_report
      references: []
      artifacts: not_published
      verification: not_reproduced
    upstream:
      pr: aiter_pr_5693
      change_refs:
      - profile_gate
      result_refs:
      - kimi_qualitative_benefit
      assessment:
        association:
          level: high
          reasons:
          - The reviewed commit incorporates or changes the named construct in the cited implementation; the
            assessment is limited to this backend and version.
          missing_evidence: []
        attribution:
          scope: bundle
          confidence:
            level: low
            reasons:
            - The report concerns the implementation or validity change as a whole; it does not isolate the
              contribution of this individual direction.
            missing_evidence:
            - isolated_comparison
          isolation_source_refs: []
