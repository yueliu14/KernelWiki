cards:
- id: attention-qk-rope-cache-fusion
  type: performance_candidate
  axes:
  - cache_layout
  - numerical_contract
  - data_movement
  match:
    operator_families:
    - qk_norm_rope_cache
    target_languages:
    - flydsl
    - hip
    - gluon
  question: What must a Q/K normalization, RoPE and cache-write fusion preserve?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - Q/K preparation produces data consumed by attention or an indexer cache.
  actions:
  - Keep normalization weights/epsilon, rotary pair convention, positional indices and cache slot mapping identical
    to the unfused path.
  - For the wave64 builder, enforce its even rotary dimension and vector divisibility requirements before attempting
    packed FP8 stores.
  - 'Separate model-lifetime tensor adapters from request-lifetime tensors: the source caches static weights/cos/sin,
    while request tensors must not be retained as static adapters.'
  alternatives:
  - Keep a sequence of norm, RoPE and cache write operations as the same-contract baseline.
  why:
  - The implementation couples norm/RoPE with vectorized stores and contains separate wave32/wave64 builders
    and static-adapter lifetime handling.
  source_evidence:
  - aiter_b3ad6c46:src_93c5bb1f38501f1d
  - aiter_b3ad6c46:src_9069bff48d95f97b
  measurement_evidence: []
  limitations:
  - The constraints cited for the wave64 builder do not automatically describe the wave32 builder.
  - A successful fusion must match the consumer's quantization and cache layout, not only its Q/K values.
  references:
  - knowledge/operator/qk_norm_rope_cache/README.md
- id: bmm-rope-cache-fused-write-contract
  type: performance_candidate
  axes:
  - cache_layout
  - numerical_contract
  match:
    operator_families:
    - qk_norm_rope_cache
    target_languages:
    - triton
  question: What must remain intact when a batched projection is fused with RoPE and MLA cache writes?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - The selected implementation matches the cited path and its input contract.
  actions:
  - Preserve the distinction between the projected content portion, rotary portion and the final cache concatenation
    layout.
  - Carry the slot/page indices and all cache strides through the fused write; the batch/head projection index
    is not a physical cache slot.
  - For split FP4 projection, account for the separate reduction before treating the projection as a completed
    value.
  alternatives:
  - Keep a simpler implementation with the identical numerical and layout contract for comparison.
  why:
  - The cited source declares these operations and checks; the combination is part of its interface.
  source_evidence:
  - aiter_b3ad6c46:src_03307b826f486d6f
  - aiter_b3ad6c46:src_f1da93f2cb82843a
  measurement_evidence: []
  limitations:
  - A BMM fusion belongs to the Q/K cache-preparation contract as well as the projection; copying only its
    dot loop is incomplete.
  - No new speedup is established by the fused source.
  references:
  - knowledge/operator/qk_norm_rope_cache/README.md
shared_cards: []
