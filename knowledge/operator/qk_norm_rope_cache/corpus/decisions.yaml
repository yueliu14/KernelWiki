- id: splitk-decode-gemm-single-weight-pass-and-xcd-remap
  type: performance_candidate
  axes:
  - data_movement
  - execution_geometry
  - cache_layout
  - numerical_contract
  match:
    operator_families:
    - qk_norm_rope_cache
    target_languages:
    - triton
    gfx:
    - gfx950
  question: How should a skinny split-K decode GEMM that feeds a fused epilogue be tiled and ordered so the
    weight is read from HBM only once?
  evidence_level: reported_experience
  status: candidate_only
  upstream_review:
    status: unreviewed
  conditions:
  - Decode projection with few tokens (M up to 32 in the recorded step) and a large weight, so weight streaming
    dominates the GEMM
  - Split-K partials go to an fp32 workspace and are reduced by a separate fused epilogue (norm, RoPE, cache
    write)
  - Multi-XCD gfx (gfx950, 8 XCDs) where program ids are dispatched round-robin across XCDs
  - The summation order is fixed by the split-K slice count and ascending-K tl.dot accumulation inside each
    slice
  actions:
  - Choose BM >= M so a single M block covers every row and each weight tile is loaded once; the recorded step
    used BM 16 for M<=16 and BM 32 for M>16
  - Launch a 1-D grid of N/BN*SK programs and remap pid so each XCD owns a contiguous 1/8 of the (N tile, K
    slice) space, with K slice fastest
  - Load the weight with the .cg cache modifier and keep the activation load masked on M
  - Retune BN, num_warps and num_stages per M bucket, but keep the split-K count and K-slice width fixed so
    the fp32 partials stay bitwise identical
  - When an installed library launcher does not expose BM or the grid order, copy its kernel locally and launch
    it directly, keeping its accumulation order
  alternatives:
  - Keep the library split-K partial kernel with BM smaller than M, which streams the weight once per M block
  - 'Other pid orders: K slice fastest globally, per-XCD chunk with N tile fastest, identity order, or one
    K slice per XCD'
  - Cache modifiers .cs, .ca or none on the weight load
  - Tuning waves_per_eu instead of tile geometry
  why:
  - With BM < M every M block re-reads the whole weight; the engineer's GEMM microbench went from 27.5 to 18.5us
    when BM=32 covered M>16
  - The engineer chose the per-XCD contiguous order with K slice fastest as the best of the pid orders tried
    and reported +5-10% on the GEMM at M<=16 (comparison baseline not stated)
  - Per the engineer, .ca and no modifier were 2x slower than .cg on the weight stream, and .cs matched .cg
  - Because split-K plus ascending-K fixes the fp32 order, the engineer found every swept BM, BN, BK, warps
    and stages config bitwise identical to the installed partials
  source_evidence: []
  measurement_evidence: []
  limitations:
  - 'Over-padding M did not pay at M<=16: the engineer''s microbench had BM=32 slower than BM=16 there (20.7
    vs 17.3us with BN32)'
  - The copied kernel has no M loop and requires M <= BM; larger (prefill-like) M needs a fallback path
  - The remap assumes 8 XCDs with round-robin dispatch and that N/BN*SK divides evenly by 8
  - 'The engineer judged M<=16 to be near the streaming ceiling: a plain .cg streaming read of the same 75.5MB
    was slower than the GEMM'
  - At M=24/32 the engineer still measured about 2-3us more than at M=8, and attributed it to the fp32 partials
    traffic (4.7MB at M=32), which this change does not address
  - In the engineer's sweep, waves_per_eu 1 and 2 hurt and 4 and 8 were neutral
  - Evidence is one recorded step on a bf16 gfx950 Triton decode projection
  experience:
  - outcome: beneficial
    conditions:
    - Triton bf16 decode QKV projection with q/k norm, RoPE and fp8 cache write, where a split-K 8 GEMM writes
      fp32 partials that a separate epilogue reduces
    - Decode token counts up to 32, with separate configs for M<=16 and M>16
    - gfx950, whose dispatch round-robins program ids over 8 XCDs
    summary: The step replaced the library split-K partial GEMM with a local copy that covers all M rows in
      one block, so the weight is streamed once, and gives each XCD a contiguous share of (N tile, K slice)
      work. It beat its parent. The engineer's own UT put most of the gain at M=24/32 (about 1.32-1.36x), against
      about 1.05-1.07x at M=8/16.
    provenance:
      kind: private_summary
      references: []
      artifacts: not_published
      verification: internally_validated
    context:
      gfx: gfx950
      software: sglang-rocm image 7184d3ae, Triton 3.7.0, PyTorch 2.9.1 ROCm 7.2
      dtype: bf16
      shape_layout: decode QKV projection with q/k norm, RoPE and cache write
