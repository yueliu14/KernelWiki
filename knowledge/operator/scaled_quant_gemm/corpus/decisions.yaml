- id: flydsl-a8-interleaved-schedule
  type: performance_candidate
  axes:
  - pipeline_schedule
  - memory_access
  - workgroup_tile
  - compute_instruction
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - grouped_gemm_moe
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - fp8_e4m3fnuz
    - fp8_e4m3fn
    - int8
  question: How does the FlyDSL A8 kernel interleave LDS reads, global loads and MFMAs, and how does that differ
    between gfx942 and gfx950?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - a K loop whose A tile goes through LDS and whose B is read straight from global memory
  - instruction order is being pinned by hand
  actions:
  - 'On gfx950 for fp8/int8, seed the preload depth from the family''s per-tile table: `dsrd_preload` / `dvmem_preload`
    default to -1, which looks (tile_m, tile_n, tile_k) up in `_TILE_PRELOAD_TABLE` (values 2-8); every other
    architecture and dtype falls back to (0, 0).'
  - After the preload, issue one MFMA at a time and spread the remaining ds-reads and global loads evenly over
    the MFMA sequence (the kernel computes the per-MFMA counts with a ceiling-division distribution), then
    close with a sched barrier.
  - Place the next tile's A ds-writes after the last ds-read of the current tile, and skip the ds-write group
    entirely when async copy writes A straight into LDS.
  - On gfx942 the kernel uses a separate fixed pattern — vmem, a group of MFMAs, one ds-read, another group
    of MFMAs, with ds-writes near the tail — derived from num_acc_n and k_unroll; do not carry the gfx950 preload
    table over.
  - Recompute the counts from your own geometry (LDS loads, global loads, MFMA total) whenever the tile, stage
    count or access width changes, instead of copying the table.
  alternatives:
  - The split-K HGEMM's grouped order — see flydsl-splitk-hot-loop-schedule-bundle.
  - 'No hand schedule: leave ordering to the compiler as the control arm.'
  why:
  - This is the scheduler of the FlyDSL family AITER selects most often in its gfx950 fp8 database, and both
    of its architecture branches are written out in one function.
  - The preload table is keyed by tile, so it is a per-geometry fact rather than a constant that transfers.
  source_evidence:
