- id: flydsl-a8-data-movement-helpers
  type: performance_candidate
  axes:
  - memory_access
  - operand_layout
  - pipeline_schedule
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - grouped_gemm_moe
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    requires:
    - lds_staging
  question: Which global-to-LDS and LDS-to-register helpers do the FlyDSL A8 and MoE GEMMs share, and which
    access widths do they fix?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - an operand is staged through LDS and the other is read preshuffled from global memory, as in the A8 and
    MoE kernels
  actions:
  - 'Move A at one width end to end: the MoE kernels take the largest of 16, 8 or 4 bytes that divides each
    thread''s share of the tile (fp16/bf16 must divide by 16), load that many bytes from global (`buffer_copy_gmem16_dwordx4`
    for 16, raw dword loads for 8 and 4) and store them with the matching XOR16 helper — `lds_store_16b_xor16`,
    `lds_store_8b_xor16` or `lds_store_4b_xor16`. The A8 GEMM uses the same 16-byte global copy and writes
    LDS inline, or skips the register hop with async copy (flydsl-async-copy-by-family).'
  - 'Read A back from LDS one 8-byte K-pack per K32 MFMA step through the same XOR16 swizzle the store used
    (`lds_load_pack_k32`: an 8-byte load, or a 16-byte load split in halves); the GEMM and MoE kernels wrap
    it in a local 64-K variant, `lds_load_packs_k64`.'
  - 'Never stage B: read it preshuffled straight from global into MFMA packs (`load_b_pack_k32`, `load_b_packs_k64`,
    `load_b_tile`) in the layout `make_preshuffle_b_layout` defines — K-packs of 8 or 16 bytes over 1- or 2-byte
    elements; it raises on anything else. The scales have their own preshuffled layout (`make_preshuffle_scale_layout`).'
  - 'Reuse the layer rather than rewriting it: the 2-stage MoE kernels import the same pipeline module and
    write their B loads the same way.'
  alternatives:
  - Stage B through LDS as well (the HGEMM's `b_to_lds`), paying LDS capacity for an unshuffled weight.
  why:
  - These helpers are the data-movement half of the A8 family, named by the widths they fix; a FlyDSL fp8 kernel
    built on them inherits a movement path AITER already ships.
  source_evidence:
  - aiter_a6bb4993:src_54e4ca3a8185528d
