- id: gemm-blockscale-shipped-bucket-structure
  type: performance_candidate
  axes:
  - workgroup_tile
  - work_partition
  - execution_geometry
  - implementation_variant
  - tunable_surface
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - fp8_e4m3fnuz_blockscale
    - fp8_e4m3fn_blockscale
  question: Which configuration does the Triton block-scale baseline run for each case, and what does AITER
    ship instead where it tuned small and large M separately?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - an fp8 128x128 block-scale workload measured against AITER's Triton kernel, especially one whose cases
    span decode and prefill (for example M=8 and M=32768 in one kernel)
  actions:
  - 'Find the baseline''s configuration for every case before planning, in the task''s frozen baseline or through
    the lookup: a per-(N, K) file if AITER tuned that shape, else the generic file, then M_LEQ / M_GEQ buckets,
    then `any`. gfx942 ships block-scale files for nine (N, K) shapes; the generic file''s only entry is `any`
    — a 128x128x128 tile, NUM_KSPLIT = 1, 4 warps — so an untuned shape runs that one configuration at every
    M.'
  - 'Price the fallback per case: at decode M=8 with N=4096 that tile launches 32 workgroups on a 304-CU MI300X,
    a grid-fill gap a FlyDSL decode kernel can close (gemm-split-k-when-grid-underfills); at large M the same
    tile sits inside the range AITER ships for the shapes it did tune.'
  - 'Where AITER did tune a shape, small and large M are different structures: on gfx942 the M<=32 buckets
    ship BLOCK_SIZE_M mostly 4 to 16, BLOCK_SIZE_N mostly 16 and mostly one or two warps, and vary NUM_KSPLIT
    from 1 to 16; from M<=1024 on NUM_KSPLIT is 1, with BLOCK_SIZE_M 64 to 256, BLOCK_SIZE_N mostly 128 and
    mostly four to eight warps.'
  - 'Hold the scale block fixed across regimes: BLOCK_SIZE_K = 128 and the 16x16 MFMA (matrix_instr_nonkdim
    = 16) are shared by every gfx942 bucket, so decode and prefill differ in tile, split and warps, not in
    how K is blocked (gemm-blockscale-k-loop-scale-application).'
  - 'Mirror the tuned shapes rather than the fallback: one entry point that dispatches on M to a kernel specialised
    for each regime, since the tuned tiles differ by more than an order of magnitude in BLOCK_SIZE_M.'
  - 'Know the production competitors per regime too: AITER''s tuned block-scale B-preshuffle database on gfx942
    selects CK in 16 of 18 rows at M<=16 and ASM in 32 of 38 above M=4096.'
  alternatives:
  - One configuration for every case — simpler, and the control arm; expect it to trail on the regime it was
    not chosen for.
  why:
  - In a Triton-to-FlyDSL block-scale task the frozen baseline is this Triton kernel with whatever the lookup
    returned, so the per-case target is readable before any kernel is written.
  - The shipped tables are the only record of which tile and split AITER chose per regime once it did tune
    a shape.
