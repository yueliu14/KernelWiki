provenance:
  schema_version: 4
  operator_family: scaled_quant_gemm
  curator_contract: Conditioned source precedents; target-workload validation decides correctness and performance.
traits:
  lds_staging: 'The design stages at least one operand tile through LDS: it is stored to LDS and the MFMA fragments
    are read back from it.'
  reused_weight: B, the weight, is reused across calls, so a one-time host-side layout transform such as a
    preshuffle is paid once per weight rather than per call.
  split_k_hot_loop: The K loop is hand-scheduled with ROCm scheduling directives over LDS-staged operands,
    as the FlyDSL split-K HGEMM hot loop is.
cards:
- id: flydsl-a8-legality
  type: constraint
  axes:
  - configuration_constraints
  - architecture_capability
  - workgroup_tile
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - fp8_e4m3fnuz
    - fp8_e4m3fn
    - int8
    - int4
    - fp4_e2m1
    - mxfp4
  question: Which FlyDSL A8 / FP4 preshuffle-GEMM configurations are rejected before they can be slow?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - quantized GEMM built on the A8 preshuffle family (fp8, int8/int4, or fp4 on gfx950)
  - candidate configurations are being generated or swept
  actions:
  - 'Filter before compiling: tile_k*elem_bytes must be a multiple of 64; tile_m*tile_k*elem_bytes (halved
    for fp4) must divide evenly over the fixed 256-thread block; and each thread''s share of the A tile must
    be a multiple of the 16-byte load.'
  - Accept only in_dtype in {fp8, int8, int4, fp16, bf16, fp4} and out_dtype in {fp16, bf16}; there is no fp32
    output.
  - On the scaled-MFMA path (gfx95x with non-integer, non-half inputs) require tile_k to be a multiple of 128
    — see flydsl-a8-mfma-selection.
  - 'Treat FP4 as gfx950-only: it raises on other architectures, fp8 activations with fp4 weights are not supported,
    and FP4 with tile_k=128 supports only lds_stage=2.'
  - For int8, confirm the installed FlyDSL exposes `mfma_i32_16x16x32i8` (or the `_i8` spelling); its absence
    raises instead of falling back.
  alternatives:
  - Let the compiler reject configurations only when the search is small; each rejection still costs a compile.
  why:
  - Every item is a check and a raise in the compile entry point, so it is the stated contract rather than
    an inference from a crash.
  - The fixed 256-thread block and the 16-byte A load make several tile shapes that look plausible from the
    HGEMM space illegal here.
  source_evidence:
  - aiter_a6bb4993:src_e1aea77c2c7f9600
  - aiter_a6bb4993:src_6a9c3bef7e7f1bd0
  - aiter_a6bb4993:src_d2906b5ee9f2c4b6
  - aiter_a6bb4993:src_3479ce3bb9436d9d
  - aiter_a6bb4993:src_65bcb0094b2ef2f3
  - aiter_a6bb4993:src_bc08df5300de01f3
  - aiter_a6bb4993:src_7e2a5d7fc5c13904
  - aiter_a6bb4993:src_68781327203b224d
  - aiter_a6bb4993:src_f5c5e87d02b8a8e5
  - aiter_a6bb4993:src_c9b3df8a49dab9d2
  - aiter_a6bb4993:src_f9f2544162138ea2
  references:
  - knowledge/general/backend/flydsl/knobs.md:82-87
  - knowledge/operator/scaled_quant_gemm/backend/flydsl.md:60-78
  measurement_evidence: []
  limitations:
  - These are the checks in AITER's vendored kernel at the pinned commit; an authored kernel with its own staging
    has its own contract.
  - Passing every check means the configuration builds, not that it is fast.
- id: flydsl-a8-mfma-selection
  type: semantic
  axes:
  - compute_instruction
  - architecture_capability
  - workgroup_tile
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - fp8_e4m3fnuz
    - fp8_e4m3fn
    - fp8_e4m3fnuz_blockscale
    - fp8_e4m3fn_blockscale
    - int8
    - int4
    - fp4_e2m1
    - mxfp4
  question: Which MFMA does a FlyDSL quantized GEMM issue per dtype and architecture, and what does that fix
    about tile_k?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - quantized GEMM (fp8, int8/int4, fp4)
  actions:
  - 'fp8: issue `mfma_f32_16x16x32_fp8_fp8` (K=32 per instruction); on gfx95x the A8 kernel switches fp8 to
    the block-scaled `mfma_scale_f32_16x16x128_f8f6f4` (K=128 per instruction).'
  - 'int8, and int4 widened to int8: issue `mfma_i32_16x16x32i8` and keep i32 accumulation until the scale
    is applied.'
  - 'f16 / bf16 inside the same kernel: `mfma_f32_16x16x16f16` / `mfma_f32_16x16x16bf16_1k`.'
  - 'fp4 (gfx950 only): the same x128 scaled MFMA with its operand-format codes set for FP4 and M/N/K packed
    by two.'
  - 'Derive tile_k from the instruction K: a tile_k that is not a multiple of 128 cannot take the gfx950 scaled
    path, which is why the gfx950 A8 catalog has no tile_k=64 tiles.'
  - 'When porting between architectures, keep the fp8 format per arch in view: gfx942 is FNUZ e4m3 (bias 8,
    max 240) and gfx950 is OCP e4m3 (bias 7, max 448), so FNUZ bytes bit-copied onto gfx950 are off by a factor
    of two (background).'
  alternatives:
  - In an authored kernel, keep the unscaled K=32 fp8 MFMA as a control arm on gfx950 when the math contract
    does not need the hardware scale operand.
  why:
  - The dtype branches and the gfx95 switch are explicit in one function, and the instruction K is what sets
    the catalog's tile_k granularity.
  - The instruction choice changes the loop trip count, the scale plumbing and the legal tiles together, so
    it is the first decision rather than a late tuning knob.
  source_evidence:
  - aiter_a6bb4993:src_113ea8d0f42a693d
  - aiter_a6bb4993:src_1255666f8d08f366
  - aiter_a6bb4993:src_84fa26c5447f28f7
  - aiter_a6bb4993:src_bc08df5300de01f3
  - aiter_a6bb4993:src_f9f2544162138ea2
  - aiter_a6bb4993:src_a5d9e08624d3f251
  - aiter_a6bb4993:src_722ebc17457eec5c
  - aiter_a6bb4993:src_d9a92f8642e73d56
  - aiter_a6bb4993:src_011cf8d1222b7906
  - aiter_a6bb4993:src_273e37ba3a8cefa8
  solutions:
  - backend: triton
    mechanism: '`tl.dot` over fp8 tiles inside the block-scale K loop; the compiler selects the fp8 MFMA'
    source_evidence:
    - aiter_a6bb4993:src_f4a3d14442cafc0c
  - backend: gluon
    mechanism: an explicit `instr_shape=[16, 16, 32]` MFMA layout in the fp8 block-scale kernel
    source_evidence:
    - aiter_a6bb4993:src_cf70b9a5bae73954
  references:
  - knowledge/general/hardware/shared/dtype_numerics.md:40-49
  - knowledge/general/hardware/cdna4_mi350/matrix_core_blockscale.md
  - knowledge/general/quantization/fnuz_vs_ocp.md
  - knowledge/operator/scaled_quant_gemm/backend/flydsl.md:30-58
  measurement_evidence: []
  limitations:
  - This is instruction selection in AITER's vendored kernel; it says nothing about which instruction is faster
    for a shape.
  - The FNUZ/OCP statement comes from the background hardware docs, not from this source.
- id: flydsl-a8-scale-granularity-contract
  type: constraint
  axes:
  - compute_instruction
  - epilogue
  - runtime_contract
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - fp8_e4m3fnuz
    - fp8_e4m3fn
    - fp8_e4m3fnuz_blockscale
    - fp8_e4m3fn_blockscale
    - int8
  question: Which scale granularity does the FlyDSL A8 kernel implement, and what changes for a 128x128 block-scale
    contract?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - fp8/int8 GEMM whose math contract names its scale granularity (per-tensor, per-token/per-channel, or [128,128]
    blocks)
  actions:
  - 'Read the A8 family as per-token x per-channel: for fp8/int8 it loads one fp32 scale per output row of
    A and one per output column of B at the last tile and applies them in the epilogue. FP4 is its only block-scaled
    path (per-32 MX scales on gfx950).'
  - 'Do not reuse it unmodified for a [128,128] block-scale contract: those scales change every 128 elements
    of K, so they have to be applied per K block inside the loop (promote the partial to fp32 per block, multiply,
    accumulate), not once at the end — the loop body is gemm-blockscale-k-loop-scale-application.'
  - 'Do not fold arbitrary fp32 block scales into the gfx950 scaled MFMA: its scale operand is E8M0 (a power
    of two), so a general fp32 scale is rounded and parity fails (background).'
  - 'Settle the math contract against the task''s oracle before timing anything: a per-token kernel measured
    against a block-scale oracle fails parity, it does not lose on speed.'
  alternatives:
  - For block scales, keep the A8 kernel's MFMA, staging and schedule as the precedent and change only where
    the scale is applied.
  why:
  - The A8 compile entry point decides `_needs_per_token_scale` from the dtype and loads the row and column
    scales only for the last tile, which is the per-token contract written down.
  - AITER's block-scale databases contain no FlyDSL row at all — every block-scale selection went to CK, CK-Tile
    or ASM — so there is no shipped FlyDSL block-scale kernel to copy.
  source_evidence:
  - aiter_a6bb4993:src_f854f40de1f28585
  - aiter_a6bb4993:src_1255666f8d08f366
  solutions:
  - backend: triton
    mechanism: 'one kernel per granularity, and the difference is where the multiply sits: the per-token kernel
      scales the finished accumulator once after the K loop (`accumulator *= a_scale[:, None] * b_scale[None,
      :]`), the block-scale kernel and its preshuffled variant scale every K block''s `tl.dot` partial inside
      the loop'
    source_evidence:
    - aiter_a6bb4993:src_7a0ec7ada35d7647
    - aiter_a6bb4993:src_426b43e7e6389512
    - aiter_a6bb4993:src_359d07953d540490
  - backend: gluon
    mechanism: the fp8 block-scale kernel stages the A and B scales through LDS with their own shared layouts,
      next to the operands, and multiplies each MFMA partial by them inside the loop
    source_evidence:
    - aiter_a6bb4993:src_1ba1837b9ca062ee
    - aiter_a6bb4993:src_927f1e26846a58fd
    - aiter_a6bb4993:src_db2ae65ef56818a7
  shipped_evidence:
  - aiter_a6bb4993:sel_b7d6386940696a48
  - aiter_a6bb4993:sel_8b543c4558078855
  - aiter_a6bb4993:sel_f1384cc1069c9823
  references:
  - knowledge/operator/dense_gemm/numerics.md:36-52
  - knowledge/general/quantization/block_scaling_mxfp.md:40-49
  - knowledge/operator/scaled_quant_gemm/backend/flydsl.md:96-103
  measurement_evidence: []
  limitations:
  - The per-K-block promote is the arithmetic a block-scale contract requires; its cost on a given shape is
    a measurement, and measured recipes live behind the expert-skill switch.
  - The E8M0 limitation is a hardware fact from the background docs, not from this source.
- id: gemm-blockscale-k-loop-scale-application
  type: semantic
  axes:
  - compute_instruction
  - workgroup_tile
  - runtime_contract
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - fp8_e4m3fnuz_blockscale
    - fp8_e4m3fn_blockscale
  question: How does a 128x128 block-scale GEMM apply its scales inside the K loop, and what does that fix
    about tile_k and the scale indexing?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - the math contract is Y = (X*x_scale) @ (W*w_scale)^T with one fp32 scale per row of X per 128 elements
    of K and one per 128x128 block of W
  actions:
  - 'Scale every K block''s partial before it joins the accumulator: for each 128-wide K block, take the tile''s
    fp32 MFMA partial, multiply it by the outer product of that block''s per-row X scales and per-column-group
    W scales, and add it into a separate fp32 accumulator. Triton writes the loop body as `accumulator += tl.dot(a,
    b) * a_scale[:, None] * b_scale[None, :]`; Gluon as `acc += mfma_out * cur_a_scale[:, None] * cur_b_scale[None,
    :]`.'
  - Make one K tile exactly one scale block. The Triton kernel takes GROUP_K and BLOCK_SIZE_K as separate parameters,
    its docstring requires them equal, and every gfx942 configuration AITER ships sets BLOCK_SIZE_K = GROUP_K
    = GROUP_N = 128 — on gfx942 that is four 16x16x32 fp8 MFMA K-steps between scale multiplies.
  - 'Index the scales per K block: X''s scale is [M, ceil(K/128)] and advances one column per K tile; W''s
    holds one value per 128x128 block, so each output column reads the scale of its 128-wide group for the
    current K block (Triton gathers it as `offs_bn // GROUP_N`).'
  - 'Keep the MFMA unscaled and the scale in software: on gfx942 issue the plain fp8 MFMA (flydsl-a8-mfma-selection);
    on gfx950 do not fold arbitrary fp32 block scales into the scaled MFMA, whose scale operand is E8M0 (flydsl-a8-scale-granularity-contract,
    background).'
  - 'If K is split across workgroups, start every split on a scale-block boundary: Triton offsets the scale
    column by the split start divided by GROUP_K, and every SPLITK_BLOCK_SIZE it ships for gfx942 (512 to 2048)
    is a multiple of 128.'
  alternatives:
  - Stage the scales through LDS with their own layouts, next to the operands, as the Gluon kernel does; the
    background pitfall is feeding the global scale layout straight to the MFMA.
  - The same arithmetic sits inside CK's A/B-scale device operation and ASM's block-scale kernels, as template
    or binary configuration rather than a loop you write.
  why:
  - 'Every block-scale kernel AITER ships multiplies per K block inside the loop, and its per-token kernel
    multiplies once after it: the placement is the math contract, not an optimisation.'
  - AITER has no FlyDSL block-scale kernel (flydsl-a8-scale-granularity-contract), so a FlyDSL author writes
    this loop body from these precedents.
  source_evidence:
  - aiter_a6bb4993:src_426b43e7e6389512
  - aiter_a6bb4993:src_359d07953d540490
  - aiter_a6bb4993:src_7a0ec7ada35d7647
  - aiter_a6bb4993:src_4991e94450b3832a
  - aiter_a6bb4993:src_4f4e8313f9775c89
  solutions:
  - backend: gluon
    mechanism: scales staged through LDS with their own shared layouts; each MFMA partial multiplied by the
      current block's scales inside the loop
    source_evidence:
    - aiter_a6bb4993:src_db2ae65ef56818a7
    - aiter_a6bb4993:src_1ba1837b9ca062ee
    - aiter_a6bb4993:src_927f1e26846a58fd
  - backend: ck
    mechanism: an A/B-scale device operation (`DeviceGemmMultiD_ABScale_Xdl_CShuffle_V3`), plus a block-scale
      B-preshuffle variant
    source_evidence:
    - aiter_a6bb4993:src_73c6170a2792b675
    - aiter_a6bb4993:src_6352032268991afb
  - backend: asm
    mechanism: precompiled block-scale kernels with B preshuffled — the same six on gfx942 and gfx950, every
      one tile_n = 128 (one W scale group per tile) with tile_m 32 to 128 and split-capable; the launcher picks
      tile_m and a split per shape and multiplies the grid by the split
    source_evidence:
    - aiter_a6bb4993:src_381f987b35a586b7
    - aiter_a6bb4993:src_b07a8dc43c913b9d
    - aiter_a6bb4993:src_3865c44e30f36de9
    - aiter_a6bb4993:src_fcf5d73d12271d55
    - aiter_a6bb4993:src_8866d3dbeb612f3a
  shipped_evidence:
  - aiter_a6bb4993:cfg_d2642e1347a53ea1
  - aiter_a6bb4993:cfg_3eff28954f18b5fe
  - aiter_a6bb4993:sel_f7e394faa23e37e6
  - aiter_a6bb4993:sel_f1384cc1069c9823
  references:
  - knowledge/operator/dense_gemm/numerics.md:36-52
  - knowledge/operator/scaled_quant_gemm/tuning.md:50-57
  - knowledge/operator/dense_gemm/numerics.md:59-63
  measurement_evidence: []
  limitations:
  - The per-block multiply is VALU work on every K block; whether it hides behind the MFMAs is a measurement.
  - These are Triton and Gluon spellings; FlyDSL expresses the same loop with its own MFMA, vector and conversion
    ops.
  - Triton's scale strides are its wrapper's layout choice; take the x_scale / w_scale shapes from the task's
    math contract rather than from Triton.
- id: flydsl-a8-preshuffle-config-space
  type: performance_candidate
  axes:
  - workgroup_tile
  - tunable_surface
  - pipeline_schedule
  - epilogue
  - execution_geometry
  match:
    operator_families:
    - dense_gemm
    - scaled_quant_gemm
    - gemm_epilogue_fused
    target_languages:
    - flydsl
    dtypes:
    - fp8_e4m3fnuz
    - fp8_e4m3fn
    - int8
  question: Which tile, LDS-stage, epilogue, async and occupancy combinations will the FlyDSL A8 (fp8/int8)
    preshuffle GEMM build, and how do they differ by architecture?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - fp8 or int8 GEMM with a preshuffled B (the A8 preshuffle family, or an authored kernel modelled on it)
  - a configuration is being chosen or searched
  actions:
  - 'Search tiles from the family''s own catalogs, not from the HGEMM tuples: a shared lds_stage=2 catalog
    spanning tile_m 16-256 (tile_k up to 512 for small M), a smaller separate catalog for lds_stage=1, the
    tile_k=64 tiles 64x256x64 and 128x128x64 only on gfx942, and 256x256x128 only on gfx950.'
  - 'Treat lds_stage, use_cshuffle_epilog, use_async_copy and waves_per_eu as a four-way sweep: the tuner crosses
    lds_stage in {1,2}, cshuffle in {0,1}, async in {0,1} and waves_per_eu in {0..4}.'
  - 'Drop waves_per_eu values above the register estimate before compiling, as the tuner does with `_estimate_max_wpe`:
    tile_m*tile_n/256 accumulator VGPRs per thread for the 256-thread block, times 1.5 for pipeline buffers,
    against the 512-VGPR file.'
  - 'Estimate LDS with the family''s own formula: only the A tile is staged (tile_m*tile_k*elem_bytes, halved
    for fp4); a CShuffle epilogue adds a 2*tile_m*tile_n staging buffer that shares the ping/pong space; lds_stage=2
    keeps two buffers. Compare with `max_lds_bytes_for_tune()`, the per-arch budget.'
  - Start from the defaults the tuner falls back to — gfx942 128x128x128, gfx950 128x256x256, both lds_stage=2
    and waves_per_eu=2 — plus the small-M defaults 16x64x512 and 32x64x512.
  - 'Then seed from what AITER shipped for your bucket (FlyDSL tuned-DB table below): on gfx950 fp8 the M<=16
    selections are mostly 16x64x512 and the M>1024 selections mostly 128x256x128 or 256x128x128, while lds_stage,
    CShuffle, async copy and waves_per_eu each take both values inside the same bucket — those four stay search
    axes.'
  alternatives:
  - Keep the family's per-arch default kernel as the control arm.
  - Use the HGEMM family when the operands are not quantized; the two families share neither knobs nor catalogs.
  why:
  - AITER states the A8 space as module-level catalogs, a combo sweep and two estimators in its tune module,
    so the space is readable rather than guessed.
  - 'The catalogs differ by architecture in ways a copied config will not reveal: a gfx942 tile_k=64 tile does
    not exist on gfx950.'
  source_evidence:
  - aiter_a6bb4993:src_f6f28f20adae28cd
