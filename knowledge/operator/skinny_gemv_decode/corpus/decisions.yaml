  limitations:
  - On gfx942 none of this is callable; see the first action. The rest of the card describes the gfx950 path.
  - That AITER maintains a separate family for small M is a design precedent, not a measurement that it beats
    a well-tuned generic configuration on your shape.
  - The option sets are what the shipped registry enumerates; they are candidates to search, and nothing here
    says which member wins.
  - The family is bf16-only and its LDS budget is its own; do not carry its constants into the generic kernel.
- id: gemm-skinny-decode-wave-split
  type: performance_candidate
  axes:
  - work_partition
  - execution_geometry
  - memory_access
  - implementation_variant
  match:
    operator_families:
    - dense_gemm
    - skinny_gemv_decode
    - scaled_quant_gemm
    target_languages:
    - flydsl
    regimes:
    - decode
  question: How does AITER's hand-written HIP skinny GEMM organise work for M <= 16, and what can a FlyDSL
    decode kernel take from it?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - target_language=flydsl
  - 'decode: M is a handful of rows (AITER''s skinny route covers M <= 16), so an MFMA tile along M is mostly
    padding'
  actions:
  - 'Stage the whole activation in LDS when it fits and keep it there for the workgroup''s lifetime: the `_sml_`
    variant reserves 64 KB — one workgroup per CU on gfx942''s 64 KB LDS, as the source comment intends, while
    gfx950''s 160 KB would fit two — and is chosen when K*M <= 32K elements for bf16/fp16 (64K for the fp8
    variant); up to 1.2x of that the `_hf_` variant, beyond it `_big_`.'
  - 'Split the output rows over every CU and the K dimension over the lanes: each wave owns YTILE rows of the
    weight, waves per workgroup are sized with `mindiv(rows, CuCount * YTILE, WvPrGrp)`, and each lane takes
    A_CHUNK elements of K per step.'
  - Reduce the lanes' partial dot products inside the wave with cross-lane shuffles (`__shfl_xor`, `__shfl`)
    — no second kernel and no atomics.
  - 'Treat the knobs as a family, not constants: THRDS, YTILE, WvPrGrp, A_CHUNK and UNRL are template parameters
    of every variant.'
  - 'Compare with the FlyDSL small-M HGEMM (flydsl-small-m-hgemm-family), which answers the same regime with
    16-row MFMA tiles: choose the structure for a FlyDSL decode kernel by measurement, not by precedent.'
  alternatives:
  - An MFMA tile with split-K across workgroups (gemm-split-k-when-grid-underfills) — what the FlyDSL HGEMM
    and the Triton baselines do at decode.
  why:
  - It is AITER's default bf16/fp16 decode kernel (gemm-default-backend-routing), and its launcher is the grid-fill
    rule for decode written in HIP.
  source_evidence:
  - aiter_a6bb4993:src_b8e76e6d00fd7ca3
  - aiter_a6bb4993:src_abfa46c903cb04ea
  - aiter_a6bb4993:src_abb2ef768886f8dc
  - aiter_a6bb4993:src_4afbdde799d96232
