  - aiter_a6bb4993:src_0b8de37c2b304d4a
  - aiter_a6bb4993:src_c99341de831ed9d8
  - aiter_a6bb4993:src_f9a2106c23412f25
  - aiter_a6bb4993:src_d33d9c364eba88bd
  - aiter_a6bb4993:src_d78de056f0337d85
  - aiter_a6bb4993:src_5147e7cddd350323
  - aiter_a6bb4993:src_2577a978dcbebafb
  references:
  - knowledge/operator/skinny_gemv_decode/tuning.md:16-33
  - knowledge/general/backend/flydsl/knobs.md:77-80
  measurement_evidence: []
  limitations:
  - The HIP family is fp16/bf16 plus an fp8 variant that multiplies by two scalar (per-tensor) scales at the
    end; a block-scale decode kernel still needs the per-K-block scale loop.
  - 'Its structure is a precedent for a FlyDSL decode kernel, not a drop-in: FlyDSL has no skinny kernel in
    AITER to copy.'
