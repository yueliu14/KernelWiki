provenance:
  schema_version: 4
  operator_family: skinny_gemv_decode
  curator_contract: Conditioned source precedents; target-workload validation decides correctness and performance.
traits:
  lds_staging: 'The design stages at least one operand tile through LDS: it is stored to LDS and the MFMA fragments
    are read back from it.'
  reused_weight: B, the weight, is reused across calls, so a one-time host-side layout transform such as a
    preshuffle is paid once per weight rather than per call.
  split_k_hot_loop: The K loop is hand-scheduled with ROCm scheduling directives over LDS-staged operands,
    as the FlyDSL split-K HGEMM hot loop is.
cards:
- id: flydsl-small-m-hgemm-family
  type: performance_candidate
  axes:
  - implementation_variant
  - architecture_capability
  - workgroup_tile
  - work_partition
  - execution_geometry
  match:
    operator_families:
    - dense_gemm
    - skinny_gemv_decode
    target_languages:
    - flydsl
    dtypes:
    - bf16
    exclude_gfx:
    - gfx942
    shape:
      m_max: 16
  question: What does AITER do differently when M is a handful of rows, and which knobs does that open?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - operator_family=gemm
  - target_language=flydsl
  - M is small — the shipped routing threshold is M < 17
  - dtype is bf16
  actions:
  - 'Check the architecture first. gfx942 is excluded by the source: the compile entry point raises and the
    config registry returns an empty set before it looks at the shape. gfx950 is where the registry is exercised;
    other architectures are not excluded by the gate but have no shipped configuration. On gfx942 read this
    card as a porting reference.'
  - 'Treat small M as a different kernel family rather than the generic kernel with a smaller tile: AITER routes
    it to a separate implementation selected by an explicit kernel_family value.'
  - In that family tile_m is fixed at 16 with block_m_warps=1 and 2 stages — the M dimension stops being a
    search axis, and the search moves entirely onto N and K.
  - Search tile_n far wider than the generic family allows — the shipped set runs (32, 64, 96, 128, 160, 192,
    224, 256, 384, 512, 768, 1024) — with tile_k in (32, 64, 96, 128, 160, 192, 256) and split_k up to 32.
  - 'Consider the axes this family adds and the generic one does not: n_tile_repeat, persistent_n_tiles, waves_per_eu
    and a b_to_lds unroll factor.'
  - 'Respect the combination rules: n_tile_repeat > 1 only without B-in-LDS and only for the two shipped shapes;
    persistent_n_tiles > 1 only with B-in-LDS, tile_n >= 128, block_n_warps >= 2 and no more persistent tiles
    than N/tile_n.'
  - 'Give the generic family a real arm, not a token one: all 86 FlyDSL rows AITER ships for gfx950 bf16 at
    M<=16 are generic-family kernels (mostly tile_m=32 with split_k 4-16), none from this family. The database
    does not say whether this family was in that race.'
  alternatives:
  - Stay on the generic family with a small tile_m and split_k > 1 when a second kernel cannot be written or
    maintained; that is what AITER shipped for these buckets and is the cheaper first move.
  - Port the HIP skinny kernels' structure instead — rows spread over CUs, K split across the lanes of a wave,
    no combine (gemm-skinny-decode-wave-split). That is what AITER's default route runs for an untuned bf16
    decode case, on both architectures.
  - Keep the generic default configuration as the control arm regardless of which family is chosen.
  why:
  - A skinny-M GEMM is bounded by how much of the machine the few M tiles can occupy, and every axis this family
    adds — repeat, persistent tiles, waves per EU — is an occupancy axis rather than a tiling one.
  - The routing threshold, the fixed tile_m and the option sets are stated as named constants in the source,
    so the boundary between the two families is readable rather than folklore.
