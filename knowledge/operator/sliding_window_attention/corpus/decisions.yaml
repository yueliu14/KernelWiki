cards:
- id: attention-window-prefix-boundaries
  type: constraint
  axes:
  - attention_semantics
  - kv_partition
  match:
    operator_families:
    - sliding_window_attention
    - chunked_prefill
    - attention_prefill_fmha
    target_languages:
    - triton
    - gluon
    - flydsl
  question: How do cached prefixes and sliding windows change the causal boundary?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - Queries cover only a suffix/chunk, or the model restricts each query to a local attention window.
  actions:
  - Express the causal boundary in logical sequence coordinates including the cached prefix; do not substitute
    the query tile's local row number.
  - Intersect the sliding window, causal boundary and actual sequence length before dropping KV tiles.
  - Preserve the unified kernel's restriction that SPLIT_UNMASKED_LOOP is incompatible with sliding-window
    attention.
  alternatives:
  - Retain per-element score masking while first validating any tile-pruning optimization.
  why:
  - The extend kernel distinguishes prefix/cache work from extension work; unified attention separately prunes
    window tiles and asserts the loop restriction.
  source_evidence:
  - aiter_b3ad6c46:src_77fdd041c1e25e15
  - aiter_b3ad6c46:src_49cb5bdc816cb102
  measurement_evidence: []
  limitations:
  - An optimization for fully valid KV tiles is not valid for every prefix/window boundary.
  references:
  - knowledge/operator/sliding_window_attention/README.md
  - knowledge/operator/chunked_prefill/README.md
  - knowledge/operator/attention_prefill_fmha/README.md
- id: windowed-attention-backend-admission
  type: constraint
  axes:
  - implementation_contract
  - attention_semantics
  match:
    operator_families:
    - sliding_window_attention
    target_languages:
    - triton
  question: Which additional conditions must hold before selecting the gfx950 Gluon unified-attention path?
  evidence_level: source_observed
  status: candidate_only
  conditions:
  - The selected implementation matches the cited path and its input contract.
  actions:
  - Check the wrapper eligibility predicate with windowing and all other active features, not just the GPU
    name.
  - At this snapshot the gfx950 Gluon predicate excludes softcap, QQ bias and ALiBi; it also constrains head
    widths, Q/cache dtypes and shuffled-cache block geometry.
  - Preserve an applicable alternate backend when a feature combination does not satisfy the predicate.
  alternatives:
  - Keep a simpler implementation with the identical numerical and layout contract for comparison.
  why:
  - The cited source declares these operations and checks; the combination is part of its interface.
  source_evidence:
  - aiter_b3ad6c46:src_1ae1d84244f6eca6
  measurement_evidence: []
  limitations:
  - A wrapper eligibility predicate is version-specific and is not a hardware impossibility claim.
  - This predicate does not replace checking the per-query sliding-window bounds.
  references:
  - knowledge/operator/sliding_window_attention/README.md
- id: window-specific-split-metadata
  type: performance_candidate
  axes:
  - implementation_contract
  - kv_partition
  match:
    operator_families:
    - sliding_window_attention
    target_languages:
    - triton
    - gluon
    - flydsl
    - hip
    - ck
    - asm
    - tilelang
  question: Does decode use split metadata for the attended window or for the full context?
  evidence_level: reported_experience
  status: candidate_only
  conditions: &id001
  - A sliding-window decode path carries separate full-context and window-local KV metadata.
  actions:
  - Trace the split-count tensor through eager initialization, graph updates and the final launch; select the
    metadata corresponding to the attended KV domain.
  - Validate both sliding and full-attention layers plus short/long contexts when changing the split cap.
  why:
  - A historical serving report found window-local split metadata was prepared but not consumed by the decode
    launch; a global cap also harmed a different regime.
  alternatives:
  - Keep the existing correct implementation as the baseline and fallback; compare changes on the same workload.
  source_evidence: []
  measurement_evidence: []
  limitations:
  - The reported framework bug and flags are revision-specific. A fixed split count is not a universal window-attention
    setting.
  references:
  - knowledge/operator/sliding_window_attention/README.md
  - knowledge/general/README.md
  experience:
  - outcome: mixed
    conditions: *id001
    summary: A historical serving report found window-local split metadata was prepared but not consumed by
      the decode launch; a global cap also harmed a different regime.
    provenance:
      kind: historical_summary
      references:
      - https://github.com/AMD-AGI/GEAK/blob/02bfbb0b72746941be3ab3ad48fb21a284ae2fde/e2e_workflow/knowledge/learned/decode-attn-splitkv-triton-gfx950-sglang.md
      artifacts: not_published
      verification: not_reproduced
shared_cards: []
