    summary: Read both pinned GEAK summaries. The block-sparse SUB_K account explicitly attributes the merged
      optimization to vLLM and its gfx942/gfx950 path, without an identifying PR URL or implementation commit.
      Neither summary establishes an AITER PR for the reported run. Preserve the external-upstream and historical
      experiment contexts; AITER association and effect confidence remain unknown.
  conditions:
