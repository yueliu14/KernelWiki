decisions:
- id: post-attention-preserve-handoff
  question: What must a post-attention monokernel return to the next layer?
  axes:
  - fusion_boundary
  - numerical_contract
  - data_lifetime
  status: candidate_only
  conditions:
  - The framework retains attention and passes its unprojected output plus the residual into a fused projection/MoE
    path.
  actions:
  - Return reduced MoE output and the residual after attention as separate values.
  - Leave the final MoE residual addition to the next input norm when using the PLAIN_ADD handoff.
  - 'Preserve padded-row semantics: negative slots join no expert and produce zero MoE output; their seam residual
    is unspecified.'
  rationale:
  - The live caller records the returned buffers in the residual stream instead of immediately adding them.
  alternatives:
  - Use the ordinary projection, residual/norm, router, expert and collective sequence.
  case_refs:
  - minimax_m31_decode
  source_refs:
  - sgl_amd_mono_7a4a552d:m31_boundary
  - sgl_amd_mono_7a4a552d:m31_call
  - sgl_amd_mono_7a4a552d:m31_runner
  - sgl_amd_mono_7a4a552d:m31_stages
  effect:
    outcome: not_assessed
    summary: This pass records an implemented contract. A comparable baseline/candidate performance result
      and an isolated effect for this decision have not been assessed.
  assessment:
    implementation:
      level: high
      reasons:
      - The pinned case entry and named implementation establish this scoped mechanism; this is not runtime
        or numerical validation.
      missing_evidence:
      - target_model_engagement
    effect:
      level: unknown
      reasons:
      - No comparable workload measurement is encoded for this decision.
      missing_evidence:
      - paired_measurement
      - correctness_result
      - runtime_environment
    attribution:
      level: unknown
      reasons:
      - Source inspection does not isolate the performance contribution of this mechanism.
      missing_evidence:
      - controlled_ablation
  validation_plan:
  - Check both returned buffers, the following norm and final norm; include padded rows and routing differences.
  - Use the model-specific numerical envelope and an end-to-end accuracy check when changing precision or router
    order.
  limitations:
  - This fusion starts after attention and does not remove its KV work.
  - The public check compares a tolerance-bounded path; it is not evidence of bitwise equivalence.
- id: post-attention-gate-compiled-residency
  question: How should persistent fusion admission depend on compiled occupancy?
  axes:
  - scheduling
  - dispatch
  - compilation
  status: candidate_only
  conditions:
  - Progress depends on the whole persistent grid being resident.
  - Resource use can vary by compiled shape or specialization.
  actions:
  - Query occupancy for the compiled binary and block size, then reject a width if resident blocks per CU times
    CU count is smaller than the grid.
  - Repeat the check after changing fusion extent, tile geometry or compiler version; keep an ordinary fallback
    outside the accepted envelope.
  rationale:
  - FfnRunner.warm checks every compiled width against the 256-CTA grid before live execution.
  alternatives:
  - Reduce resource pressure or redesign the scheduling/progress protocol.
  - Use separate launches for stages that cannot meet the residency requirement.
  case_refs:
  - minimax_m31_decode
  source_refs:
  - sgl_amd_mono_7a4a552d:m31_runner
