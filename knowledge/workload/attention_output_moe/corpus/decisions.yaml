  validation_plan:
  - Inspect register/LDS use and occupancy for every admitted width.
  - Stress progress and guard behavior under graph replay; measure complete-chain latency, not occupancy alone.
  limitations:
  - Passing the occupancy check is necessary for this protocol but is not a complete proof of deadlock freedom
    or performance.
- id: post-attention-peer-buffer-epochs
  question: How can fused compute and collectives reuse peer buffers without accepting stale data?
  axes:
  - communication
  - synchronization
  - data_lifetime
  status: candidate_only
  conditions:
  - Several layer/width runners share peer-visible storage with tagged payloads.
  actions:
  - Share the epoch across every runner using the same peer buffer and keep the launch sequence consistent
    across ranks.
  - Advance or recycle tags only after the required completion marks; preserve the tag-cycle clearing boundary
    and guards.
  rationale:
  - The runner documents buffer-lifetime epoch ownership, and the kernel completes work before advancing the
    epoch and clearing a reused cycle.
  alternatives:
  - Give independent runners independent storage and synchronization lifetimes.
  - Keep ordinary collectives as the reference path.
  case_refs:
  - minimax_m31_decode
  source_refs:
