- id: layer-deferred-residual-ownership
  question: When can a layer defer its residual update into the next consumer?
  axes:
  - data_lifetime
  - fusion_boundary
  - numerical_contract
  status: candidate_only
  conditions:
  - A consumer understands the pending output, residual, post/combine and pre-mix representation.
  actions:
  - Represent pending versus settled residuals explicitly and apply the post update exactly once.
  - Respect the first-layer, Engram and final-head boundaries; retain captured auxiliary hidden states and
    token-parallel row ownership.
  rationale:
  - The forward carries pending state between layers and settles it when a consumer requires the ordinary representation.
  alternatives:
  - Materialize each residual update before calling the next layer.
  case_refs:
  - deepseek_v41_decode
  source_refs:
