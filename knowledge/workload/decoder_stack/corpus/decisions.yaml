  validation_plan:
  - Compare all snapshots and cache mutations for mixed acceptance lengths, padding, multiple requests and
    multimodal positions.
  - Test the following accepted/draft step, not just the current returned hidden state.
  limitations:
  - The reviewed target spec excludes ReplaySSM; the separate MTP draft implementation is outside this case.
- id: stack-bound-fusion-depth
  question: How should cross-layer fusion depth be bounded?
  axes:
  - fusion_boundary
  - compilation
  - measurement
  status: candidate_only
  conditions:
  - Layer bodies are unrolled at compile time and each supported row shape requires specialization.
  actions:
  - Choose a bounded layer group and preserve special first/prelude and final-mixer boundaries.
  - Compare compilation cost, code size, resource use and steady-state latency while retaining identical state
    semantics.
  - Count the 13 stack launches separately from logits, host-issued epoch updates and other serving work.
  rationale:
  - The reviewed plan uses layer 0, layers 1..3, then groups of four; the documentation gives code size and
    compilation time as reasons for the bound.
  alternatives:
  - Use one layer per launch.
  - Evaluate larger groups only with a measured resource and compilation budget.
  case_refs:
  - qwen38_flash_next_verify
  source_refs:
