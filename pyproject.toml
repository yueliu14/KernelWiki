[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelwiki"
version = "0.2.0"
description = "Operator-centered GPU kernel knowledge and reproducible source bundles"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["kernelwiki", "kernelwiki._store"]

[tool.pytest.ini_options]
testpaths = ["tests", "kernelwiki/_store/tests"]
